<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模拟题库</title>
<style>
:root{
  --bg:#f4f6fa; --panel:#ffffff; --panel2:#f8fafc; --text:#1e293b; --muted:#64748b;
  --border:#e2e8f0; --primary:#4f6ef7; --primary-h:#3b55e0; --primary-soft:#eef1fe;
  --green:#16a34a; --green-soft:#e8f7ee; --red:#dc2626; --red-soft:#fdecec;
  --amber:#d97706; --amber-soft:#fdf3e3; --shadow:0 1px 3px rgba(15,23,42,.08),0 4px 16px rgba(15,23,42,.05);
  --radius:12px;
}
html[data-theme="dark"]{
  --bg:#0f1420; --panel:#171e2e; --panel2:#1c2436; --text:#e6eaf2; --muted:#8b95a8;
  --border:#28324a; --primary:#6b85ff; --primary-h:#8297ff; --primary-soft:#222b45;
  --green:#34c471; --green-soft:#17301f; --red:#f05a5a; --red-soft:#331a1a;
  --amber:#e8a23c; --amber-soft:#33270f; --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
}
/* ---------- 护眼主题（低刺激背景，均按「背景-面板-文字」三阶搭配，饱和度低、对比柔和） ---------- */
html[data-theme="eye-green"]{   /* 豆沙绿：经典护眼色，长时间阅读最不易疲劳 */
  --bg:#c8e6c9; --panel:#f0f7f0; --panel2:#e2efe3; --text:#26382b; --muted:#5d7461;
  --border:#cfe3d1; --primary:#3f7d4e; --primary-h:#336b41; --primary-soft:#dcecdf;
  --green:#2e7d43; --green-soft:#ddefe2; --red:#c0392b; --red-soft:#f6e0dc;
  --amber:#b0721a; --amber-soft:#f5ead4; --shadow:0 1px 3px rgba(38,56,43,.08),0 4px 16px rgba(38,56,43,.05);
}
html[data-theme="parchment"]{   /* 羊皮纸：暖黄低蓝光，像在纸上看书 */
  --bg:#f1e6cd; --panel:#faf4e6; --panel2:#f3ead7; --text:#46381f; --muted:#8a7a58;
  --border:#e4d5b4; --primary:#9a6b1f; --primary-h:#825a17; --primary-soft:#f2e7cd;
  --green:#5e7d34; --green-soft:#e9efda; --red:#b03a2e; --red-soft:#f7e2de;
  --amber:#a06a17; --amber-soft:#f4e8cf; --shadow:0 1px 3px rgba(70,56,31,.10),0 4px 16px rgba(70,56,31,.06);
}
html[data-theme="linen"]{       /* 米白亚麻：接近纸白，中性不偏色 */
  --bg:#efe8dc; --panel:#faf6ef; --panel2:#f2ebdf; --text:#3c3527; --muted:#857c6a;
  --border:#e3dac9; --primary:#7a6a45; --primary-h:#655635; --primary-soft:#efe7d6;
  --green:#5f7a3d; --green-soft:#e9eedd; --red:#a94438; --red-soft:#f6e3e0;
  --amber:#9c6f1f; --amber-soft:#f3e9d3; --shadow:0 1px 3px rgba(60,53,39,.08),0 4px 16px rgba(60,53,39,.05);
}
html[data-theme="mist"]{        /* 浅灰蓝：冷色系，适合喜欢清爽感的用户 */
  --bg:#e4eaf0; --panel:#f5f8fb; --panel2:#ebf0f6; --text:#2a3742; --muted:#67788a;
  --border:#d4dee7; --primary:#4a6fa5; --primary-h:#3c5d8d; --primary-soft:#e2ebf4;
  --green:#3d7d5a; --green-soft:#ddefe6; --red:#bb4430; --red-soft:#f7e3de;
  --amber:#a9741f; --amber-soft:#f4ead2; --shadow:0 1px 3px rgba(42,55,66,.08),0 4px 16px rgba(42,55,66,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
#app{display:flex;min-height:100vh}
/* ---------- 侧边栏 ---------- */
.sidebar{width:212px;background:var(--panel);border-right:1px solid var(--border);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:fixed;top:0;bottom:0;left:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;padding:6px 10px 18px}
.logo:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:8px}
.logo .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#4f6ef7,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px}
.logo b{font-size:15px;line-height:1.2}
.logo small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;color:var(--muted);transition:.15s;user-select:none}
.nav-item:hover{background:var(--panel2);color:var(--text)}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav-item .ico{width:18px;text-align:center;flex:none}
.nav-item .ico svg{display:block;margin:0 auto}
.nav-item .txt{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* 长按排序：按住 0.4s 进入拖动——按下时轻微下压给出反馈，成立后半透明跟手 */
.nav-item.nav-arming{background:var(--panel2);transform:scale(.96)}
.nav-item.nav-dragging{opacity:.45;cursor:grabbing}
.nav-item.drop-above{box-shadow:0 -2px 0 0 var(--primary)}
.nav-item.drop-below{box-shadow:0 2px 0 0 var(--primary)}
body.nav-sorting{cursor:grabbing;user-select:none}
.nav-item:active{cursor:grabbing}
.sidebar .foot{margin-top:auto;padding:10px;color:var(--muted);font-size:11px;line-height:1.6}
/* ---------- 导航栏宽度调节 ---------- */
/* 变量由 JS 写入 html[data-navw]，默认 212px；折叠态 64px 由变量接管 */
:root{--navw:212px}
.sidebar{width:var(--navw)}
.main{margin-left:var(--navw)}
/* 拖拽手柄：贴在侧栏右边缘，8px 宽热区，1px 可视分隔线 */
#navResizer{position:fixed;top:0;bottom:0;left:var(--navw);width:8px;margin-left:-4px;cursor:col-resize;z-index:22;display:flex;justify-content:center;background:transparent}
#navResizer::after{content:'';width:2px;height:100%;background:transparent;transition:background .15s}
#navResizer:hover::after,#navResizer.dragging::after{background:var(--primary);opacity:.55}
#navResizer.dragging::after{opacity:.85}
body.is-desktop #navResizer{top:36px}
body.nav-dragging{cursor:col-resize!important;user-select:none}
body.nav-dragging *{cursor:col-resize!important}
/* 折叠态（窄屏自动进入，也可手动点按钮） */
body.nav-collapsed .sidebar .logo b,
body.nav-collapsed .sidebar .logo small,
body.nav-collapsed .sidebar .nav-item span.txt,
body.nav-collapsed .sidebar .foot{display:none}
body.nav-collapsed .sidebar{padding-left:8px;padding-right:8px;align-items:center}
body.nav-collapsed .sidebar .logo{padding:6px 0 14px;justify-content:center}
body.nav-collapsed .nav-item{width:44px;justify-content:center;padding:10px 0}
/* 侧栏底部工具条：折叠按钮 + 宽度提示 */
.sidebar .nav-tools{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:flex;align-items:center;gap:6px}
.nav-tool-btn{flex:1;height:28px;display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:7px;font-size:11px;font-family:inherit;cursor:pointer;transition:.15s;padding:0 6px;white-space:nowrap}
.nav-tool-btn:hover{background:var(--panel2);color:var(--text);border-color:var(--primary)}
.nav-tool-btn.wide{flex:none;width:26px;padding:0}
body.nav-collapsed .sidebar .nav-tools{flex-direction:column;width:44px}
body.nav-collapsed .sidebar .nav-tools .nav-tool-btn{width:44px;flex:none}
#navWidthTip{position:fixed;z-index:80;padding:3px 8px;border-radius:6px;background:rgba(30,36,48,.86);color:#fff;font-size:11px;pointer-events:none;display:none;font-variant-numeric:tabular-nums}
#navWidthTip.show{display:block}
/* 宽度调节弹窗里的缩略预览：按比例缩小的侧栏示意 */
.navw-preview{display:flex;align-items:flex-end;gap:14px;margin:12px 0 14px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);min-height:96px}
.navw-mini{height:72px;flex:none;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:9px 6px;display:flex;flex-direction:column;gap:6px;transition:width .06s linear}
.navw-mini i{display:block;height:7px;border-radius:3px;background:var(--muted);opacity:.55}
.navw-mini i:first-child{background:var(--primary);opacity:.85;height:9px}
.navw-num{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.navw-num b{font-size:20px;color:var(--primary);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:var(--border);outline:none;margin:5px 0 10px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--primary);border:2px solid var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.22);cursor:pointer}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--primary);border:2px solid var(--panel);cursor:pointer}
/* ---------- 背景主题色卡 ---------- */
.theme-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.theme-card{display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:10px;border:2px solid var(--border);background:var(--panel);cursor:pointer;font-size:12px;color:var(--text);font-family:inherit;transition:.15s}
.theme-card:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.theme-card.active{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft);font-weight:600}
.theme-card .sw{width:22px;height:22px;border-radius:6px;border:1px solid rgba(0,0,0,.18);flex:none}
/* ---------- 主区域 ---------- */
.main{margin-left:var(--navw);flex:1;padding:24px 28px;max-width:1200px}
h1{font-size:20px;margin-bottom:4px}
.sub{color:var(--muted);margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:14px}
.grid.c4{grid-template-columns:repeat(4,1fr)}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat .num{font-size:26px;font-weight:700;margin-top:2px}
.stat .lbl{color:var(--muted);font-size:12px}
.stat.a .num{color:var(--primary)} .stat.b .num{color:var(--green)} .stat.c .num{color:var(--amber)} .stat.d .num{color:var(--red)}
/* ---------- 控件 ---------- */
button{font:inherit;border:none;cursor:pointer;border-radius:8px;padding:8px 16px;background:var(--panel2);color:var(--text);transition:.15s}
button:hover{filter:brightness(.97)}
html[data-theme="dark"] button:hover{filter:brightness(1.15)}
button.primary{background:var(--primary);color:#fff;font-weight:600}
/* 下载更新按钮：进度填充画在 background-image 上，底色仍是按钮本色 */
#updDownload{background-clip:padding-box;transition:background-image .18s linear,border-color .18s linear,box-shadow .18s linear}
button.primary:hover{background:var(--primary-h);filter:none}
button.danger{background:var(--red-soft);color:var(--red)}
button.ghost{background:transparent;border:1px solid var(--border)}
button:disabled{opacity:.5;cursor:not-allowed}
button.sm{padding:5px 10px;font-size:12px;border-radius:6px}
input,select,textarea{font:inherit;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
textarea{resize:vertical;min-height:90px}
.f{display:block;margin-bottom:12px}
.f-lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pill.blue{background:var(--primary-soft);color:var(--primary)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.gray{background:var(--panel2);color:var(--muted)}
.tag{cursor:pointer;border:1px solid var(--border);padding:6px 14px;border-radius:99px;font-size:13px;user-select:none;transition:.15s}
.tag.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px}
tr.click:hover{background:var(--panel2);cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:40px 0;line-height:1.8}
/* ---------- 科目 ---------- */
.subj-tag{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:18px;padding:0 5px;
  border-radius:5px;color:#fff;font-size:11px;font-weight:700;letter-spacing:.5px;flex:none}
.subj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.subj-card{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--panel2);
  display:flex;flex-direction:column;gap:8px;transition:.15s}
.subj-card.on{border-color:var(--primary);background:var(--primary-soft)}
.subj-card .t{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.subj-card .m{color:var(--muted);font-size:12px}
.subj-sw{width:20px;height:20px;border-radius:5px;cursor:pointer;border:2px solid transparent;flex:none}
.subj-sw.on{border-color:var(--text);box-shadow:0 0 0 2px var(--panel)}
.subj-inline{display:flex;align-items:center;gap:6px}
/* ---------- 题目渲染 ---------- */
.q-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px;background:var(--panel)}
.q-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.q-content{font-size:14px;line-height:1.7;white-space:pre-wrap}
.q-opt{padding:6px 10px;margin:4px 0;border-radius:8px;line-height:1.5}
.q-opt.sel{background:var(--primary-soft);border:1px solid var(--primary)}
.q-opt.correct{background:var(--green-soft);border:1px solid var(--green)}
.q-opt.wrong{background:var(--red-soft);border:1px solid var(--red)}
.q-ans{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--panel2);font-size:13px;line-height:1.7}
.q-ans b{color:var(--green)}
.q-src{margin-top:8px;font-size:12px;color:var(--muted);border-left:3px solid var(--border);padding-left:10px;line-height:1.6}
.opt-click{cursor:pointer;border:1px solid transparent;user-select:none}
/* ---------- 其他 ---------- */
.progress{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:.3s}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.bar-row .name{width:110px;color:var(--muted);flex-shrink:0}
.bar-row .bar{flex:1;height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar-row .bar i{display:block;height:100%;background:linear-gradient(90deg,#4f6ef7,#8b5cf6);border-radius:99px}
.bar-row .val{width:90px;text-align:right}
/* ---------- v1.1 新增组件 ---------- */
.nav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;margin-bottom:16px}
.nav-grid .qi{padding:6px 0;text-align:center;border:1px solid var(--border);border-radius:8px;font-size:12px;cursor:pointer;background:var(--panel)}
.nav-grid .qi.cur{border-color:var(--primary);color:var(--primary);font-weight:700;box-shadow:0 0 0 2px var(--primary-soft)}
.nav-grid .qi.ok{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.nav-grid .qi.no{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px}
.pager button{padding:5px 12px;font-size:12px}
.chk{width:16px;height:16px;accent-color:var(--primary);cursor:pointer}
.kbd{display:inline-block;padding:1px 6px;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;font-size:11px;color:var(--muted);background:var(--panel2)}
/* ---------- 知识点图谱缩放控件 ---------- */
#kpWrap{position:relative}
.kpz{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px;z-index:3;user-select:none}
.kpz button{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--panel);color:var(--text);
  font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.kpz button:hover{background:var(--primary);border-color:var(--primary);color:#fff}
.kpz .lbl{font-size:11px;color:var(--muted);text-align:center;font-weight:700}
.kpz button.on{background:var(--primary);border-color:var(--primary);color:#fff}
/* v1.28.3：斥力调节浮层（右上角「⇹」按钮展开） */
.kp-repel{position:absolute;right:54px;top:12px;z-index:4;display:none;width:188px;
  background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 11px;
  box-shadow:0 8px 24px rgba(0,0,0,.16);user-select:none}
.kp-repel-hd{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:6px}
.kp-repel-hd b{color:var(--text);font-size:12px}
.kp-repel-hd span{color:var(--primary);font-weight:700;font-variant-numeric:tabular-nums}
.kp-repel-hd button{border:1px solid var(--border);background:var(--panel);color:var(--muted);
  border-radius:6px;font-size:11px;line-height:1;padding:3px 6px;cursor:pointer;font-family:inherit}
.kp-repel-hd button:hover{border-color:var(--primary);color:var(--primary)}
.kp-repel input[type=range]{width:100%;accent-color:var(--primary);cursor:pointer;margin:0}
.kp-repel-tip{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}
.kp-legend{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--muted);background:var(--panel);
  border:1px solid var(--border);border-radius:8px;padding:4px 10px;opacity:.9;pointer-events:none;z-index:2}
/* 悬停提示浮层：跟随鼠标，不挡操作 */
/* v1.28.0：开关做成小勾+文字，不再用大胶囊；图例可点击过滤 */
.kp-tgl{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);cursor:pointer;
  white-space:nowrap;user-select:none}
.kp-tgl:hover{color:var(--text)}
.kp-tgl input{accent-color:var(--primary);cursor:pointer;margin:0;width:13px;height:13px;flex:none}
/* v1.28.2：图例改成真正的按钮（有热区、有 hover/按下反馈），点一下只看该类关联 */
#kpLegend,#kpMastery{display:inline-flex;align-items:center;gap:2px;flex-wrap:wrap}
/* v1.28.4：掌握度图例也能点（只看某一档的节点），圆点用节点同色 */
.kp-legend-item .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.kp-legend-item{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);
  cursor:pointer;user-select:none;font-family:inherit;line-height:16px;
  border:1px solid var(--border);background:var(--panel);border-radius:99px;padding:2px 9px;
  transition:background .12s,color .12s,border-color .12s}
.kp-legend-item:hover{color:var(--text);background:var(--panel2);border-color:var(--primary)}
.kp-legend-item:active{transform:translateY(1px)}
.kp-legend-item:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.kp-legend-item.active{color:var(--primary);font-weight:700;background:var(--primary-soft);border-color:var(--primary)}
.kp-legend-item .sq{width:11px;height:11px;border-radius:50%;background:var(--primary-soft);border:2px solid var(--primary);display:inline-block}
.kp-legend-item .ln{width:18px;height:0;border-top:2px solid currentColor;opacity:.9;display:inline-block;flex:none}
.kp-legend-item .ln.dash{border-top:2px dashed currentColor}
#kpTip{position:absolute;z-index:4;pointer-events:none;display:none;background:var(--panel);color:var(--text);
  border:1px solid var(--border);border-radius:9px;padding:8px 11px;font-size:12px;line-height:1.7;
  box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:250px}
#kpTip b{font-size:13px}
/* 双击知识点 → 题目关联弹窗 */
/* 左上角选中浮标：显示当前选中的知识点 + 一键取消（v1.24.0） */
.kp-sel-chip{position:absolute;left:12px;top:12px;z-index:4;display:none;align-items:center;gap:6px;
  background:var(--panel);border:1px solid var(--primary);border-radius:99px;padding:4px 6px 4px 11px;
  font-size:12px;color:var(--muted);box-shadow:0 2px 10px rgba(0,0,0,.10);max-width:60%}
.kp-sel-chip b{color:var(--primary);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kp-sel-chip button{border:none;background:var(--primary-soft);color:var(--primary);width:20px;height:20px;
  border-radius:50%;font-size:11px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.kp-sel-chip button:hover{background:var(--primary);color:#fff}
/* 画布左上角的「只看某类关联」浮标（v1.28.2）：过滤时明确提示，可一键恢复 */
.kp-filter-chip{display:none;position:absolute;left:12px;top:12px;z-index:5;align-items:center;gap:6px;
  background:var(--panel);border:1px dashed var(--primary);border-radius:99px;padding:4px 6px 4px 11px;
  font-size:12px;color:var(--muted);box-shadow:0 2px 10px rgba(0,0,0,.10)}
.kp-filter-chip b{color:var(--primary);font-weight:600}
.kp-filter-chip button{border:none;background:var(--primary-soft);color:var(--primary);width:20px;height:20px;
  border-radius:50%;font-size:11px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.kp-filter-chip button:hover{background:var(--primary);color:#fff}
.kp-sel-chip.shift{top:46px}
.kp-rel h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 4px;font-size:17px}
.kp-rel .kp-rel-sec{margin-top:14px;padding-top:12px;border-top:1px dashed var(--border)}
.kp-rel .kp-rel-sec>b{display:block;margin-bottom:8px}
.kp-rel .kp-rel-pair{padding:7px 10px;border-radius:8px;background:var(--panel2);margin-bottom:6px;font-size:13px;line-height:1.65}
.kp-rel .kp-rel-pair b{color:var(--primary)}
/* ---------- 题型芯片（增删） ---------- */
.tag{position:relative}
.tag .ct-x{margin-left:6px;font-weight:700;opacity:.65;padding:0 2px;border-radius:4px}
.tag .ct-x:hover{opacity:1;background:rgba(220,38,38,.15);color:#dc2626}
.tag.ct-add{border-style:dashed;color:var(--primary);font-weight:700;padding:6px 12px}
.tag.ct-add:hover{background:var(--primary-soft)}
.ct-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding:10px;
  border:1px dashed var(--border);border-radius:10px;background:var(--panel2)}
/* 题目数量（每批）：预设 + 自定义 */
.cnt-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cnt-row select{flex:1;min-width:90px}
.cnt-row input[type=number]{width:92px;text-align:center;padding:8px 6px}
.cnt-row input[type=number]::-webkit-inner-spin-button{opacity:.6}
.cnt-tip{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.7}
.cnt-tip b{color:var(--primary)}
/* 建议上限提示：单独一行，弱化处理但可读 */
.cnt-note{margin-top:2px;color:var(--muted);opacity:.92}
/* ---------- 知识库（v1.35.0） ---------- */
.kb-kinds{display:flex;gap:6px;flex-wrap:wrap}
.kb-kind{cursor:pointer;border:1px solid var(--border);background:var(--panel2);border-radius:99px;
  padding:5px 12px;font-size:12.5px;color:var(--text);transition:.15s;font-family:inherit}
.kb-kind:hover{border-color:var(--primary);color:var(--primary)}
.kb-kind.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.kb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px;align-items:start}
.kb-note{border:1px solid var(--border);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);
  padding:13px 15px;display:flex;flex-direction:column;gap:8px;transition:.15s}
.kb-note:hover{border-color:var(--primary);transform:translateY(-1px)}
.kb-note-hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kb-note-txt{font-size:13.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word;
  max-height:200px;overflow:auto}
.kb-note-q{font-size:12px;color:var(--muted);border-left:3px solid var(--border);padding-left:9px;line-height:1.6;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.kb-note-ft{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);
  border-top:1px dashed var(--border);padding-top:8px;flex-wrap:wrap}
.kb-note-ft button{padding:3px 8px;font-size:11.5px}
.kb-cover{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:10px}
.kb-cover i{display:block;height:100%;background:var(--primary);transition:width .3s}
.kb-note .kpn-del:hover{color:var(--red);border-color:var(--red)}
/* ---------- 联网查询面板（v1.36.0） ---------- */
.ws-mask{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:40;display:flex;align-items:stretch;
  justify-content:center;padding:0;backdrop-filter:blur(2px)}
/* v1.37.1：桌面版标题栏(z-60)会盖住 inset:0 的覆盖层，全屏面板从标题栏下沿开始 */
body.is-desktop .ws-mask{top:36px}
.ws-panel{background:var(--bg);width:100%;height:100%;display:flex;flex-direction:column;min-width:0}
.ws-head{display:flex;align-items:center;gap:8px;padding:12px 18px;background:var(--panel);
  border-bottom:1px solid var(--border);flex-wrap:wrap}
.ws-head .ws-title{font-weight:700;font-size:14.5px;white-space:nowrap}
.ws-head input{flex:1;min-width:180px;max-width:520px}
.ws-head select{width:auto;min-width:112px}
.ws-body{flex:1;min-height:0;display:grid;grid-template-columns:1.05fr .95fr;gap:14px;padding:14px 18px;overflow:hidden}
.ws-col{background:var(--panel);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;
  min-height:0;overflow:hidden}
.ws-col-hd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);
  font-size:13px;font-weight:600;background:var(--panel2);border-radius:12px 12px 0 0;flex-wrap:wrap}
.ws-col-bd{flex:1;min-height:0;overflow:auto;padding:10px 14px}
.ws-res{border-bottom:1px dashed var(--border);padding:10px 2px}
.ws-res:last-child{border-bottom:0}
.ws-res-t{font-size:13.5px;font-weight:600;color:var(--primary);cursor:pointer;line-height:1.5;word-break:break-word}
.ws-res-t:hover{text-decoration:underline}
.ws-res-u{font-size:11.5px;color:var(--muted);margin:3px 0 5px;word-break:break-all}
.ws-res-s{font-size:12.5px;line-height:1.7;color:var(--text);opacity:.9;word-break:break-word}
.ws-res-ft{display:flex;gap:6px;margin-top:6px}
.ws-res-ft button{padding:2px 8px;font-size:11.5px}
.ws-ai{font-size:13.5px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
.ws-empty{color:var(--muted);font-size:12.5px;line-height:1.9;padding:8px 2px}
.ws-hist{display:flex;flex-direction:column;gap:6px}
.ws-hist-i{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--border);
  border-radius:9px;background:var(--panel2);cursor:pointer;font-size:12.5px;transition:.15s}
.ws-hist-i:hover{border-color:var(--primary);color:var(--primary)}
.ws-hist-i .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-hist-i .d{color:var(--muted);font-size:11px;white-space:nowrap}
.ws-foot{display:flex;align-items:center;gap:8px;padding:10px 18px;background:var(--panel);
  border-top:1px solid var(--border);flex-wrap:wrap}
.ws-foot .hint{color:var(--muted);font-size:11.5px}
@media (max-width:1000px){
  .ws-body{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
}
/* ---------- 划词工具条（v1.37.0）：选中文字后浮出「查询 / 笔记」 ---------- */
.selbar{position:fixed;z-index:58;display:flex;align-items:center;gap:1px;padding:4px;
  background:var(--panel);border:1px solid var(--border);border-radius:10px;
  box-shadow:0 8px 26px rgba(15,23,42,.20);animation:selbarIn .12s ease-out;
  -webkit-app-region:no-drag;user-select:none}
html[data-theme="dark"] .selbar{box-shadow:0 8px 26px rgba(0,0,0,.5)}
@keyframes selbarIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
/* 小箭头指向选中文字：默认在下方（工具条在选区上方），.below 时翻到上方 */
.selbar::after{content:'';position:absolute;left:50%;margin-left:-5px;bottom:-6px;width:9px;height:9px;
  background:var(--panel);border-right:1px solid var(--border);border-bottom:1px solid var(--border);
  transform:rotate(45deg);pointer-events:none}
.selbar.below::after{bottom:auto;top:-6px;transform:rotate(-135deg)}
.selbar-btn{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;color:var(--text);
  font:inherit;font-size:12.5px;line-height:1;padding:6px 9px;border-radius:7px;cursor:pointer;
  transition:background .14s,color .14s}
.selbar-btn:hover{background:var(--primary-soft);color:var(--primary)}
.selbar-btn:active{transform:scale(.97)}
.selbar-sep{width:1px;height:15px;background:var(--border);margin:0 1px}
/* ---------- 帮助手册 ---------- */
.help-layout{display:grid;grid-template-columns:212px 1fr;gap:18px;align-items:start}
.help-toc{position:sticky;top:16px;border:1px solid var(--border);border-radius:12px;background:var(--panel);
  padding:12px;max-height:calc(100vh - 40px);overflow:auto}
.help-toc h4{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 8px;letter-spacing:.5px}
.help-toc a{display:block;padding:7px 10px;border-radius:8px;color:var(--text);text-decoration:none;
  font-size:13px;line-height:1.5;transition:.15s;border-left:2px solid transparent}
.help-toc a:hover{background:var(--panel2);color:var(--primary)}
.help-toc a.on{background:var(--primary-soft);color:var(--primary);font-weight:600;border-left-color:var(--primary)}
.help-toc .toc-sub{padding-left:20px;font-size:12px;color:var(--muted)}
.help-body{min-width:0}
.help-sec{border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:18px 20px;margin-bottom:14px;scroll-margin-top:16px}
.help-sec>h3{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px}
.help-sec>h3 .hnum{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;
  border-radius:7px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:700;flex:none}
.help-h4{font-size:14px;font-weight:600;margin:16px 0 8px;padding-left:9px;border-left:3px solid var(--primary)}
.help-body p{margin:8px 0;line-height:1.9;font-size:13.5px}
.help-body ul,.help-body ol{margin:8px 0 8px 4px;padding-left:20px;line-height:1.95;font-size:13.5px}
.help-body li{margin:3px 0}
.help-body code{background:var(--panel2);border:1px solid var(--border);border-radius:5px;
  padding:1px 6px;font-size:12.5px;font-family:ui-monospace,Consolas,monospace;color:var(--primary)}
.help-steps{list-style:none;padding:0;margin:10px 0;counter-reset:hs}
.help-steps>li{counter-increment:hs;position:relative;padding:9px 12px 9px 42px;margin-bottom:8px;
  border:1px solid var(--border);border-radius:10px;background:var(--panel2);line-height:1.8;font-size:13.5px}
.help-steps>li::before{content:counter(hs);position:absolute;left:11px;top:9px;width:22px;height:22px;
  border-radius:50%;background:var(--primary);color:#fff;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.help-tip{border-left:3px solid var(--primary);background:var(--primary-soft);border-radius:0 8px 8px 0;
  padding:9px 13px;margin:10px 0;font-size:13px;line-height:1.85}
.help-tip.warn{border-left-color:var(--amber);background:var(--amber-soft)}
.help-tip b{color:var(--primary)}
.help-tip.warn b{color:var(--amber)}
.help-kbd{display:inline-block;min-width:20px;text-align:center;padding:1px 6px;border-radius:5px;
  border:1px solid var(--border);border-bottom-width:2px;background:var(--panel2);
  font-size:12px;font-family:ui-monospace,Consolas,monospace;font-weight:600}
.help-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}
.help-table th{background:var(--panel2);color:var(--muted);font-size:12px;font-weight:600;padding:8px 10px;
  border:1px solid var(--border);text-align:left}
.help-table td{padding:8px 10px;border:1px solid var(--border);line-height:1.75;vertical-align:top}
.help-search{position:relative;margin-bottom:14px}
.help-search input{padding-left:36px}
.help-search .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6;pointer-events:none}
.help-hit{background:rgba(250,204,21,.45);border-radius:3px;padding:0 1px}
html[data-theme="dark"] .help-hit,.dark .help-hit{background:rgba(250,204,21,.3)}
.help-empty{color:var(--muted);text-align:center;padding:30px 0;font-size:13px;line-height:1.9}
.help-quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:10px;margin:12px 0 4px}
.help-qcard{border:1px solid var(--border);border-radius:10px;padding:11px 13px;background:var(--panel2);
  cursor:pointer;transition:.15s}
.help-qcard:hover{border-color:var(--primary);background:var(--primary-soft);transform:translateY(-1px)}
.help-qcard .qt{font-weight:600;font-size:13px;margin-bottom:4px;color:var(--primary)}
.help-qcard .qd{font-size:12px;color:var(--muted);line-height:1.7}
.faq-item{border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;background:var(--panel2)}
.faq-item>summary{cursor:pointer;padding:11px 14px;font-size:13.5px;font-weight:600;list-style:none;position:relative;padding-right:34px}
.faq-item>summary::-webkit-details-marker{display:none}
.faq-item>summary::after{content:'＋';position:absolute;right:14px;top:50%;transform:translateY(-50%);
  color:var(--muted);font-size:14px;transition:.2s}
.faq-item[open]>summary::after{content:'－';color:var(--primary)}
.faq-item[open]>summary{color:var(--primary)}
.faq-item .faq-a{padding:0 14px 13px;font-size:13px;line-height:1.9;color:var(--text)}
.faq-item .faq-a code{font-size:12px}
/* ---------- 更新弹窗 ---------- */
.upd-dlg{max-width:520px}
.upd-dlg h3{margin:0 0 6px;font-size:17px;display:flex;align-items:center;gap:8px}
.upd-dlg .upd-ver{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;
  background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:700}
.upd-dlg .upd-prog{margin:14px 0 8px}
.upd-dlg .upd-prog .bar-line{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--border)}
.upd-dlg .upd-prog .bar-line i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#f59e0b,#4f6ef7);transition:width .2s linear}
.upd-dlg .upd-stat{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:7px}
.upd-dlg .upd-stat b{color:var(--text)}
.upd-dlg .upd-notes{background:var(--panel2);border:1px solid var(--border);border-radius:9px;
  padding:10px 12px;margin:12px 0;font-size:12.5px;line-height:1.8;color:var(--muted);max-height:160px;overflow:auto;white-space:pre-wrap}
.upd-dlg .upd-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.upd-dlg .upd-tip{font-size:12px;color:var(--muted);line-height:1.75;margin-top:10px}
.upd-dlg .upd-tip b{color:var(--primary)}
.spin-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--primary);
  animation:updPulse 1s infinite ease-in-out}
@keyframes updPulse{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@media(max-width:900px){.help-layout{grid-template-columns:1fr}.help-toc{position:static;max-height:none}}
@media print{.help-toc,.help-search{display:none!important}.help-layout{grid-template-columns:1fr}
  .help-sec{break-inside:avoid;box-shadow:none}}
@media print{
  .sidebar,#navResizer,#navWidthTip,#toast,.noprint{display:none!important}
  .main{margin:0;padding:0;max-width:none}
  body{background:#fff;color:#000}
  .card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .q-item{break-inside:avoid}
}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#1e293b;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.25);animation:tin .25s;max-width:80vw;text-align:center}
.toast.ok{background:var(--green)} .toast.err{background:var(--red)} .toast.warn{background:#b45309}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center}
/* v1.37.1：弹窗同样让出标题栏，避免高弹窗顶端被压住 */
body.is-desktop .modal-mask{top:36px}
.modal{background:var(--panel);border-radius:14px;max-width:760px;width:92%;max-height:85vh;overflow:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.drop{border:2px dashed var(--border);border-radius:12px;padding:34px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s}
.drop.over{border-color:var(--primary);background:var(--primary-soft)}
.gen-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.hidden{display:none!important}
/* ---------- 错题本：卡片内答题区与笔记 ---------- */
.mist-ans{margin-top:10px;padding:12px;border:1px dashed var(--border);border-radius:10px;background:var(--bg)}
.mist-note-show{margin-top:8px;padding:8px 12px;border-left:3px solid var(--amber);background:var(--bg);border-radius:0 8px 8px 0;font-size:13px;color:var(--text);white-space:pre-wrap;word-break:break-word}
.mist-note-edit textarea{width:100%;min-height:88px;margin-top:8px}
/* ---------- 间隔复习 ---------- */
.rev-card{min-height:210px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:26px 20px}
.rev-q{font-size:19px;line-height:1.7;font-weight:500;margin-bottom:14px}
.rev-mask{background:var(--panel2);border:1px dashed var(--border);border-radius:12px;width:100%;padding:30px 0;color:var(--muted)}
.rate-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;margin-top:6px}
.rate-btn{padding:14px 6px;border-radius:12px;border:1px solid var(--border);cursor:pointer;transition:.15s;text-align:center;background:var(--panel)}
.rate-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.rate-btn .rt{font-weight:700;font-size:15px}
.rate-btn .rs{font-size:11px;color:var(--muted);margin-top:4px}
.rate-btn .rk{display:inline-block;margin-top:6px;font-size:10px;padding:1px 6px;border-radius:5px;background:var(--panel2);color:var(--muted)}
.rate-btn.r1{border-color:var(--red);background:var(--red-soft)} .rate-btn.r1 .rt{color:var(--red)}
.rate-btn.r2{border-color:var(--amber);background:var(--amber-soft)} .rate-btn.r2 .rt{color:var(--amber)}
.rate-btn.r3{border-color:var(--green);background:var(--green-soft)} .rate-btn.r3 .rt{color:var(--green)}
.rate-btn.r4{border-color:var(--primary);background:var(--primary-soft)} .rate-btn.r4 .rt{color:var(--primary)}

<script>
/* =========================================================
   模拟题库 · Web 版
   参照桌面版 2.2.2 功能：文档导入 / AI出题 / 题库 / 练习 /
   错题本 / 统计 / 导出 / 设置
   ========================================================= */

/* ---------- 运行环境：网页版用 IndexedDB，桌面版走 Electron IPC ---------- */
const IS_DESKTOP = !!window.electronAPI;
/* 应用版本号：窗口标题、侧边栏、首页都用它。
 * 桌面版启动后会被安装包的真实版本覆盖；发版时与 desktop/package.json 的 version 一起改。 */
const APP_VER = '1.37.1';
/* 界面实际显示的版本号：桌面版启动后会被安装包真实版本覆盖（applyAppTitle） */
let APP_VER_SHOWN = APP_VER;
/* 背景主题清单（与 CSS 里 html[data-theme=...] 一一对应）
 * 护眼原则：背景低饱和、低刺激；文字用暖深色而非纯黑，降低对比刺眼度 */
const THEMES = [
  { id: 'light', name: '默认浅色', bg: '#f4f6fa', panel: '#ffffff' },
  { id: 'eye-green', name: '护眼豆沙绿', bg: '#c8e6c9', panel: '#f0f7f0' },
  { id: 'parchment', name: '羊皮纸', bg: '#f1e6cd', panel: '#faf4e6' },
  { id: 'linen', name: '米白亚麻', bg: '#efe8dc', panel: '#faf6ef' },
  { id: 'mist', name: '浅灰蓝', bg: '#e4eaf0', panel: '#f5f8fb' },
  { id: 'dark', name: '深夜模式', bg: '#0f1420', panel: '#171e2e' },
];
/* ---------- IndexedDB 驱动（网页版） ---------- */
const idbDriver = (() => {
  let db = null;
  function open() {
    return new Promise((res, rej) => {
      const rq = indexedDB.open('tiku-web', 3);
      rq.onupgradeneeded = e => {
        const d = e.target.result;
        for (const s of ['docs', 'questions', 'mistakes', 'practice']) {
          if (!d.objectStoreNames.contains(s)) {
            d.createObjectStore(s, { keyPath: 'id', autoIncrement: true });
          }
        }
        // v2 新增：考试记录
        if (!d.objectStoreNames.contains('exams')) {
          d.createObjectStore('exams', { keyPath: 'id', autoIncrement: true });
        }
        // v3 新增：间隔复习卡片（SM-2 记忆调度）
        if (!d.objectStoreNames.contains('review')) {
          d.createObjectStore('review', { keyPath: 'id', autoIncrement: true });
        }
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      };
      rq.onsuccess = e => { db = e.target.result; res(db); };
      rq.onerror = rej;
    });
  }
  const tx = (store, mode, fn) => new Promise((res, rej) => {
    const t = db.transaction(store, mode), s = t.objectStore(store);
    const r = fn(s);
    t.oncomplete = () => res(r && r.result !== undefined ? r.result : r);
    t.onerror = rej;
  });
  return {
    open,
    all: (store) => tx(store, 'readonly', s => s.getAll()),
    get: (store, id) => tx(store, 'readonly', s => s.get(id)),
    add: (store, val) => tx(store, 'readwrite', s => s.add(val)),
    put: (store, val) => tx(store, 'readwrite', s => s.put(val)),
    del: (store, id) => tx(store, 'readwrite', s => s.delete(id)),
    clear: (store) => tx(store, 'readwrite', s => s.clear()),
    kvGet: (k) => new Promise(res => {
      const t = db.transaction('kv','readonly').objectStore('kv').get(k);
      t.onsuccess = () => res(t.result); t.onerror = () => res(null);
    }),
    kvSet: (k, v) => tx('kv', 'readwrite', s => s.put(v, k)),
  };
})();
const DB = IS_DESKTOP ? window.electronAPI.db : idbDriver;
/* 题库私有 kv（subjects 等）：桌面版走 bankkv 通道随题库隔离，网页版无多题库 → 同 kv */
if (IS_DESKTOP) { DB.bkvGet = window.electronAPI.db.bkvGet; DB.bkvSet = window.electronAPI.db.bkvSet; }
else { DB.bkvGet = idbDriver.kvGet; DB.bkvSet = idbDriver.kvSet; }
/* 兜底：极老的 preload / 精简运行环境没有题库私有 kv 时退回全局 kv，至少不报错（v1.35.0） */
if (!DB.bkvGet) DB.bkvGet = DB.kvGet;
if (!DB.bkvSet) DB.bkvSet = DB.kvSet;

/* ---------- 全局状态 ---------- */
const state = {
  settings: {
    apiBase: 'https://api.deepseek.com/v1',
    apiKey: '',
    model: 'deepseek-chat',
    theme: 'light',
    defaultDifficulty: 'medium',
    grading: 'ai',          // ai = AI语义判分 / self = 自评
    autoRemove: 1,          // 重练答对后自动移出错题本
    reviewAutoAdd: 1,       // 练习答错自动加入复习队列
    revNewLimit: 20,        // 每日新学上限
    revLimit: 100,          // 每日复习上限
    genCount: 5,            // 生成题目 · 每批题数（预设或自定义 1-50）
    navWidth: 212,          // 导航栏宽度 px（160-360）
    navCollapsed: 0,        // 导航栏是否折叠（只显示图标）
    navOrder: [],           // 导航栏项目排序（拖动生成；空数组 = 默认顺序）
    closeAction: 'tray',    // 桌面版：点关闭按钮的行为（tray=最小化到托盘 / quit=直接退出）
    kpNoteOnly: 0,          // v1.35.0：知识点图谱只看有笔记的知识点
    searchEngine: 'bingcn', // v1.36.0：联网查询默认引擎（bingcn=Bing 国内 / bing=Bing 国际）
  },
  docs: [], questions: [], mistakes: [], practice: [], exams: [], reviews: [],
  kpNotes: {},              // 知识点笔记：{ [知识点名]: { text, at } }（随全局 kv，兼容历史数据）
  kbNotes: [],              // v1.35.0：知识库手记 [{ id, kp, text, at, updatedAt }]（随题库隔离）
  kbSearchHist: [],         // v1.36.0：联网查询历史 [{ q, at, engine, kp }]（随题库隔离，最多 30 条）
  genCount: 5,              // 运行态镜像：出题页「每批题数」，与 settings.genCount 同步
  bankId: 'default',        // v1.31.0：当前题库 id（桌面版多题库；网页版恒为 default）
  banks: [],                // v1.31.0：题库列表 [{id,name,createdAt,counts}]（桌面版从主进程读）
};
/* ---------- 导航栏宽度调节 ----------
 * 三种方式都能改宽：① 拖侧栏右边缘的拖拽手柄；② 点导航栏底部「⇔」按钮（弹出滑块）；
 * ③ 系统设置里输入精确像素。宽度与折叠态都存进 settings，下次打开还是你调好的样子。
 * 约束：160~360px（太窄文字会挤成一团，太宽会吃掉正文空间）；≤900px 窗口强制折叠。 */
const NAVW_DEFAULT = 212;
const NAVW_MIN = 160;
const NAVW_MAX = 360;
const NAVW_COLLAPSED = 64;
const NAVW_STEP = 8;
let navDrag = null;          // 拖拽过程中的临时状态

function clampNavW(n) {
  n = Math.round(+n || NAVW_DEFAULT);
  return Math.max(NAVW_MIN, Math.min(NAVW_MAX, n));
}
/** 当前生效的宽度：折叠时固定 64px */
function navWidthNow() {
  return document.body.classList.contains('nav-collapsed') ? NAVW_COLLAPSED : clampNavW(state.settings.navWidth || NAVW_DEFAULT);
}
/** 把宽度写进 CSS 变量（html[data-navw] 只是给样式表读的，真正的值走 --navw）
 *  折叠时变量本身也要设成 64px —— 侧栏和 .main 都用 var(--navw)，只加 class 不改变量
 *  会出现「侧栏收窄了、正文却还让着 212px」的错位。 */
function applyNavWidth() {
  document.body.classList.toggle('nav-collapsed', !!state.settings.navCollapsed);
  const w = navWidthNow();
  document.documentElement.style.setProperty('--navw', w + 'px');
  document.documentElement.dataset.navw = String(w);
  syncNavTools();
  return w;
}
/** 工具条按钮文案与图标随折叠态变化 */
function syncNavTools() {
  const collapsed = document.body.classList.contains('nav-collapsed');
  const tBtn = document.getElementById('navToggle');
  const wBtn = document.getElementById('navWidthBtn');
  if (tBtn) {
    tBtn.textContent = collapsed ? '▶' : '◀ 收起';
    tBtn.title = collapsed ? '展开导航栏（当前已折叠）' : '收起导航栏，只留图标';
  }
  if (wBtn) {
    wBtn.disabled = collapsed;
    wBtn.title = collapsed ? '展开后才能调节宽度' : '调节导航栏宽度（也可直接拖动右边缘）';
    wBtn.style.opacity = collapsed ? .45 : '';
    wBtn.style.cursor = collapsed ? 'not-allowed' : 'pointer';
  }
}
/** 保存宽度设置（防抖：拖拽过程中不写库，松手才落盘） */
let navSaveTimer = null;
function persistNavWidth() {
  clearTimeout(navSaveTimer);
  navSaveTimer = setTimeout(() => {
    if (typeof state !== 'undefined' && state.settings) DB.kvSet('settings', state.settings).catch(() => { });
  }, 260);
}
/** 设置宽度并持久化（clamp + 立即生效） */
function setNavWidth(px, persist = true) {
  const w = clampNavW(px);
  state.settings.navWidth = w;
  // 手动改宽时若处于折叠态，自动展开——否则改了看不见效果
  if (state.settings.navCollapsed) { state.settings.navCollapsed = 0; document.body.classList.remove('nav-collapsed'); }
  applyNavWidth();
  if (persist) persistNavWidth();
  return w;
}
function toggleNavCollapsed() {
  state.settings.navCollapsed = state.settings.navCollapsed ? 0 : 1;
  applyNavWidth();
  DB.kvSet('settings', state.settings).catch(() => { });
  toast(state.settings.navCollapsed ? '导航栏已收起（点「▶」展开）' : '导航栏已展开', 'ok');
}
function resetNavWidth() {
  setNavWidth(NAVW_DEFAULT);
  toast('导航栏宽度已恢复默认（' + NAVW_DEFAULT + 'px）', 'ok');
}
/** 初始化：绑定拖拽手柄与按钮（只调一次） */
let navWired = false;
function initNavWidth() {
  applyNavWidth();
  if (navWired) return;
  navWired = true;
  const grip = document.getElementById('navResizer');
  const tip = document.getElementById('navWidthTip');
  const showTip = (w, clientX) => {
    if (!tip) return;
    tip.textContent = w + 'px';
    tip.classList.add('show');
    tip.style.left = Math.max(8, Math.min(window.innerWidth - 70, (clientX || 0) + 14)) + 'px';
    tip.style.top = (navDrag && navDrag.y != null ? navDrag.y : 120) + 'px';
  };
  const hideTip = () => { if (tip) tip.classList.remove('show'); };
  navDrag = null;

  if (grip) {
    grip.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      // 窄屏强制折叠，不允许拖
      if (window.innerWidth <= 900) return;
      e.preventDefault();
      navDrag = { x: e.clientX, y: e.clientY, startW: navWidthNow(), moved: false };
      document.body.classList.add('nav-dragging');
      grip.classList.add('dragging');
      showTip(navDrag.startW, e.clientX);
    });
    // 双击恢复默认
    grip.addEventListener('dblclick', () => { if (window.innerWidth > 900) resetNavWidth(); });
  }

  window.addEventListener('mousemove', e => {
    if (!navDrag) return;
    const dx = e.clientX - navDrag.x;
    if (Math.abs(dx) > 2) navDrag.moved = true;
    navDrag.y = e.clientY;
    const w = setNavWidth(navDrag.startW + dx, false);
    showTip(w, e.clientX);
  });
  window.addEventListener('mouseup', () => {
    if (!navDrag) return;
    const moved = navDrag.moved;
    navDrag = null;
    document.body.classList.remove('nav-dragging');
    if (grip) grip.classList.remove('dragging');
    hideTip();
    if (moved) persistNavWidth();
  });
  // 键盘微调：手柄聚焦后 ← → 每次 ±8px，Shift 加速 ±24px
  if (grip) {
    grip.tabIndex = 0;
    grip.addEventListener('keydown', e => {
      if (window.innerWidth <= 900) return;
      const step = e.shiftKey ? NAVW_STEP * 3 : NAVW_STEP;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        setNavWidth(navWidthNow() + (e.key === 'ArrowRight' ? step : -step));
        toast('导航栏宽度 ' + state.settings.navWidth + 'px');
      } else if (e.key === 'Enter' || e.key === 'Home') {
        e.preventDefault(); resetNavWidth();
      }
    });
  }
  const tBtn = document.getElementById('navToggle');
  if (tBtn) tBtn.onclick = () => toggleNavCollapsed();
  const wBtn = document.getElementById('navWidthBtn');
  if (wBtn) wBtn.onclick = () => { if (!state.settings.navCollapsed) navWidthDialog(); };
  // 窗口跨过 900px 断点时重新套一次（窄屏强制折叠，宽屏恢复用户设定）
  window.addEventListener('resize', () => { applyNavWidth(); });
}
/** 「⇔」按钮：弹出宽度滑块，拖动实时预览，确定才落盘 */
function navWidthDialog() {
  const cur = clampNavW(state.settings.navWidth || NAVW_DEFAULT);
  modal(`<h3>⇔ 导航栏宽度</h3>
    <p class="sub" style="margin-top:-6px">拖动滑块调整，右侧有实时预览。也可以直接拖动导航栏右边缘，或双击那条边恢复默认。</p>
    <div class="navw-preview"><div class="navw-mini" id="navwMini"><i></i><i></i><i></i></div><div class="navw-num"><b id="navwNum">${cur}</b> px</div></div>
    <input type="range" id="navwRange" min="${NAVW_MIN}" max="${NAVW_MAX}" step="1" value="${cur}" style="width:100%">
    <div class="row" style="justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-4px">
      <span>最窄 ${NAVW_MIN}px</span><span>默认 ${NAVW_DEFAULT}px</span><span>最宽 ${NAVW_MAX}px</span>
    </div>
    <div class="row" style="justify-content:flex-end;gap:8px;margin-top:14px">
      <button class="ghost" onclick="resetNavWidth();navWidthDialog()">恢复默认</button>
      <button class="ghost" onclick="navCancelDialog()">取消</button>
      <button class="primary" id="navwOk">确定</button>
    </div>`);
  navWBeforeDialog = cur;
  const rng = $('#navwRange'), num = $('#navwNum'), mini = $('#navwMini');
  const paint = (v, persist) => {
    num.textContent = v;
    mini.style.width = Math.round(v * 0.62) + 'px';   // 缩略图按比例缩小，直观感受宽窄
    if (persist) setNavWidth(v, false);
  };
  rng.oninput = () => { paint(+rng.value, true); };
  paint(cur, false);
  $('#navwOk').onclick = () => { setNavWidth(+rng.value); closeModal(); toast('导航栏宽度已设为 ' + state.settings.navWidth + 'px', 'ok'); };
}
/** 取消：把预览中改过的宽度撤回打开弹窗前的值 */
function navCancelDialog() { setNavWidth(navWBeforeDialog || NAVW_DEFAULT, false); closeModal(); }
let navWBeforeDialog = 0;
/* ---------- 导航栏拖动排序 ----------
 * 长按导航项 0.4 秒进入拖动，再上下移动到目标位置，蓝色插入线指示落点，松手即生效并记住顺序。
 * 顺序存于 settings.navOrder（视图 id 数组）；新增的导航项（以后升级可能加）会自动排在末尾，
 * 被删掉的 id 自动忽略。系统设置里可一键恢复默认排序。 */
const NAV_DEFAULT_ORDER = ['dash', 'docs', 'gen', 'bank', 'kp', 'kb', 'practice', 'exam', 'mist', 'review', 'stats', 'set', 'help'];
/** 期望顺序 = 用户拖过的 + 默认顺序里新增/遗漏的补在后面 */
function navOrderList() {
  const valid = new Set(NAV_DEFAULT_ORDER);
  const saved = (state.settings.navOrder || []).filter(v => valid.has(v));
  // v1.35.0：知识库是新增导航项，老用户存过自定义顺序时插到「知识点图谱」后面，而不是掉到最末
  if (saved.length && !saved.includes('kb')) {
    const i = saved.indexOf('kp');
    if (i >= 0) saved.splice(i + 1, 0, 'kb');
  }
  const rest = NAV_DEFAULT_ORDER.filter(v => !saved.includes(v));
  return [...saved, ...rest];
}
/** 启动 / 恢复默认时按 navOrderList 重排 DOM（都插到工具条之前） */
function applyNavOrder() {
  const tools = document.querySelector('.sidebar .nav-tools');
  if (!tools) return;
  const items = {};
  document.querySelectorAll('.sidebar .nav-item').forEach(n => { items[n.dataset.v] = n; });
  navOrderList().forEach(v => { if (items[v]) tools.parentNode.insertBefore(items[v], tools); });
}
function saveNavOrder() {
  state.settings.navOrder = [...document.querySelectorAll('.sidebar .nav-item')].map(n => n.dataset.v);
  DB.kvSet('settings', state.settings);
}
/** 恢复默认排序（系统设置按钮 & 弹窗用），返回是否确实有变化 */
function resetNavOrder() {
  const before = [...document.querySelectorAll('.sidebar .nav-item')].map(n => n.dataset.v).join(',');
  state.settings.navOrder = [];
  applyNavOrder();
  const after = [...document.querySelectorAll('.sidebar .nav-item')].map(n => n.dataset.v).join(',');
  if (before !== after) DB.kvSet('settings', state.settings);
  return before !== after;
}
const NAV_PRESS_MS = 420;      // 长按多久进入拖动（毫秒）
const NAV_PRESS_MOVE = 8;      // 长按期间允许的手抖位移（px），超过即视为普通点击/划动
let navSortJustDragged = false;  // 拖动刚结束：抑制紧随的 click，避免误跳页面
/* 拖动排序：长按导航项 0.4 秒后进入拖动（期间可看到轻微下压反馈），
 * 再用指针事件跟手移动，经过的目标项上/下缘显示蓝色插入线，松手落位并保存。
 * 用指针事件而不是原生 HTML5 拖拽：轻甩鼠标不会误触发排序，单击仍是正常跳转。 */
function initNavDragSort() {
  applyNavOrder();
  const sidebar = document.querySelector('.sidebar');
  if (!sidebar) return;
  let pressTimer = null, pending = null, dragEl = null, lastTarget = null, startX = 0, startY = 0;
  const items = () => [...sidebar.querySelectorAll('.nav-item')];
  const tip = () => document.getElementById('navWidthTip');
  function clearMarks() { items().forEach(m => m.classList.remove('drop-above', 'drop-below')); }
  function hideTip() { const t = tip(); if (t) t.classList.remove('show'); }
  function cancelPress() {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    if (pending) { pending.classList.remove('nav-arming'); pending = null; }
  }
  function endDrag() {
    if (dragEl) { dragEl.classList.remove('nav-dragging'); dragEl = null; }
    document.body.classList.remove('nav-sorting');
    hideTip(); clearMarks();
    lastTarget = null;
  }
  function beginDrag() {
    if (!pending) return;
    dragEl = pending;
    dragEl.classList.remove('nav-arming');
    dragEl.classList.add('nav-dragging');
    pending = null;
    document.body.classList.add('nav-sorting');
    navSortJustDragged = true;          // 长按后无论是否真的移动过，都不再触发跳转
  }
  items().forEach(n => {
    n.draggable = false;                // 关闭原生拖拽，统一走长按
    n.addEventListener('pointerdown', e => {
      if (e.button !== undefined && e.button !== 0) return;   // 只响应左键/单指
      cancelPress(); endDrag();
      startX = e.clientX; startY = e.clientY;
      pending = n;
      n.classList.add('nav-arming');
      pressTimer = setTimeout(() => { pressTimer = null; beginDrag(); }, NAV_PRESS_MS);
    });
  });
  document.addEventListener('pointermove', e => {
    if (pending) {                       // 长按尚未成立：手抖超阈值就放弃，交给点击
      if (Math.hypot(e.clientX - startX, e.clientY - startY) > NAV_PRESS_MOVE) cancelPress();
      return;
    }
    if (!dragEl) return;
    const t = e.target && e.target.closest ? e.target.closest('.nav-item') : null;
    clearMarks();
    if (!t || t === dragEl) { lastTarget = null; hideTip(); return; }
    const r = t.getBoundingClientRect();
    const above = e.clientY < r.top + r.height / 2;
    t.classList.add(above ? 'drop-above' : 'drop-below');
    lastTarget = t;
    const el = tip();
    if (el) {
      el.textContent = '松手放到这里';
      el.style.left = (e.clientX + 14) + 'px';
      el.style.top = (e.clientY + 16) + 'px';
      el.classList.add('show');
    }
  });
  document.addEventListener('pointerup', () => {
    if (pending) { cancelPress(); return; }        // 短按：保持原有点击行为
    if (!dragEl) return;
    if (lastTarget) {
      const above = lastTarget.classList.contains('drop-above');
      lastTarget.parentNode.insertBefore(dragEl, above ? lastTarget : lastTarget.nextSibling);
      saveNavOrder();
      toast('导航栏顺序已保存', 'ok');
    }
    endDrag();
    setTimeout(() => { navSortJustDragged = false; }, 400);
  });
  document.addEventListener('pointercancel', () => { cancelPress(); endDrag(); });
  sidebar.addEventListener('contextmenu', e => { if (pending || dragEl) e.preventDefault(); });
}
const TYPES = {

function subjStats() {

/* 重试：429 / 5xx / 网络错误按 1s→2s→4s 指数退避重试 3 次；其余 4xx 直接抛 */
async function chatRetry(fn, retries = 3) {
  for (let i = 0; ; i++) {
    try { return await fn(); }
    catch (e) {
      const st = e && e.status;
      const retryable = st === 429 || st >= 500 || st == null;
      if (!retryable || i >= retries) throw e;
      await new Promise(r => setTimeout(r, 1000 * Math.pow(2, i)));
    }
  }
}
/* 网页版请求：优先 SSE 流式（边生成边回报进度）；服务商不支持 stream（400）自动回退整段 */
async function chatWeb(s, messages, jsonMode, onChunk) {
  const url = s.apiBase.replace(/\/+$/, '') + '/chat/completions';
  let stream = true;
  for (let attempt = 0; ; attempt++) {
    const body = { model: s.model, messages, temperature: 0.6, stream };
    if (jsonMode) body.response_format = { type: 'json_object' };
    let res;
    try {
      res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + s.apiKey },
        body: JSON.stringify(body),
      });
    } catch (e) { e.status = null; throw e; }   // 网络错误 → 交给重试层
    if (!res.ok) {
      const t = await res.text().catch(() => '');
      // 服务商不接受 stream 参数 → 永久回退整段请求重试
      if (res.status === 400 && stream) { stream = false; continue; }
      const err = new Error(`AI 接口请求失败 (${res.status}) ${t.slice(0, 200)}`);
      err.status = res.status;
      throw err;
    }
    const ctype = String(res.headers.get('content-type') || '');
    if (stream && ctype.includes('text/event-stream')) {
      const reader = res.body.getReader();
      const dec = new TextDecoder('utf-8');   // stream:true 防止汉字在 chunk 边界被截断
      let buf = '', acc = '';
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();   // 最后一段可能不是整行，留到下轮
        for (const line of lines) {
          const l = line.trim();
          if (!l.startsWith('data:')) continue;
          const payload = l.slice(5).trim();
          if (payload === '[DONE]') continue;
          try {
            const delta = JSON.parse(payload).choices?.[0]?.delta?.content || '';
            if (delta) { acc += delta; if (onChunk) onChunk(delta, acc.length); }
          } catch (_) { /* 半包 JSON，跳过 */ }
        }
      }
      if (!acc) throw new Error('AI 返回了空内容');
      return sanitizeText(acc);
    }
    const data = await res.json();
    return sanitizeText(data.choices?.[0]?.message?.content ?? '');
  }
}
async function chat(messages, jsonMode = false, onChunk = null) {
  const s = state.settings;
  if (!s.apiKey) throw new Error('尚未配置 API Key，请先到「系统设置」填写');
  if (IS_DESKTOP) {
    // 桌面版由主进程发请求，不受浏览器跨域限制；有进度回调时走流式
    if (onChunk && window.electronAPI.chatStream) {
      try {
        return sanitizeText(await window.electronAPI.chatStream(
          { apiBase: s.apiBase, apiKey: s.apiKey, model: s.model, messages, jsonMode }, onChunk));
      } catch (e) {
        // 服务商不支持 stream（400）→ 回退整段请求
        if (!String(e && e.message || '').includes('(400)')) throw e;
      }
    }
    return sanitizeText(await window.electronAPI.chat({ apiBase: s.apiBase, apiKey: s.apiKey, model: s.model, messages, jsonMode }));
  }
  return chatRetry(() => chatWeb(s, messages, jsonMode, onChunk));
}
function parseJSON(text) {
  const m = text.match(/\{[\s\S]*\}/);
  if (!m) throw new Error('AI 返回内容无法解析为 JSON');
  return JSON.parse(m[0]);
}
/* ---------- 文本清洗（乱码兜底） ----------
 * AI 返回内容若按 chunk 逐块 toString() 拼接，多字节汉字会在块边界被拦腰截断，
 * 变成 U+FFFD（�）永久写进题库。这里在入库/显示前统一清洗，
 * 保证新题目干净，也能一键修复历史脏数据。 */
const BAD_CHAR_RE = /[\uFFFD\uFFFE\uFFFF]|[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g;
function sanitizeText(s) {
  return String(s ?? '')
    .replace(BAD_CHAR_RE, '')
    .replace(/\r\n?/g, '\n')
    .replace(/[ \t]+\n/g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}
/** 一键修复历史题目中的乱码字符 */
async function repairMojibake() {
  const all = await DB.all('questions');
  let n = 0;
  for (const q of all) {
    let changed = false;
    const fix = v => { const t = sanitizeText(v); if (t !== (v || '')) { changed = true; return t; } return v; };
    const nq = { ...q, content: fix(q.content), answer: fix(q.answer), explanation: fix(q.explanation || ''), knowledge_point: fix(q.knowledge_point || ''), source_excerpt: fix(q.source_excerpt || '') };
    if (Array.isArray(q.options)) {
      nq.options = q.options.map(o => { const t = sanitizeText(o); if (t !== (o || '')) changed = true; return t; });
    }
    if (changed) { await DB.put('questions', nq); n++; }
  }
  if (n) await refreshData();
  toast(n ? `已修复 ${n} 道题目中的乱码字符` : '未发现乱码字符，题库文本正常 ✔', n ? 'ok' : 'ok');
}

/* ---------- 文档导入 ---------- */
async function loadLibs() {
  // 按需加载 mammoth(docx) 与 pdf.js，加载失败时仅支持 TXT
  window._libs = window._libs || {};
  if (!window._libs.mammoth) {
    try { window._libs.mammoth = await import('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js').then(()=>window.mammoth); } catch (e) {}
  }
  if (!window._libs.pdfjs) {
    try {
      window._libs.pdfjs = await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');
      window._libs.pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
    } catch (e) {}
  }
}
async function parseFile(file) {
  const name = file.name, lower = name.toLowerCase();
  await loadLibs();
  if (lower.endsWith('.txt') || lower.endsWith('.md')) {
    return { type: 'txt', text: await file.text() };
  }
  if (lower.endsWith('.docx') && window._libs.mammoth) {
    const buf = await file.arrayBuffer();
    const r = await window._libs.mammoth.extractRawText({ arrayBuffer: buf });
    return { type: 'docx', text: r.value };
  }
  if (lower.endsWith('.pdf') && window._libs.pdfjs) {
    const buf = await file.arrayBuffer();
    const pdf = await window._libs.pdfjs.getDocument({ data: buf }).promise;
    let text = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const c = await page.getTextContent();
      text += c.items.map(it => it.str).join(' ') + '\n';
    }
    return { type: 'pdf', text, pages: pdf.numPages };
  }
  if (lower.endsWith('.doc') || lower.endsWith('.pdf')) throw new Error('旧版 .doc 不支持，请另存为 .docx；PDF 解析库加载失败时请改用 TXT');
  throw new Error('不支持的文件格式，请使用 PDF / DOCX / TXT / MD');
}

async function generateQuestions({ docId, types, count, difficulty, onChunk = null }) {

  const heads = parseDocHeadings(doc.content).map(h => topicLabel(h.title)).filter(Boolean).slice(0, 30);

${headBlock}
只返回 JSON，格式：
{"questions":[{"type":"${typeEnum}","difficulty":"${difficulty}","content":"题干","options":["A. ..","B. .."] 或 null,"answer":"参考答案","explanation":"解析","knowledge_point":"知识点","source_excerpt":"原文片段","topic":"所属顶级标题"}]}
${avoidStr}
文档内容：
${content}`;

/* 本地快速出题（无需 API）：从文档抽取句子生成填空/判断题 */
function localGenerate(doc, count, difficulty) {
  const sents = doc.content.replace(/\s+/g, ' ').split(/(?<=[。！？!?；;])/).map(s => s.trim())
    .filter(s => s.length >= 15 && s.length <= 120 && /[\u4e00-\u9fa5]/.test(s));
  const uniq = [...new Set(sents)];
  const picked = shuffle(uniq).slice(0, count);
  const qs = [];
  for (const s of picked) {
    const words = s.match(/[\u4e00-\u9fa5A-Za-z0-9]{2,8}/g) || [];
    if (!words.length) continue;
    const key = words.sort((a, b) => b.length - a.length)[Math.floor(Math.random() * Math.min(3, words.length))];
    if (!key) continue;
    const makeFill = () => ({
      document_id: doc.id, subject_id: doc.subject_id || null, type: 'fill_blank', difficulty,
      content: s.replace(key, '____'),
      options: null, answer: key,
      explanation: '本题为本地快速出题，考查对原文关键信息的记忆。',
      knowledge_point: '', source_excerpt: s, created_at: Date.now(),
    });
    const makeJudge = () => {
      const flip = Math.random() < 0.5;
      let c = s;
      if (flip) c = s.replace(/是/g, '不是').replace(/能/g, '不能').replace(/会/g, '不会').replace(/有/g, '没有');
      return {
        document_id: doc.id, subject_id: doc.subject_id || null, type: 'true_false', difficulty,
        content: c, options: null, answer: flip ? '错误' : '正确',
        explanation: '本题为本地快速出题，请对照原文判断。',
        knowledge_point: '', source_excerpt: s, created_at: Date.now(),
      };
    };
    qs.push(Math.random() < 0.6 ? makeFill() : makeJudge());
  }
  return qs;
}

/* ---------- 判分 ---------- */
function normAns(s) {
  return String(s ?? '').replace(/[\s，。、；]/g, '').replace(/[AＡ]/g, 'A').toUpperCase();
}
function tfBool(s) {
  s = String(s ?? '').trim();
  if (/^(正确|对|是|T|true|√)$/i.test(s)) return true;
  if (/^(错误|错|否|F|false|×)$/i.test(s)) return false;
  return null;
}
function gradeObjective(q, user) {
  const t = q.type;
  if (t === 'true_false') {
    const a = tfBool(q.answer), u = tfBool(user);
    return a !== null && a === u;
  }
  if (t === 'multiple_choice') {
    const a = normAns(q.answer).split('').sort().join('');
    const u = normAns(user).split('').sort().join('');
    return a !== '' && a === u;
  }
  return normAns(user) === normAns(q.answer);
}
async function gradeSubjective(q, user) {

  try {
    const out = await chat([

      { role: 'user', content: `题型：${TYPES[q.type]}\n参考答案：${q.answer}\n学生答案：${user}` },
    ], true);

/* ============ 自动更新（桌面版） ============

   ① 启动时检测到有更新 → 自动弹窗提示，由用户决定是否下载

let updState = {

  mb: '0.0', totalMb: '0', speed: '', eta: 0, source: '', sourceName: '', ranking: [],

/** 秒 → 「1分20秒」 */
function fmtEta(s) {
  s = Math.max(0, Math.round(s || 0));
  if (s < 60) return s + ' 秒';
  const m = Math.floor(s / 60);
  return m + ' 分 ' + (s % 60) + ' 秒';
}
/* 下载时 progress 事件很密集（主进程已限流到 5 次/秒，但仍可能与
   用户操作、渲染抢占同一帧）。这里再做两层保护：

function updProgressStyle(pct) {
  const p = Math.max(0, Math.min(100, Math.round(pct || 0)));
  const hue = Math.round(26 + 124 * p / 100);
  const col = `hsl(${hue} 80% 47%)`;
  return { pct: p, col, bg: `linear-gradient(90deg,${col} 0%,${col} ${p}%,transparent ${p}%,transparent 100%)` };
}
function updSetUI(txt, cls) {
  updPend = [txt, cls];                     // 同帧多次调用只保留最后一次
  if (updRAF) return;                       // 本帧已有待执行的更新
  updRAF = requestAnimationFrame(() => {
    updRAF = 0;
    const [t, c] = updPend;
    const el = $('#updMsg');
    if (el) {
      if (el.textContent !== t) el.textContent = t;
      const nextCls = 'pill ' + (c || 'gray');
      if (el.className !== nextCls) el.className = nextCls;
    }
    // 检查按钮：检查中变灰并显示「检查中…」，防重复点击
    const chk = $('#updCheck');
    if (chk) {
      const label = updState.checking ? '🔍 检查中…' : '🔍 检查更新';
      if (chk.textContent !== label) chk.textContent = label;
      if (chk.disabled !== !!updState.checking) chk.disabled = !!updState.checking;
    }
    // 下载进度直接显示在下载按钮上：文字百分比 + 按钮底色随进度由橙→黄→绿渐变填充
    const btn = $('#updDownload');
    if (btn) {
      const on = !!updState.downloading;
      const pct = on ? Math.max(0, Math.min(100, Math.round(updState.percent || 0))) : 0;
      // 下载中附带实时速度与预计剩余时间，让用户知道到底快不快
      const tail = on && updState.speed ? ` · ${updState.speed} MB/s${updState.eta ? ' · 剩 ' + fmtEta(updState.eta) : ''}` : '';
      const label = on ? `⬇ 下载中 ${pct}%（${updState.mb || '0.0'} MB）${tail}` : '⬇ 下载更新';
      if (btn.textContent !== label) btn.textContent = label;
      if (btn.disabled !== on) btn.disabled = on;
      // 已下载部分用进度色实填，未下载部分留空（露出按钮本色），形成按钮内进度条
      const st = updProgressStyle(pct);
      const bg = on ? st.bg : '';
      if (btn.dataset.pct !== String(on ? st.pct : '')) {
        btn.dataset.pct = on ? String(st.pct) : '';
        btn.style.backgroundImage = bg;
        btn.style.borderColor = on ? st.col : '';
        btn.style.boxShadow = on ? `0 0 0 2px ${st.col}33` : '';

    }

    const cbtn = $('#updCancel');

    updSyncBadge();

  updSyncDialog();

  $('#updCheck').onclick = () => checkAppUpdate(false);

window.electronAPI && window.electronAPI.onUpdate && window.electronAPI.onUpdate(d => {
  // 只有终态事件才结束「检查中」状态：source/probing 等中间态不该清除，
  // 否则防重入会立刻失效（这是过去能连点多次、最后卡住不出的原因之一）
  if (d.type === 'available' || d.type === 'none' || d.type === 'error') {
    updState.checking = false;
    clearTimeout(updCheckTimer);
  }
  if (d.type === 'checking') {
    updState.percent = 0; updState.mb = '0.0'; updState.downloading = false;
    updSetUI('正在检查更新…');
  }
  else if (d.type === 'probing') {
    updSetUI('正在测速，选择最快的下载线路…', 'blue');
  }
  else if (d.type === 'source') {
    updState.source = d.source || ''; updState.sourceName = d.name || '';
    updState.ranking = d.ranking || [];
    updRenderSrcInfo(d.name, d.ranking);
  }
  else if (d.type === 'notes') {
    // 更新说明是 electron-updater 稍后补送的（快速探测阶段拿不到）
    const t = (d.notes || '').replace(/<[^>]+>/g, ' ').trim();
    if (t && t !== updState.notes) { updState.notes = t; if ($('#updNotes')) $('#updNotes').textContent = t; }
  }
  else if (d.type === 'available') {
    // 快速探测已通知过就不再重复弹提示（electron-updater 随后还会到一次）
    if (updState.available === d.version) {
      updState.checking = false;
      // 说明可能在第二次通知里才带来，补进已有弹窗
      const t = (d.notes || '').replace(/<[^>]+>/g, ' ').trim();
      if (t && t !== updState.notes) {
        updState.notes = t;
        if ($('#updNotes')) $('#updNotes').textContent = t;
        if (updDlgMode === 'available') renderUpdDialog();
      }
      return;
    }
    updState.available = d.version; updState.notes = (d.notes || '').replace(/<[^>]+>/g, ' ').trim();
    if (d.source) updState.source = d.source;
    updSetUI(`发现新版本 v${d.version}，待确认下载`, 'amber');
    // 启动检测 / 手动检查都弹窗提示（用户点过「暂不更新」的版本，本次运行不再自动弹）
    if (updDlgSkipped !== d.version) updDialog('available');
  } else if (d.type === 'none') {
    updState.available = null; updSetUI('已是最新版本 ✔', 'green');
    if (!updLastWasSilent) toast('当前已是最新版本', 'ok');   // 启动时的静默检查不打扰
  }
  else if (d.type === 'progress') {
    // 关键：只更新数值，绝不重建卡片（重建会导致界面闪烁）
    const p = Math.round(d.percent || 0);
    if (p > (updState.percent || 0)) updState.percent = p;   // 单调递增，防止偶发回退抖动
    updState.mb = d.mb || updState.mb; updState.downloading = true;
    updState.totalMb = d.totalMb || updState.totalMb;
    if (d.speed !== undefined) updState.speed = d.speed;
    if (d.eta !== undefined) updState.eta = +d.eta || 0;
    updSetUI('正在下载…', 'blue');                            // 百分比/速度显示在按钮上
    updSyncDialog();                                          // 弹窗进度条单独即时刷新
  }
  else if (d.type === 'switch') {
    updState.source = d.source || ''; updState.sourceName = d.name || '';
    updRenderSrcInfo(d.name);
    toast(`下载线路切换到「${d.name}」，正在重新下载…`, 'amber');
    updSetUI('已切换下载线路，重新开始下载…', 'blue');
  }
  else if (d.type === 'downloaded') {
    updState.downloaded = true; updState.downloading = false; updState.percent = 100;
    updState.speed = ''; updState.eta = 0; updState.canceled = false;
    updSetUI('更新已就绪，待确认安装', 'green');
    // 下载好立刻弹窗，让用户手动确认安装（绝不自动装）
    updDialog('ready');
    toast('更新包下载完成，点「立即安装」即可开始安装', 'ok');
  } else if (d.type === 'canceled') {
    updState.downloading = false; updState.percent = 0;
    updState.mb = '0.0'; updState.speed = ''; updState.eta = 0;
    updSetUI('下载已取消', 'amber');
    if (updDlgMode === 'downloading') updDialogHide();
    // 用户主动取消不报错；非主动取消（极少见）也给个提示
    if (!updState.canceled) toast('下载已中断', 'amber');
  } else if (d.type === 'error') {
    updState.downloading = false; updState.speed = '';
    // 用户主动取消后主进程可能仍抛一次错误，这里静默吞掉
    if (updState.canceled) { updState.canceled = false; updSync(); return; }
    // 把原因直接显示出来（如「检查超时：连不上更新服务器」），别只写「出错」
    const msg = (d.message || '未知错误').slice(0, 80);
    updSetUI('更新出错：' + msg, 'red');
    if (updDlgMode === 'downloading') updDialogHide();
    if (!updLastWasSilent) toast('更新出错：' + msg, 'err');
  }
  // 按钮/进度条显隐同步（幂等、开销极低，不触碰 DOM 结构）
  updSync();
});

function bindSubjectManager() {
  const form = $('#subjForm');
  if (!form) return;
  const setColor = c => {
    subjFormColor = c;
    $('#subjColors').querySelectorAll('.subj-sw').forEach(x => x.classList.toggle('on', x.dataset.c === c));
  };
  $('#subjAddBtn').onclick = () => openSubjForm(null);

    if (!name) { toast('请填写科目名称', 'err'); return; }
    if (subjects.some(s => s.name === name && s.id !== subjEditing)) { toast('已有同名科目', 'err'); return; }
    if (subjEditing) { const s = subjById(subjEditing); if (s) { s.name = name; s.color = subjFormColor; } }
    else subjects.push({ id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name, color: subjFormColor });
    await saveSubjects();
    form.classList.add('hidden'); subjEditing = null;

/** 每批题数：预设 / 自定义输入，值持久化到 state.genCount + settings.genCount */
const COUNT_PRESETS = [3, 5, 8, 10, 15, 20];
const COUNT_MIN = 1, COUNT_MAX = 50;
const COUNT_SUGGEST = 30;      // 建议上限（超出仍可用，但质量容易下滑）
function clampCount(n) {
  n = Math.round(Number(n));
  if (!Number.isFinite(n) || n < COUNT_MIN) return COUNT_MIN;
  return n > COUNT_MAX ? COUNT_MAX : n;
}
/** 当前生效的每批题数（供 runGen / runLocalGen 读取）
 *  输入框为空/非法时回落到「上一次的有效值」，避免中途清空后被当成 1 题 */
function genCountValue() {
  const sel = $('#gCount'), inp = $('#gCountCustom');
  if (sel && sel.value === 'custom' && inp) {
    const raw = String(inp.value == null ? '' : inp.value).trim();
    if (!raw) return clampCount(state.genCount || 5);
    const n = Math.round(Number(raw));
    if (!Number.isFinite(n)) return clampCount(state.genCount || 5);
    // 超范围时不改写用户正在输入的内容（如输入 3 想打成 35），只按上限截断使用
    return Math.max(COUNT_MIN, Math.min(COUNT_MAX, n));
  }
  return clampCount(sel ? sel.value : 5);
}
/** 同步「自定义」输入框显隐、提示文案与持久化值
 *  opts.keepInput=true 时不回写输入框内容（用户正在输入，清空/超范围都别打断）
 *  这是「输入框无法完全清空」的修复点：原来每次 input 都把 value 重置成 clamp 后的数字 */
function syncGenCount(persist, opts = {}) {
  const sel = $('#gCount'), inp = $('#gCountCustom'), tip = $('#gCountTip');
  if (!sel || !inp) return;
  const custom = sel.value === 'custom';
  inp.classList.toggle('hidden', !custom);
  const n = genCountValue();
  if (!custom) {
    inp.value = sel.value;                     // 预设模式：输入框只是镜像
  } else if (!opts.keepInput) {
    const raw = String(inp.value == null ? '' : inp.value).trim();
    // 只有「空」和「越界」需要纠正；中间态（如输入 3 准备打成 35）原样保留
    if (!raw || Math.round(Number(raw)) !== n) inp.value = n;
  }
  if (tip) {
    const over = n > COUNT_SUGGEST;
    tip.innerHTML = `本批将生成 <b>${n}</b> 题 · 单次最多 ${COUNT_MAX} 题${over ? ' <b style="color:#b45309">（已超出建议值，出题质量可能下降）</b>' : ''}
      <div class="cnt-note">建议最大输入不能超过 ${COUNT_SUGGEST}</div>`;
  }
  state.genCount = n;
  state.settings.genCount = n;                        // 同步进 settings，随设置一起持久化
  if (persist) DB.kvSet('settings', state.settings);
  return n;
}
function initGenCount() {
  const sel = $('#gCount'), inp = $('#gCountCustom');
  if (!sel || !inp) return;
  sel.onchange = () => {
    if (sel.value === 'custom') {
      // 从预设切到自定义：给一个介于「最大预设」与建议上限之间的起点，便于直接微调
      const prev = clampCount(state.genCount);
      if (COUNT_PRESETS.includes(prev)) inp.value = COUNT_PRESETS[COUNT_PRESETS.length - 1] + 10 <= COUNT_SUGGEST
        ? COUNT_PRESETS[COUNT_PRESETS.length - 1] + 10
        : COUNT_SUGGEST;
      inp.classList.remove('hidden'); inp.focus(); inp.select();
    }
    syncGenCount(true);
  };
  /* 输入中：只更新提示与持久化值，绝不回写 value —— 否则删到空会被立刻填回 1 */
  inp.oninput = () => syncGenCount(true, { keepInput: true });
  /* 离开 / 回车时才做真正的校正（空 → 上一次有效值，越界 → 截断） */
  inp.onblur = () => { inp.value = clampCount(genCountValue()); syncGenCount(true); };
  inp.onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); inp.value = clampCount(genCountValue()); syncGenCount(true); toast(`每批题数已设为 ${state.genCount} 题`, 'ok'); }
    if (e.key === 'Escape') { inp.blur(); }
  };
  syncGenCount(false);
}

async function runGen() {
  const docId = +$('#gDoc').value, count = genCountValue(), diff = $('#gDiff').value;
  const btn = $('#gBtn'); btn.disabled = true; btn.textContent = '生成中…';
  $('#gProg').classList.remove('hidden'); $('#gBar').style.width = '10%';
  $('#gMsg').textContent = `正在调用 AI 出题（本批 ${count} 题 · 本会话累计 ${genSession.length} 题）…`;
  try {
    // 流式进度：按已接收字数估算（每道题约 250 字），封顶 95% 等最终入库
    const onChunk = (delta, len) => {
      const pct = Math.min(95, 10 + Math.round(len / (count * 250) * 85));
      $('#gBar').style.width = pct + '%';
      $('#gMsg').textContent = `AI 正在出题…已接收 ${len} 字（本批 ${count} 题 · 本会话累计 ${genSession.length} 题）`;
    };
    const n = await generateQuestions({ docId, types: [...genTypes], count, difficulty: diff, onChunk });
    await refreshData();
    const doc = await DB.get('docs', docId);
    const fresh = state.questions.filter(q => q.document_id === docId).slice(0, n).reverse();
    genSession.push(...fresh);
    $('#gBar').style.width = '100%';
    $('#gMsg').textContent = `生成完成：本批 ${n} 道题 · 本会话累计 ${genSession.length} 道题`;
    toast(`成功生成 ${n} 道题目，本会话累计 ${genSession.length} 道`, 'ok');
    renderGenSession();
    /* 标题旁补「清空列表」按钮（首次生成时才需要） */
    const h3 = $('#gSessionN')?.closest('h3');
    if (h3 && !h3.querySelector('.sm')) h3.insertAdjacentHTML('beforeend', ` <button class="sm ghost" onclick="clearGenSession()">清空列表</button>`);
  } catch (e) {
    $('#gMsg').textContent = '生成失败：' + e.message;
    toast('生成失败：' + e.message, 'err');
  } finally { btn.disabled = false; btn.textContent = '✨ 开始生成'; }
}
async function runLocalGen() {
  const docId = +$('#gDoc').value, count = genCountValue(), diff = $('#gDiff').value;
  const doc = await DB.get('docs', docId);
  const qs = localGenerate(doc, count, diff);
  if (qs.length < count) toast(`文档可用句子不足，本次仅出 ${qs.length} 题（目标 ${count} 题）`, 'warn');
  for (const q of qs) await DB.add('questions', q);
  await refreshData();
  genSession.push(...qs);
  toast(`本地快速出题 ${qs.length} 道（填空/判断），本会话累计 ${genSession.length} 道`, 'ok');
  renderGenSession();
}
