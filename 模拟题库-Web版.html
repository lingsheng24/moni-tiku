/* ================= 组卷导出（Word / PDF × A3 / A4 × 学生卷 / 教师卷） =================
 * 采用「中间表示」：先把试卷整理成 blocks 数组，
 * 再由渲染层转成 HTML（PDF / 网页打印用）、由主进程转成 OOXML（真 .docx 用）。
 * 这样 Word 与 PDF 两条路径共用同一份排版数据，不会出现两边内容不一致。 */
const PAPER_ORDER = ['single_choice', 'multiple_choice', 'true_false', 'fill_blank', 'short_answer'];
const GROUP_TITLE = {
  single_choice: '单项选择题', multiple_choice: '多项选择题',
  true_false: '判断题', fill_blank: '填空题', short_answer: '简答题',
};
const CN_NUM = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二'];
function paperScoreOf(q) { return examCfgScore[q.type] ?? (isCustomType(q.type) ? 5 : 0); }
/** 按题型分组、连续编号、算总分 */
function buildPaper(items, cfg) {
  const groups = [];
  const known = PAPER_ORDER.filter(t => items.some(q => q.type === t));
  const custom = [...new Set(items.filter(q => !PAPER_ORDER.includes(q.type)).map(q => q.type))];
  let no = 0;
  for (const t of [...known, ...custom]) {
    const qs = items.filter(q => q.type === t);
    if (!qs.length) continue;
    groups.push({
      type: t, title: GROUP_TITLE[t] || TYPES[t] || t, score: paperScoreOf(qs[0]),
      items: qs.map(q => ({ ...q, no: ++no, score: paperScoreOf(q) })),
    });
  }
  return {
    name: (cfg && cfg.paperName) || '模拟试卷',
    subject: (cfg && cfg.subjectName) || '',
    duration: (cfg && cfg.minutes) || 0,
    total: items.reduce((s, q) => s + paperScoreOf(q), 0),
    count: items.length, groups,
  };
}
/** 试卷中间表示 → blocks */
function paperBlocks(paper, kind) {
  const teacher = kind === 'teacher';
  const b = [{ k: 'h1', t: paper.name }];
  const meta = [];
  if (paper.subject) meta.push('科目：' + paper.subject);
  if (paper.duration) meta.push('考试时间：' + paper.duration + ' 分钟');
  meta.push('满分：' + paper.total + ' 分');
  b.push({ k: 'meta', t: meta.join('　　') });
  b.push({ k: 'info', t: '姓名：____________　　班级：____________　　学号：____________' });
  b.push({ k: 'rule' });
  paper.groups.forEach((g, gi) => {
    const per = g.score ? `（每小题 ${g.score} 分，共 ${g.score * g.items.length} 分）` : '';
    b.push({ k: 'sec', t: `${CN_NUM[gi] || (gi + 1)}、${g.title}${per}` });
    for (const q of g.items) {
      // 判断题不列选项，题干后直接跟作答括号
      const tail = q.type === 'true_false' ? '（　　）' : '';
      b.push({ k: 'q', no: q.no, t: q.content, tail, score: teacher ? 0 : q.score });
      if (q.options && q.options.length && q.type !== 'true_false') {
        const short = q.options.every(o => o.trim().length <= 12);
        if (short) b.push({ k: 'opts', arr: q.options, inline: true });
        else for (const o of q.options) b.push({ k: 'opts', arr: [o], inline: false });
      }
      // 预留作答空间：填空 / 简答 / 自定义文本题
      const textLike = q.type === 'fill_blank' || q.type === 'short_answer' || isTextType(q.type);
      if (textLike) b.push({ k: 'blank', n: q.type === 'fill_blank' ? 1 : 3 });
      if (teacher) {
        const p = ['【答案】' + (q.answer || '—')];
        if (q.explanation) p.push('【解析】' + q.explanation);
        if (q.score) p.push('【分值】' + q.score + ' 分');
        b.push({ k: 'ans', t: p.join('　') });
      }
    }
  });
  return b;
}
const HEAD_KEYS = ['h1', 'meta', 'info', 'rule'];
function blockHTML(b) {
  switch (b.k) {
    case 'h1': return `<h1>${esc(b.t)}</h1>`;
    case 'meta': return `<div class="meta">${esc(b.t)}</div>`;
    case 'info': return `<div class="info">${esc(b.t)}</div>`;
    case 'rule': return '<div class="rule"></div>';
    case 'sec': return `<div class="sec">${esc(b.t)}</div>`;
    case 'q': return `<div class="q">${b.no}. ${esc(b.t)}${esc(b.tail || '')}${b.score ? `<span class="sc">（${b.score}分）</span>` : ''}</div>`;
    case 'opts': return b.inline
      ? `<div class="opts-in">${b.arr.map(o => `<span>${esc(o)}</span>`).join('')}</div>`
      : b.arr.map(o => `<div class="opt">${esc(o)}</div>`).join('');
    case 'blank': return Array.from({ length: b.n }, () => '<div class="bl"></div>').join('');
    case 'ans': return `<div class="ans">${esc(b.t)}</div>`;
    default: return '';
  }
}
/** blocks → 排版 HTML（PDF 打印与网页版下载共用）

}

function safeFileName(s) { return String(s || '试卷').replace(/[\\/:*?"<>|]/g, '').trim() || '试卷'; }
/** 预览试卷（新窗口打开排版好的试卷，可直接 Ctrl+P 打印） */
function previewPaper() {
  const cfg = readPaperCfg();

/** 生成并导出试卷（Word / PDF × A3 / A4 × 学生卷 / 教师卷） */
async function exportExamPaper() {
  const cfg = readPaperCfg();
  const items = pickExamItems(cfg);
  if (!items.length) { toast('当前条件下没有可用题目', 'err'); return; }
  const paper = buildPaper(items, cfg);
  const size = $('#pkSize') ? $('#pkSize').value : 'A4';
  const kinds = $('#pkKind') && $('#pkKind').value === 'both' ? ['student', 'teacher']
    : [($('#pkKind') ? $('#pkKind').value : 'student')];
  const fmts = $('#pkFmt') && $('#pkFmt').value === 'both' ? ['docx', 'pdf']
    : [($('#pkFmt') ? $('#pkFmt').value : 'docx')];
  const btn = $('#pkBtn'); if (btn) btn.disabled = true;
  let ok = 0, cancel = 0;
  try {
    for (const kd of kinds) {
      const blocks = paperBlocks(paper, kd);
      const tag = kinds.length > 1 ? (kd === 'teacher' ? '_教师卷' : '_学生卷') : '';
      const base = safeFileName(paper.name) + tag;
      for (const fm of fmts) {
        if (fm === 'docx') {
          if (IS_DESKTOP && window.electronAPI.savePaperDocx) {
            const p = await window.electronAPI.savePaperDocx({ blocks, size, name: base + '.docx' });
            p ? ok++ : cancel++;
          } else {
            // 网页版没有打包库，导出 HTML 版 .doc（Word / WPS 可直接打开）
            downloadBlob(new Blob(['\ufeff' + paperHTML(blocks, size)], { type: 'application/msword' }), base + '.doc');
            ok++;
          }
        } else {
          const html = paperHTML(blocks, size);
          if (IS_DESKTOP && window.electronAPI.savePaperPdf) {
            const p = await window.electronAPI.savePaperPdf({ html, size, name: base + '.pdf' });
            p ? ok++ : cancel++;
          } else {
            downloadBlob(new Blob([html], { type: 'text/html;charset=utf-8' }), base + '.html');
            ok++;
          }
        }
      }
    }
    if (ok) toast(`已导出 ${ok} 个文件`, 'ok');
    else if (cancel) toast('已取消导出', 'err');
  } catch (e) { toast('导出失败：' + e.message, 'err'); }
  finally { if (btn) btn.disabled = false; }
}

async function submitMistAns(mid) {
  const m = state.mistakes.find(x => x.id === mid);
  if (!m) return;
  const q = state.questions.find(x => x.id === m.question_id);
  const type = m.type || q?.type || '';
  const answer = m.correct_answer || q?.answer || '';
  const box = $('#ma-' + mid);
  let user = '';
  if (q?.options && type !== 'true_false') {
    user = [...box.querySelectorAll('.opt-click.sel')].map(e => e.dataset.l).join('');
    if (!user) { toast('请先选择答案', 'err'); return; }
  } else if (type === 'true_false') {
    user = box.querySelector('.tag.on')?.dataset.v || '';
    if (!user) { toast('请先选择答案', 'err'); return; }
  } else {
    user = ($('#ma-ta-' + mid)?.value || '').trim();
    if (!user) { toast('请先输入答案', 'err'); return; }
  }
  const goBtn = $('#ma-go-' + mid);
  goBtn.disabled = true; goBtn.textContent = '判分中…';
  let correct, aiNote = '';
  if (type === 'short_answer' || isTextType(type) || (type === 'fill_blank' && /[一-龥]{4,}/.test(answer))) {
    const r = await gradeSubjective({ type, answer }, user);
    if (r.correct === null) {
      correct = confirm(`AI 判分不可用，请自评。\n\n你的答案：${user}\n参考答案：${answer}\n\n点击「确定」= 答对，「取消」= 答错`);
    } else { correct = r.correct; aiNote = r.aiNote; }
  } else {
    correct = gradeObjective({ type, answer }, user);
  }
  goBtn.disabled = false; goBtn.textContent = '提交答案';
  /* 计入练习记录（影响正确率统计与智能练习权重） */
  await DB.add('practice', { question_id: m.question_id, is_correct: correct ? 1 : 0, answered_at: Date.now() });
  const res = $('#ma-res-' + mid);
  res.innerHTML = `
    <div class="q-ans" style="margin-top:10px">
      <b style="color:${correct ? 'var(--green)' : 'var(--red)'}">${correct ? '✔ 回答正确' : '✘ 回答错误'}</b>
      ：${esc(answer)}
      ${aiNote ? `<br><span style="color:var(--muted)">AI 点评：${esc(aiNote)}</span>` : ''}
      ${q?.explanation ? `<br><span style="color:var(--muted)">解析：${esc(q.explanation)}</span>` : ''}
    </div>
    <div class="row" style="margin-top:8px">
      ${correct
      ? `<button class="primary sm" onclick="delMist(${mid})">🎉 已掌握，移出错题本</button>`
      : `<button class="ghost sm" onclick="mistRetry(${mid})">🔄 再试一次</button>`}
    </div>`;
  if (correct && state.settings.autoRemove) {
    await DB.del('mistakes', mid);
    await refreshData();
    toast('🎉 已掌握，自动移出错题本', 'ok');
    viewMist();
    return;
  }
  await refreshData();
}

function practiceMistakes() {

  if (!pool.length) { toast('没有可重练的错题（原题目可能已被删除）', 'err'); return; }
  quiz = { items: shuffle(pool).slice(0, Math.min(pool.length, 20)), idx: 0, correct: 0, finished: false, answers: [], mode: 'mistake' };
  go('practice');
}

function exportMist() {
  if (!state.mistakes.length) { toast('没有可导出的错题', 'err'); return; }
  const body = [...state.mistakes].reverse().map((m, i) => {
    const q = state.questions.find(x => x.id === m.question_id);
    return `<div style="margin-bottom:16px">
      <p><b>${i + 1}.【${TYPES[m.type || q?.type] || ''}】</b>${esc(m.question_content || q?.content || '')}</p>
      <p style="color:#dc2626"><b>我的答案：</b>${esc(m.user_answer || '')}</p>
      <p style="color:#16a34a"><b>正确答案：</b>${esc(m.correct_answer || q?.answer || '')}</p>
      ${q?.explanation ? `<p style="color:#666"><b>解析：</b>${esc(q.explanation)}</p>` : ''}
      ${m.note ? `<p style="color:#b45309"><b>📝 我的笔记：</b>${esc(m.note).replace(/\n/g, '<br>')}</p>` : ''}
    </div>`;
  }).join('');
  const html = `<html><head><meta charset="utf-8"><title>错题本</title></head>
    <body><h2 style="text-align:center">错题本（共 ${state.mistakes.length} 题）</h2>${body}</body></html>`;
  const fname = '错题本_' + new Date().toISOString().slice(0, 10) + '.doc';
  if (IS_DESKTOP) { saveAs(fname, html, 'doc', 'Word 文档'); return; }
  downloadBlob(new Blob(['\ufeff' + html], { type: 'application/msword' }), fname);
  toast('已导出错题 Word', 'ok');
}

/* ============ 统计分析 ============ */
async function viewStats() {
  const p = state.practice;
  const total = p.length, correct = p.filter(x => x.is_correct).length;
  const byType = {}, byDiff = {};
  for (const r of p) {
    const q = state.questions.find(q => q.id === r.question_id);
    const t = q?.type || 'unknown', d = q?.difficulty || 'medium';
    byType[t] = byType[t] || { n: 0, c: 0 }; byType[t].n++; if (r.is_correct) byType[t].c++;
    byDiff[d] = byDiff[d] || { n: 0, c: 0 }; byDiff[d].n++; if (r.is_correct) byDiff[d].c++;
  }
  // 近7天趋势
  const days = [...Array(7)].map((_, i) => {
    const d = new Date(); d.setDate(d.getDate() - (6 - i)); d.setHours(0, 0, 0, 0);
    const next = d.getTime() + 86400000;
    const recs = p.filter(r => r.answered_at >= d.getTime() && r.answered_at < next);
    return { label: `${d.getMonth() + 1}/${d.getDate()}`, n: recs.length, c: recs.filter(r => r.is_correct).length };
  });
  const maxN = Math.max(1, ...days.map(d => d.n));
  const bar = (name, n, c) => `<div class="bar-row"><span class="name">${name}</span>
    <div class="bar"><i style="width:${n ? Math.round(c / n * 100) : 0}%"></i></div>
    <span class="val">${c}/${n}（${n ? Math.round(c / n * 100) : 0}%）</span></div>`;
  $('#view').innerHTML = `
  <h1>统计分析</h1><div class="sub">练习数据一览</div>
  <div class="grid c4" style="margin-bottom:16px">
    <div class="stat a"><div class="lbl">累计练习</div><div class="num">${total}</div></div>
    <div class="stat b"><div class="lbl">答对题数</div><div class="num">${correct}</div></div>
    <div class="stat c"><div class="lbl">总正确率</div><div class="num">${total ? Math.round(correct / total * 100) : 0}%</div></div>
    <div class="stat d"><div class="lbl">待复习错题</div><div class="num">${state.mistakes.length}</div></div>
  </div>
  <div class="grid c2">
    <div class="card"><h3>📊 各题型正确率</h3>
      ${Object.keys(byType).length ? Object.entries(byType).map(([k, v]) => bar(TYPES[k] || k, v.n, v.c)).join('') : '<div class="empty">暂无数据</div>'}
    </div>
    <div class="card"><h3>📊 各难度正确率</h3>
      ${Object.keys(byDiff).length ? Object.entries(byDiff).map(([k, v]) => bar(DIFFS[k] || k, v.n, v.c)).join('') : '<div class="empty">暂无数据</div>'}
    </div>
  </div>
  <div class="card"><h3>📈 近 7 天练习量</h3>
    <div class="row" style="align-items:flex-end;gap:14px;height:130px;padding:0 10px">
      ${days.map(d => `<div style="flex:1;text-align:center">
        <div style="height:${Math.round(d.n / maxN * 90)}px;background:linear-gradient(180deg,#4f6ef7,#8b5cf6);border-radius:6px 6px 0 0;min-height:3px" title="${d.n} 题"></div>
        <div style="color:var(--muted);font-size:11px;margin-top:6px">${d.label}<br>${d.n} 题</div></div>`).join('')}
    </div>
  </div>`;
}

/* ---------- v1.31.0 题库管理（桌面版专属） ----------
 * 设置页「题库管理」卡片：列表（当前高亮 / 进入 / 行内重命名 / 删除）+ 新建。
 * 切换 = 主进程保存 curBank 后整页重载，全量读取新题库，杜绝残留引用。 */
async function renderBankMgr() {
  if (!IS_DESKTOP || !window.electronAPI.banks) return;
  const api = window.electronAPI.banks;
  state.banks = await api.list() || [];
  applyBankTitle();
  const box = $('#bankMgrList');
  if (!box) return;
  box.innerHTML = state.banks.map(b => {
    const c = b.counts || {};
    const isCur = b.id === state.bankId;
    return `<div class="row" data-b="${b.id}" style="justify-content:space-between;border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:6px;flex-wrap:wrap;gap:6px${isCur ? ';background:rgba(59,130,246,.08)' : ''}">
      <span class="bank-name" style="min-width:0;flex:1">
        <b>${isCur ? '✅ ' : '📚 '}${esc(b.name)}</b>
        <span style="color:var(--muted);font-size:12px">　${c.questions || 0} 题 · ${c.docs || 0} 文档 · ${c.exams || 0} 场考试</span>
      </span>
      <span class="row" style="gap:6px">
        ${isCur ? '<span style="color:var(--muted);font-size:12px">当前</span>' : `<button class="ghost" data-act="switch">进入</button>`}
        <button class="ghost" data-act="rename">重命名</button>
        ${b.id === 'default' ? '' : `<button class="danger" data-act="del">删除</button>`}
      </span>
    </div>`;
  }).join('');
  box.querySelectorAll('[data-act]').forEach(btn => btn.onclick = async () => {
    const id = btn.closest('[data-b]').dataset.b;
    const b = state.banks.find(x => x.id === id) || {};
    if (btn.dataset.act === 'switch') {
      if (!confirm(`切换到「${b.name}」？\n\n各题库的文档、题目、练习、考试记录完全独立，随时可以切回来。`)) return;
      try { await api.switchTo(id); } catch (e) { toast('切换失败：' + (e && e.message || e), 'err'); return; }
      location.reload();
    } else if (btn.dataset.act === 'rename') {
      /* 行内编辑：Electron 不支持原生 prompt，名称改在行内 input 里改 */
      const row = btn.closest('[data-b]');
      const nameEl = row.querySelector('.bank-name');
      if (row.querySelector('.bank-edit')) return;
      nameEl.innerHTML = `<input class="bank-edit" maxlength="20" value="${esc(b.name)}" style="max-width:180px;padding:4px 8px">
        <button class="primary bank-save" style="padding:4px 10px">保存</button>
        <button class="ghost bank-cancel" style="padding:4px 10px">取消</button>`;
      const inp = row.querySelector('.bank-edit');
      inp.focus(); inp.select();
      row.querySelector('.bank-cancel').onclick = () => renderBankMgr();
      const doSave = async () => {
        const name = (inp.value || '').trim();
        if (!name || name === b.name) { renderBankMgr(); return; }
        const r = await api.rename(id, name);
        if (!r.ok) { toast(r.error || '重命名失败', 'err'); inp.focus(); return; }
        await renderBankMgr(); toast('已重命名为「' + name + '」', 'ok');
      };
      row.querySelector('.bank-save').onclick = doSave;
      inp.onkeydown = e => { if (e.key === 'Enter') doSave(); if (e.key === 'Escape') renderBankMgr(); };
    } else if (btn.dataset.act === 'del') {
      const c = b.counts || {};
      if (!confirm(`⚠️ 确定删除题库「${b.name}」？\n\n其中 ${c.questions || 0} 道题目、${c.docs || 0} 份文档及全部练习 / 考试 / 错题 / 复习记录将被永久删除，不可恢复！\n\n强烈建议先进入该题库并导出 JSON 备份。`)) return;
      if (!confirm(`再次确认：删除「${b.name}」后数据无法找回。\n\n真的要继续吗？`)) return;
      const r = await api.del(id);
      if (!r.ok) { toast(r.error || '删除失败', 'err'); return; }
      if (r.curBank !== state.bankId) { location.reload(); return; }   // 删的是当前题库：主进程已切回默认 → 重载
      await renderBankMgr(); toast('题库已删除', 'ok');
    }
  });
  const nb = $('#bankNewBtn');
  if (nb) nb.onclick = async () => {
    const inp = $('#bankNewName');
    const name = (inp.value || '').trim();
    if (!name) { toast('请先输入题库名称', 'err'); return; }
    const r = await api.create(name);
    if (!r.ok) { toast(r.error || '创建失败', 'err'); return; }
    inp.value = '';
    await renderBankMgr();
    toast(`题库「${name}」已创建，点「进入」开始使用（也可点标题栏切换）`, 'ok');
  };
}

function applyTheme() { document.documentElement.dataset.theme = state.settings.theme; }
async function dedupQuestions() {
  const seen = new Map(), dup = [];
  for (const q of state.questions) {
    const key = (q.content.trim() + '|' + q.answer.trim()).toLowerCase();
    if (seen.has(key)) dup.push(q.id); else seen.set(key, q.id);
  }
  if (!dup.length) { toast('没有发现重复题目', 'ok'); return; }
  if (!confirm(`发现 ${dup.length} 道重复题目，确定清理（保留每题最新一条）？`)) return;
  for (const id of dup) {
    await DB.del('questions', id);
    for (const m of state.mistakes.filter(m => m.question_id === id)) await DB.del('mistakes', m.id);
  }
  await refreshData(); toast(`已清理 ${dup.length} 道重复题目`, 'ok');
}

let helpState = { kw: '', active: 'quick' };
const HELP_ESC = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
/** 渲染一个章节的正文（FAQ 章节特殊处理为折叠列表） */
function helpSectionHTML(sec, num) {
  if (sec.faq) {
    return `<div class="help-sec" id="help-${sec.id}" data-sec="${sec.id}">
      <h3><span class="hnum">${num}</span>${sec.ico} ${sec.title}</h3>
      ${sec.faq.map(([q, a]) => `<details class="faq-item"><summary>${HELP_ESC(q)}</summary>
        <div class="faq-a">${HELP_ESC(a)}</div></details>`).join('')}
    </div>`;
  }
  return `<div class="help-sec" id="help-${sec.id}" data-sec="${sec.id}">
    <h3><span class="hnum">${num}</span>${sec.ico} ${sec.title}</h3>${sec.html}
  </div>`;
}
function viewHelp() {
  const secs = HELP_SECTIONS;
  $('#view').innerHTML = `
  <h1>帮助手册</h1><div class="sub">模拟题库 v${APP_VER_SHOWN} 完整操作说明 · 共 ${secs.length} 章 · 搜一下关键词能直接定位</div>

      ${secs.map((s, i) => `<a href="#help-${s.id}" data-sec="${s.id}" class="${helpState.active === s.id ? 'on' : ''}">${i + 1}. ${s.title}</a>`).join('')}
      <div style="border-top:1px solid var(--border);margin:10px 0 8px"></div>
      <a href="javascript:void 0" onclick="printHelp()">🖨 打印 / 存为 PDF</a>
      <a href="javascript:void 0" onclick="go('dash')">🏠 返回首页</a>

    <div class="help-body" id="helpBody">

  const kw = $('#helpKw');
  kw.oninput = () => { helpState.kw = kw.value.trim(); filterHelp(); };
  kw.onkeydown = e => {
    if (e.key === 'Escape') { kw.value = ''; helpState.kw = ''; filterHelp(); }
    if (e.key === 'Enter') { const first = document.querySelector('.help-sec:not(.hidden)'); first && first.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  };
  /* 目录高亮跟随滚动 */
  document.querySelectorAll('#helpToc a[data-sec]').forEach(a => {
    a.onclick = e => {
      e.preventDefault();
      const el = document.getElementById('help-' + a.dataset.sec);

      helpState.active = a.dataset.sec;
      document.querySelectorAll('#helpToc a[data-sec]').forEach(x => x.classList.toggle('on', x.dataset.sec === helpState.active));

/** 搜索过滤：命中章节保留并把关键词高亮 */
function filterHelp() {
  const k = helpState.kw.toLowerCase();
  let hit = 0;
  document.querySelectorAll('#helpBody .help-sec').forEach(sec => {
    /* 先还原上一次的高亮 */
    if (sec._rawHTML === undefined) sec._rawHTML = sec.innerHTML;
    sec.innerHTML = sec._rawHTML;
    const ok = !k || sec.textContent.toLowerCase().includes(k);
    sec.classList.toggle('hidden', !ok);
    if (!ok) return;
    hit++;
    if (k) highlightIn(sec, helpState.kw);
  });
  const empty = $('#helpEmpty');
  if (empty) empty.classList.toggle('hidden', hit > 0);
  /* 过滤时目录只显示命中的章节 */
  document.querySelectorAll('#helpToc a[data-sec]').forEach(a => {
    const sec = document.getElementById('help-' + a.dataset.sec);
    a.style.display = (sec && sec.classList.contains('hidden')) ? 'none' : '';
  });
}
/** 在元素内的文本节点中把关键词包上高亮标记（跳过已是标记的节点） */
function highlightIn(root, kw) {
  if (!kw) return;
  const re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => (n.parentElement && n.parentElement.closest('.help-hit')) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
  });
  const targets = [];
  let n;
  while ((n = walker.nextNode())) if (re.test(n.nodeValue)) targets.push(n);
  for (const node of targets) {
    const frag = document.createDocumentFragment();
    let last = 0, m;
    re.lastIndex = 0;
    const txt = node.nodeValue;
    while ((m = re.exec(txt))) {
      if (m.index > last) frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
      const span = document.createElement('span');
      span.className = 'help-hit'; span.textContent = m[0];
      frag.appendChild(span);
      last = m.index + m[0].length;
    }
    if (last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
    node.parentNode.replaceChild(frag, node);
  }
}
/** 滚动时自动高亮目录里当前章节 */
function bindHelpScrollSpy() {
  const body = $('#helpBody');
  if (!body || !body.parentElement) return;
  const onScroll = () => {
    const secs = [...document.querySelectorAll('#helpBody .help-sec:not(.hidden)')];
    if (!secs.length) return;
    const top = 120;
    let cur = secs[0];
    for (const s of secs) if (s.getBoundingClientRect().top <= top) cur = s;
    if (cur.dataset.sec && cur.dataset.sec !== helpState.active) {
      helpState.active = cur.dataset.sec;
      document.querySelectorAll('#helpToc a[data-sec]').forEach(x => x.classList.toggle('on', x.dataset.sec === helpState.active));
    }
  };
  window.removeEventListener('scroll', helpScrollSpy);
  helpScrollSpy = onScroll;
  window.addEventListener('scroll', onScroll, { passive: true });
}
let helpScrollSpy = null;

}
applyAppTitle();
if (IS_DESKTOP && window.electronAPI && window.electronAPI.getAppVersion) {
  window.electronAPI.getAppVersion().then(v => v && applyAppTitle(v)).catch(() => { });
}
/* 顶部 logo 块 = 「首页总览」入口：点击/回车回到首页 */
for (const evt of ['click', 'keydown']) {
  document.getElementById('navHome')?.addEventListener(evt, e => {
    if (evt === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
    go('dash');
    if (evt === 'keydown') e.preventDefault();
  });
}
/* ---------- 自绘标题栏（仅桌面版）：主题切换 / 最小化 / 最大化 / 关闭 ---------- */
if (IS_DESKTOP && window.electronAPI && window.electronAPI.winMin) {
  document.body.classList.add('is-desktop');
  const api = window.electronAPI;
  $('#tbMin').onclick = () => api.winMin();
  $('#tbMax').onclick = () => api.winMaxToggle();
  $('#tbClose').onclick = () => api.winClose();
  if (api.onWinState) api.onWinState(d => { const b = $('#tbMax'); if (b) b.textContent = d.max ? '❐' : '□'; });
  /* v1.33.0：标题栏更新角标——点击直达更新弹窗 */
  const ubadge = $('#tbUpdBadge');
  if (ubadge) ubadge.onclick = () => updBadgeClick();
  /* 主题快捷面板：与系统设置共用 THEMES 数据和保存逻辑，点击立即生效并持久化 */
  const pop = $('#tbThemePop'), tbtn = $('#tbThemeBtn');
  function renderTbThemes() {
    pop.innerHTML = THEMES.map(t => `
      <button type="button" class="theme-card ${state.settings.theme === t.id ? 'active' : ''}" data-t="${t.id}">
        <span class="sw" style="background:linear-gradient(135deg,${t.bg} 50%,${t.panel} 50%)"></span>${t.name}
      </button>`).join('');
    pop.querySelectorAll('.theme-card').forEach(b => b.onclick = async () => {
      const t = THEMES.find(x => x.id === b.dataset.t);
      if (!t || state.settings.theme === t.id) { pop.classList.remove('open'); return; }
      state.settings.theme = t.id;
      applyTheme();
      renderTbThemes();
      if (typeof window.renderThemeGrid === 'function') window.renderThemeGrid();
      await DB.kvSet('settings', state.settings);
      toast('背景主题已切换：' + t.name, 'ok');
    });
  }
  renderTbThemes();
  tbtn.onclick = (e) => { e.stopPropagation(); renderTbThemes(); pop.classList.toggle('open'); if (pop.classList.contains('open')) bpop.classList.remove('open'); };
  pop.onclick = (e) => e.stopPropagation();
  document.addEventListener('click', (e) => {
    if (pop.classList.contains('open') && !pop.contains(e.target) && !tbtn.contains(e.target)) pop.classList.remove('open');
  });
  /* ---- 题库快捷切换面板（v1.31.0）：点标题栏文字或切换图标弹出，选中即切换并重载 ---- */
  const bpop = $('#tbBankPop'), ttitle = $('#tbTitle'), tbankBtn = $('#tbBankBtn');
  function renderTbBanks() {
    if (!(api.banks && api.banks.list)) return false;
    bpop.innerHTML = state.banks.map(b => `
      <div class="bank-item ${b.id === state.bankId ? 'active' : ''}" data-b="${b.id}" title="${b.id === state.bankId ? '当前题库' : '点击切换到「' + esc(b.name) + '」'}">
        <span>${b.id === state.bankId ? '✅' : '📚'} ${esc(b.name)}</span>
        <span class="cnt">${b.counts ? (b.counts.questions + ' 题') : ''}</span>
      </div>`).join('')
      + `<div class="bank-foot"><button type="button" class="ghost" style="flex:1" id="tbBankManage">🗂️ 管理题库…</button></div>`;
    bpop.querySelectorAll('.bank-item').forEach(el => {
      el.onclick = async () => {
        const id = el.dataset.b;
        if (id === state.bankId) { bpop.classList.remove('open'); return; }
        if (!confirm(`切换到「${(state.banks.find(x => x.id === id) || {}).name || ''}」？\n\n各题库的文档、题目、练习、考试记录完全独立，随时可以切回来。`)) return;
        try { await api.banks.switchTo(id); } catch (e) { toast('切换失败：' + (e && e.message || e), 'err'); return; }
        location.reload();   // 主进程已保存 curBank，重载后全量读取新题库
      };
    });
    const m = bpop.querySelector('#tbBankManage');
    if (m) m.onclick = () => { bpop.classList.remove('open'); go('set'); };
    return true;
  }
  ttitle.title = '点击切换题库';
  const openBankPop = (e) => {
    e.stopPropagation();
    if (!renderTbBanks()) return;
    bpop.classList.toggle('open');
    if (bpop.classList.contains('open')) pop.classList.remove('open');
  };
  ttitle.onclick = openBankPop;
  if (tbankBtn) tbankBtn.onclick = openBankPop;
  bpop.onclick = (e) => e.stopPropagation();
  document.addEventListener('click', (e) => {
    const onTrigger = ttitle.contains(e.target) || (tbankBtn && tbankBtn.contains(e.target));
    if (bpop.classList.contains('open') && !bpop.contains(e.target) && !onTrigger) bpop.classList.remove('open');
  });
}
</script>
</body>
</html>
