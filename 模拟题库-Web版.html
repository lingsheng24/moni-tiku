/* ============ 知识点图谱 ============ */
let kpSelected = null;
function splitKP(s) {
  return String(s || '').split(/[、,，;；\/|]+/).map(x => x.trim()).filter(x => x && x !== '未分类');
}
let kpSubject = '';          // 知识点图谱的科目筛选（'' = 全部）

/* ---------- v1.25.0：读取文档顶级标题，把知识点按章节聚成主题 ---------- */
/** 文档缓存：docId -> { content, headings }，避免每题都重解析 */
const kpDocCache = new Map();
function kpDocCacheClear() { kpDocCache.clear(); }

/** 解析顶级标题：优先 Markdown（#/##），其次中文章节编号（第X章/一、/1.1） */
function parseDocHeadings(text) {
  const src = String(text || '').replace(/\r\n?/g, '\n');
  if (!src) return [];
  const md = [];
  const cn = { chapter: [], section: [], cn1: [], num1: [], num2: [] };
  let pos = 0;
  for (const line of src.split('\n')) {
    const raw = line.trim();
    const at = pos;
    pos += line.length + 1;
    if (!raw || raw.length > 60) continue;
    const h = raw.match(/^(#{1,6})\s+(.+?)\s*#*$/);
    if (h) { md.push({ title: h[2].trim(), at, level: h[1].length }); continue; }
    if (/[。；;，,]$/.test(raw)) continue;                       // 句子不算标题
    if (/^第[一二三四五六七八九十百千0-9]+\s*(部分|单元|卷|辑|讲|编|章|篇|部)/.test(raw)) cn.chapter.push({ title: raw, at });
    else if (/^第[一二三四五六七八九十百千0-9]+节/.test(raw)) cn.section.push({ title: raw, at });
    else if (/^[一二三四五六七八九十]{1,3}[、．.]\s*\S/.test(raw)) cn.cn1.push({ title: raw, at });
    else if (/^\d{1,2}\.\d{1,2}\s*[、．.]?\s*\S/.test(raw)) cn.num2.push({ title: raw, at });
    else if (/^\d{1,2}[、．.]\s*\S{2,}/.test(raw)) cn.num1.push({ title: raw, at });
  }
  // Markdown：只取出现过的最高层级（# 优先，全是 ## 时用 ##）
  if (md.length) {
    const minLv = Math.min(...md.map(x => x.level));
    return md.filter(x => x.level === minLv).map(x => ({ title: x.title, at: x.at }));
  }
  for (const key of ['chapter', 'section', 'cn1', 'num1', 'num2']) {
    if (cn[key].length) return cn[key].map(x => ({ title: x.title, at: x.at }));
  }
  return [];
}

/** 标题转成适合做节点名的短标签：去掉「第一章」「一、」「1.1」等编号前缀 */
function topicLabel(t) {
  let s = String(t || '').replace(/^#{1,6}\s*/, '').trim();
  // v1.26.0：先按「第X部分/第X单元…」整词剥离，避免「第一部分 法律法规」被切成「分法律法规」
  s = s.replace(/^第\s*[一二三四五六七八九十百千0-9]+\s*(部分|单元|章节|章|篇|节|讲|卷|辑|编|部)\s*[、.．:：]?\s*/, '');
  s = s.replace(/^[一二三四五六七八九十]{1,3}[、．.]\s*/, '');
  s = s.replace(/^\d{1,2}(\.\d{1,2})?[、．.]?\s*/, '');
  s = s.replace(/^（[一二三四五六七八九十]+）\s*/, '');
  const out = s.trim();
  return out || String(t || '').trim();
}

function kpDocInfo(doc) {
  if (!doc) return { content: '', headings: [] };
  const hit = kpDocCache.get(doc.id);
  if (hit) return hit;
  const content = String(doc.content || '').replace(/\r\n?/g, '\n');
  const rec = { content, headings: parseDocHeadings(content) };
  kpDocCache.set(doc.id, rec);
  return rec;
}
/** 二分/线性找某个字符位置之前最近的标题 */
function headingBefore(headings, at) {
  let best = null;
  for (const h of headings) { if (h.at <= at) best = h; else break; }
  return best;
}
/** 判断一道题属于哪个主题（顶级标题）：题目自带 topic → 原文片段定位 → 知识点文本定位 */
function topicOfQuestion(q, doc) {
  if (!doc) return '';
  const { content, headings } = kpDocInfo(doc);
  if (!headings.length) return '';
  // ① 题目自带 topic（新版生成时由 AI 标注）
  const own = String(q.topic || '').trim();
  if (own) {
    const hit = headings.find(h => h.title === own)
      || headings.find(h => h.title.includes(own) || own.includes(topicLabel(h.title)));
    if (hit) return topicLabel(hit.title);
  }
  // ② 用来源原文片段定位（比知识点文本更贴近真实位置）
  const src = String(q.source_excerpt || '').trim();
  for (const probe of [src.slice(0, 30), src.slice(0, 14), src.slice(0, 8)]) {
    if (probe.length < 6) continue;
    const i = content.indexOf(probe);
    if (i >= 0) { const h = headingBefore(headings, i); if (h) return topicLabel(h.title); }
  }
  // ③ 退而用知识点文本定位
  for (const kp of splitKP(q.knowledge_point)) {
    if (kp.length < 2) continue;
    const i = content.indexOf(kp);
    if (i >= 0) { const h = headingBefore(headings, i); if (h) return topicLabel(h.title); }
  }
  return '';
}
/** 是否显示「双链」（知识点之间的双向关联；设置项，默认开） */
function kpLinkEnabled() { return state.settings.kpLinks !== 0; }
/** v1.28.0：同章节自动建链（同一顶级标题下的知识点自动连成一簇，默认开） */
function kpLinkSecOn() { return state.settings.kpLinkSec !== 0; }
/** v1.28.0：题干关键词重叠自动建链（材料高度相似的两道题，其知识点互链，默认开） */
function kpLinkQsimOn() { return state.settings.kpLinkQsim !== 0; }

/* ---------- v1.28.0：自动识别知识点关联的三条依据 ----------
   ① 同题共现（co）   ：两个知识点出现在同一道题里 —— 最硬的关联
   ② 同章节（sec）    ：同属文档同一个顶级标题 —— 章节内按「共现 > 名称相似」建最小生成树，
                        每个章节连成一簇、边数只有 n-1，避免「所有点都挂到一个中心」的天线效应
   ③ 题干相似（qsim） ：两道题的材料关键词高度重叠 —— 补上「不同题但考同一段材料」的隐性关联
*/

/** 中文二元切词（bigram）：不引第三方分词库，题干相似度够用 */
const KP_STOP_CH = new Set('的了是在和与及或对为有无不也就而把从到由以之其该此这等中各上下或则但若如若每某'.split(''));
const KP_STOP_W = new Set(['下列', '以下', '关于', '说法', '正确', '错误', '的是', '属于', '应当', '可以', '不得',
  '必须', '选择', '选项', '根据', '按照', '情形', '情况', '主要', '内容', '相关', '规定', '要求', '具体', '包括',
  '哪些', '哪一', '哪项', '什么', '如何', '题目', '材料', '本题', '一项', '答案', '解释']);
function kpTokenize(text) {
  const s = String(text || '')
    .replace(/<[^>]*>/g, ' ')
    .replace(/[A-Da-d][.．、)）:：]\s*/g, ' ')      // 选项标记 A. B. C. D.
    .replace(/[\s\u3000]+/g, '');
  const out = new Set();
  for (let i = 0; i < s.length - 1; i++) {
    const g = s.slice(i, i + 2);
    if (!/^[\u4e00-\u9fa5]{2}$/.test(g)) continue;
    if (KP_STOP_CH.has(g[0]) || KP_STOP_CH.has(g[1])) continue;
    if (KP_STOP_W.has(g)) continue;
    out.add(g);
  }
  return out;
}
/** 名称相似度（bigram Jaccard）：只作同章节建链时的次级权重 */
function kpNameSim(a, b) {
  const A = kpTokenize(a), B = kpTokenize(b);
  if (!A.size || !B.size) return String(a) === String(b) ? 1 : 0;
  let inter = 0;
  A.forEach(t => { if (B.has(t)) inter++; });
  return inter / (A.size + B.size - inter);
}

/** 参与相似度计算的题目文本：题干 + 选项（不同题但同材料的，选项往往也一样） */
function kpQuestionText(q) {
  const om = q.options;
  const otxt = !om ? '' : (typeof om === 'string' ? om : JSON.stringify(om));
  return String(q.content || '') + ' ' + otxt;
}

/** 题干相似题对（带缓存）：材料关键词重叠系数 ≥ 0.5 且至少共享 3 个词 */
let kpSimCache = { sig: '', pairs: [] };
function kpSimSig() {
  let h = state.questions.length * 131 + state.practice.length;
  for (const q of state.questions) h = (h * 31 + (q.id || 0) + kpQuestionText(q).length) % 2147483647;
  return h;
}
function kpSimPairs() {
  const sig = kpSimSig();
  if (kpSimCache.sig === sig) return kpSimCache.pairs;
  const qs = state.questions, N = qs.length;
  const sets = qs.map(q => kpTokenize(kpQuestionText(q)));
  const df = new Map();
  sets.forEach(s => s.forEach(t => df.set(t, (df.get(t) || 0) + 1)));
  const inv = new Map();                       // 词 -> 题下标数组（模板词直接丢弃，否则会全库互连）
  sets.forEach((s, i) => s.forEach(t => {
    if (df.get(t) > Math.max(6, N * 0.55)) return;
    let a = inv.get(t); if (!a) { a = []; inv.set(t, a); }
    a.push(i);
  }));
  /* 相似度只在「有效词」上算：全库模板词（如同卷共用的一套选项）被丢掉后，
     不再参与分子分母 —— 否则分母被选项撑大，真正相同的题干反而被稀释到阈值以下 */
  const eff = sets.map(s => {
    const lim = Math.max(6, N * 0.55), out = new Set();
    s.forEach(t => { if (df.get(t) <= lim) out.add(t); });
    return out;
  });
  const cand = new Map();                      // "i-j" -> 共享词数
  inv.forEach(list => {
    if (list.length < 2 || list.length > 40) return;
    for (let a = 0; a < list.length; a++)
      for (let b = a + 1; b < list.length; b++) {
        const k = list[a] + '-' + list[b];
        cand.set(k, (cand.get(k) || 0) + 1);
      }
  });
  const per = new Map();                       // 每道题只保留最相似的 3 道，防止维度爆炸
  cand.forEach((shared, k) => {
    if (shared < 3) return;
    const [i, j] = k.split('-').map(Number);
    const small = Math.min(eff[i].size, eff[j].size);
    if (small < 8) return;                     // 题干太短，相似度不可信
    const r = shared / small;
    if (r < 0.5) return;
    const put = (x, y, rr) => {
      let a = per.get(x); if (!a) { a = []; per.set(x, a); }
      a.push({ j: y, r: rr });
    };
    put(i, j, r); put(j, i, r);
  });
  const pairs = [], seen = new Set();
  per.forEach((list, i) => {
    list.sort((a, b) => b.r - a.r).slice(0, 3).forEach(({ j, r }) => {
      const k = Math.min(i, j) + '-' + Math.max(i, j);
      if (seen.has(k)) return; seen.add(k);
      pairs.push({ i: Math.min(i, j), j: Math.max(i, j), r });
    });
  });
  kpSimCache = { sig, pairs };

}
/** 一道题所属的顶级标题（章节）——只作为知识点/题目的归属信息，不再单独建「主题节点」 */
function sectionOfQuestion(q) {
  if (!q) return '';
  return topicOfQuestion(q, state.docs.find(d => d.id === q.document_id));
}

/* v1.27.0：把「按顶级标题聚合」换成「双链」——
   不再有把一切都挂上去的章节中心节点；知识点之间因为出现在同一道题里而互相链接，
   画成两端带箭头的双链，共现题数越多线越粗。章节降级为归属信息（悬停/详情里展示）。
   v1.28.0：双链改为「自动识别」，三条依据 → 共现(co) / 同章节(sec) / 题干相似(qsim)。 */
function buildGraph() {
  const nodes = [], index = new Map(), pairMap = new Map();
  const linkOn = kpLinkEnabled();
  const qKp = new Map();                   // 题目 id -> 该题的知识点下标（供题干相似建链用）
  const secOf = new Map();                 // kpName -> Map(章节 -> 该章节下的题数)
  const push = name => {
    if (!index.has(name)) {
      index.set(name, nodes.length);
      nodes.push({ name, qids: [], ids: new Set() });
    }
    return index.get(name);
  };
  const bump = (name, sec) => {
    let m = secOf.get(name);
    if (!m) { m = new Map(); secOf.set(name, m); }
    m.set(sec, (m.get(sec) || 0) + 1);
  };
  for (const q of state.questions) {
    if (kpSubject && !matchSubject(q, kpSubject)) continue;   // 按科目筛选
    const ns = splitKP(q.knowledge_point);
    const idxs = ns.map(push);
    if (!ns.length) { const i = push('未分类'); idxs.push(i); }
    for (const i of idxs) { nodes[i].qids.push(q.id); nodes[i].ids.add(q.id); }
    qKp.set(q.id, idxs);
    const sec = sectionOfQuestion(q);
    if (sec) for (const i of idxs) bump(nodes[i].name, sec);
    if (!linkOn) continue;
    /* 双链：同一道题里出现的知识点两两互链（双向），记录共现题数与共同章节 */
    for (let a = 0; a < idxs.length; a++)
      for (let b = a + 1; b < idxs.length; b++) {
        const x = Math.min(idxs[a], idxs[b]), y = Math.max(idxs[a], idxs[b]);
        const k = x + '-' + y;
        let rec = pairMap.get(k);
        if (!rec) { rec = { a: x, b: y, n: 0, secs: new Set() }; pairMap.set(k, rec); }
        rec.n++;
        if (sec) rec.secs.add(sec);
      }
  }
  // 掌握度 + 章节归属（先算完，后面的自动建链要用）
  const stat = id => {
    const node = nodes[id];
    const recs = state.practice.filter(p => node.ids.has(p.question_id));
    return recs.length ? Math.round(recs.filter(p => p.is_correct).length / recs.length * 100) : null;
  };
  for (let i = 0; i < nodes.length; i++) {
    const nd = nodes[i];
    nd.size = nd.qids.length;
    nd.rate = stat(i);
    const m = secOf.get(nd.name);
    nd.sections = m ? [...m.entries()].map(([label, n]) => ({ label, n })).sort((a, b) => b.n - a.n) : [];
  }
  const addPair = (x, y) => {
    if (x > y) { const t = x; x = y; y = t; }
    const k = x + '-' + y;
    let rec = pairMap.get(k);
    if (!rec) { rec = { a: x, b: y, n: 0, secs: new Set(), sec: '', sim: 0 }; pairMap.set(k, rec); }
    return rec;
  };

  /* ② 同章节自动建链：每个章节内部按「共现题数 > 名称相似」建最小生成树。
     用 MST 而不是全互连 —— 章节里 20 个知识点全互连就是 190 条线，糊成一片；
     MST 只有 n-1 条，既能把同章节的点连成一簇，又不会出现「全都连到一个中心」的天线效应。 */
  if (linkOn && kpLinkSecOn()) {
    const groups = new Map();                       // 章节 -> [节点下标]
    for (const nd of nodes) {
      const main = (nd.sections[0] || {}).label;
      if (!main) continue;
      let g = groups.get(main); if (!g) { g = []; groups.set(main, g); }
      g.push(index.get(nd.name));
    }
    groups.forEach((ids, label) => {
      if (ids.length < 2) return;
      const es = [];
      for (let a = 0; a < ids.length; a++)
        for (let b = a + 1; b < ids.length; b++) {
          const x = Math.min(ids[a], ids[b]), y = Math.max(ids[a], ids[b]);
          const co = pairMap.get(x + '-' + y);
          es.push({ x, y, co: co ? co.n : 0, sim: kpNameSim(nodes[ids[a]].name, nodes[ids[b]].name) });
        }
      es.sort((p, q) => (q.co - p.co) || (q.sim - p.sim));
      const uf = new Map(ids.map(i => [i, i]));
      const find = v => { while (uf.get(v) !== v) { uf.set(v, uf.get(uf.get(v))); v = uf.get(v); } return v; };
      let linked = 0;
      for (const e of es) {
        if (linked >= ids.length - 1) break;
        const rx = find(e.x), ry = find(e.y);
        if (rx === ry) continue;
        uf.set(rx, ry); linked++;
        addPair(e.x, e.y).sec = label;              // 已有共现边就直接打标复用，不重复画线
      }
    });
  }

  /* ③ 题干关键词重叠自动建链：材料高度相似的两道题，视为考同一段材料，知识点互链 */
  if (linkOn && kpLinkQsimOn()) {
    for (const { i, j, r } of kpSimPairs()) {
      const qa = state.questions[i], qb = state.questions[j];
      const ia = qa && qKp.get(qa.id), ib = qb && qKp.get(qb.id);
      if (!ia || !ib) continue;
      for (const x0 of ia) for (const y0 of ib) {
        if (x0 === y0) continue;
        const rec = addPair(Math.min(x0, y0), Math.max(x0, y0));
        if (r > rec.sim) rec.sim = r;
      }
    }
  }

  // 节点过多时只保留题量最大的（章节不再占用名额）
  let shown = nodes.map((n, i) => ({ ...n, i }));
  const MAXN = 74;
  if (shown.length > MAXN) shown = shown.sort((a, b) => b.size - a.size).slice(0, MAXN);
  const keep = new Set(shown.map(n => n.i));
  const edges = [...pairMap.values()]
    .filter(r => keep.has(r.a) && keep.has(r.b))
    .map(r => {
      // 一条边可能同时命中多种依据：按「同题共现 > 题干相似 > 同章节」取最强的那个来画
      const kind = r.n > 0 ? 'co' : (r.sim > 0 ? 'qsim' : 'sec');
      return [r.a, r.b, r.n > 0 ? r.n : 1, kind, [...r.secs], r.sec || '', r.sim || 0];
    })
    .sort((p, q) => (p[3] === 'co' ? 0 : 1) - (q[3] === 'co' ? 0 : 1) || q[2] - p[2]);
  return { nodes: shown, edges };
}

/** 按邻接关系 BFS 排序：让相连的知识点索引相邻，球面上就会聚成一簇 */
function kpClusterOrder(nodes, edges) {
  const n = nodes.length;
  const adj = Array.from({ length: n }, () => []);
  edges.forEach(([a, b]) => {
    const ia = nodes.findIndex(x => x.i === a), ib = nodes.findIndex(x => x.i === b);
    if (ia >= 0 && ib >= 0) { adj[ia].push(ib); adj[ib].push(ia); }
  });
  // 题量大的知识点先出发，让重要节点排得更靠前、更居中
  const bySize = Array.from({ length: n }, (_, i) => i).sort((a, b) => nodes[b].size - nodes[a].size);
  const seen = new Array(n).fill(false), order = [];
  for (const start of bySize) {
    if (seen[start]) continue;
    const q = [start]; seen[start] = true;
    while (q.length) {
      const cur = q.shift(); order.push(cur);
      const nb = adj[cur].slice().sort((a, b) => nodes[b].size - nodes[a].size);
      for (const x of nb) if (!seen[x]) { seen[x] = true; q.push(x); }
    }
  }
  return order;
}

/** v1.28.3：斥力强度（设置项，0.5–2.5，默认 1）；越大越分散，越小越紧凑

/** 斐波那契球面布局：均匀铺在单位球面上，写入 n.px/py/pz
 *  v1.28.3：弹簧按边类型加权（强链才聚团），斥力作用范围变大并可调（repel），
 *  解决「三种双链全开时一簇挤成一坨」的问题 */
function sphereLayout(nodes, edges, repel) {
  const n = nodes.length;

  // ① 初始：斐波那契球（黄金角）均匀布点，并按邻接顺序排索引，给松弛一个好起点
  const order = kpClusterOrder(nodes, edges);

  const pos = nodes.map(v => [v.px, v.py, v.pz]);

  const E = edges
    .map(([a, b, wt, kind]) => [idx.get(a), idx.get(b), kind === 'co' ? ((wt || 1) >= 2 ? 1 : 0.75) : 0.42])

  const SPACING = Math.max(0.12, Math.min(0.45, 2 * Math.sqrt(Math.PI / n) * 0.75)); // 拥挤度自适应
  const MIND = SPACING * (0.9 + 0.22 * (R - 1));      // 期望的最小间距（随斥力增大）
  const RANGE = MIND * (1.5 + 0.75 * (R - 1));        // 斥力作用范围（远一点就开始推，避免局部堆叠）
  const TARGET = MIND * 0.92;                          // 弹簧目标：略小于最小间距 → 成团但不重叠
  const K_SPRING = 0.30, K_REPEL = 0.42 * R;
  if (!E.length) { nodes.forEach((v, i) => { v.px = pos[i][0]; v.py = pos[i][1]; v.pz = pos[i][2]; }); return; }
  for (let s = 0; s < 220; s++) {
    const F = pos.map(() => [0, 0, 0]);
    for (const [a, b, w] of E) {                   // 弹簧：相连则靠近（超出 4 倍目标距离就不再硬拉，防止整体塌缩）
      const dx = pos[b][0] - pos[a][0], dy = pos[b][1] - pos[a][1], dz = pos[b][2] - pos[a][2];
      const d = Math.hypot(dx, dy, dz) || 1e-6;
      if (d > TARGET && d < TARGET * 4) {
        const f = (d - TARGET) * K_SPRING * w, ux = dx / d * f, uy = dy / d * f, uz = dz / d * f;
        F[a][0] += ux; F[a][1] += uy; F[a][2] += uz;
        F[b][0] -= ux; F[b][1] -= uy; F[b][2] -= uz;
      }
    }
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {   // 斥力：整个作用范围内线性衰减地推开
      const dx = pos[j][0] - pos[i][0], dy = pos[j][1] - pos[i][1], dz = pos[j][2] - pos[i][2];
      const d = Math.hypot(dx, dy, dz) || 1e-6;
      if (d < RANGE) {
        const f = ((RANGE - d) / RANGE) * K_REPEL, ux = dx / d * f, uy = dy / d * f, uz = dz / d * f;
        F[i][0] -= ux; F[i][1] -= uy; F[i][2] -= uz;
        F[j][0] += ux; F[j][1] += uy; F[j][2] += uz;
      }
    }
    for (let i = 0; i < n; i++) {                  // 取切向分量移动 + 归一化回球面
      const p = pos[i], f = F[i];
      const dot = p[0] * f[0] + p[1] * f[1] + p[2] * f[2];
      let tx = f[0] - dot * p[0], ty = f[1] - dot * p[1], tz = f[2] - dot * p[2];
      const tl = Math.hypot(tx, ty, tz) || 1e-9;
      const step = Math.min(tl, 0.05);
      const nx = p[0] + tx / tl * step, ny = p[1] + ty / tl * step, nz = p[2] + tz / tl * step;
      const nl = Math.hypot(nx, ny, nz) || 1e-9;
      pos[i] = [nx / nl, ny / nl, nz / nl];
    }
  }
  nodes.forEach((v, i) => { v.px = pos[i][0]; v.py = pos[i][1]; v.pz = pos[i][2]; });
}

function kpReadColors() {
  const cs = getComputedStyle(document.body);
  const get = (k, d) => (cs.getPropertyValue(k) || '').trim() || d;
  kpColors.text = get('--text', '#1e293b');
  kpColors.muted = get('--muted', '#64748b');
  kpColors.border = get('--border', '#cbd5e1');
  kpColors.primary = get('--primary', '#3b82f6');
}
function kpAlpha(color, a) {
  const c = String(color).trim();
  if (c[0] === '#') {
    const raw = c.slice(1), hex = raw.length === 3 ? raw.split('').map(x => x + x).join('') : raw;
    const num = parseInt(hex, 16);
    if (Number.isNaN(num)) return c;
    return `rgba(${(num >> 16) & 255},${(num >> 8) & 255},${num & 255},${a})`;
  }
  const m = c.match(/rgba?\(([^)]+)\)/);
  if (m) { const p = m[1].split(',').map(Number); return `rgba(${p[0]},${p[1]},${p[2]},${a})`; }
  return c;
}
function kpResize() {
  if (!kpCanvas) return;
  const rect = kpCanvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(240, Math.round(rect.width)), h = Math.max(240, Math.round(rect.height));
  if (kpCanvas.width !== Math.round(w * dpr) || kpCanvas.height !== Math.round(h * dpr)) {
    kpCanvas.width = Math.round(w * dpr); kpCanvas.height = Math.round(h * dpr);
    kpCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  kpSize = { w, h };
}

/** 把单位球坐标旋成一帧的屏幕坐标 */
function kpProject(cx, cy, R) {
  const cam = kpCam;
  const cosY = Math.cos(cam.rotY), sinY = Math.sin(cam.rotY);
  const cosX = Math.cos(cam.rotX), sinX = Math.sin(cam.rotX);
  return kpGraph.nodes.map(n => {
    const x1 = n.px * cosY + n.pz * sinY, z1 = -n.px * sinY + n.pz * cosY;
    const y2 = n.py * cosX - z1 * sinX, z2 = n.py * sinX + z1 * cosX;
    const persp = KP_CAM_DIST / (KP_CAM_DIST - z2);
    return { n, sx: cx + x1 * R * persp, sy: cy + y2 * R * persp, z: z2, s: persp };
  });
}

/** 画一个箭头尖（双链的两端）：tip=(x,y)，ang 为箭头指向 */
function kpArrowHead(ctx, x, y, ang, size, color) {
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - Math.cos(ang - 0.42) * size, y - Math.sin(ang - 0.42) * size);
  ctx.lineTo(x - Math.cos(ang + 0.42) * size, y - Math.sin(ang + 0.42) * size);
  ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
}

function kpDraw() {
  if (!kpCanvas || !kpCtx || !kpGraph || !kpGraph.nodes.length) return;
  const ctx = kpCtx, { nodes } = kpGraph;
  const w = kpSize.w, h = kpSize.h, cx = w / 2, cy = h / 2;
  const R = Math.min(w, h) * 0.37 * kpCam.zoom;
  ctx.clearRect(0, 0, w, h);

  // 球体光晕，给 3D 感一个视觉底衬
  const glow = ctx.createRadialGradient(cx, cy, R * 0.15, cx, cy, R * 1.3);
  glow.addColorStop(0, kpAlpha(kpColors.primary, 0.10));
  glow.addColorStop(1, kpAlpha(kpColors.primary, 0));
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, cy, R * 1.3, 0, Math.PI * 2); ctx.fill();

  const P = kpProject(cx, cy, R);
  kpProj = P;
  const idxOf = kpGraph.idx;

  /* ① 双链画在节点下层。v1.28.0 起三种自动识别的关联用线型区分：
       co   同题共现 → 主色，共现 ≥2 题实线、1 题虚线，两端带箭头（原来的双链）
       sec  同章节   → 青色细点线（同一顶级标题下的知识点，聚类成簇）
       qsim 题干相似 → 紫色细点线（材料相似的两道题，其知识点互链） */
  const focusName = (kpHover >= 0 && P[kpHover]) ? P[kpHover].n.name : kpSelected;
  ctx.lineCap = 'round';
  /* v1.28.2：常态一律细线、低对比（不抢节点），悬停/选中某个知识点时
     与它相连的边才加粗、换成更深的颜色（deep），一眼看出它的关系网 */
  const KP_EDGE = {
    co:   { color: '#3b82f6', deep: '#1d4ed8', base: s => (s ? 0.26 : 0.13), gain: 0.38, dash: s => (s ? [] : [3, 4]),      lw: s => (s ? 0.95 : 0.75), hl: 2.6 },
    sec:  { color: '#0ea5e9', deep: '#0369a1', base: () => 0.12,             gain: 0.24, dash: () => [4, 3],                  lw: () => 0.8,              hl: 1.8 },
    qsim: { color: '#8b5cf6', deep: '#6d28d9', base: () => 0.12,             gain: 0.24, dash: () => [2, 3],                  lw: () => 0.8,              hl: 1.8 }
  };
  // 弱关联先画、共现后画，让强线压在上面；图例被点击时只画对应类型的边
  // v1.28.4：掌握度筛选生效时，两端只要有一个节点被筛掉，这条线也不画
  const nodeOf = i => { const k = idxOf.get(i); return k === undefined ? null : kpGraph.nodes[k]; };
  const visNode = i => { const nd = nodeOf(i); return !!nd && kpNodeVisible(nd); };
  const EDGES = (kpEdgeFilter
    ? kpGraph.edges.filter(([, wt, kind]) =>
        kpEdgeFilter === 'co2' ? (kind === 'co' && wt >= 2)
        : kpEdgeFilter === 'co1' ? (kind === 'co' && wt < 2)
        : kind === kpEdgeFilter)
    : kpGraph.edges).filter(([a, b]) => visNode(a) && visNode(b));
  EDGES.slice().sort((p, q) => (p[3] === 'co' ? 1 : 0) - (q[3] === 'co' ? 1 : 0)).forEach(([a, b, wt, kind, secs]) => {
    const ia = idxOf.get(a), ib = idxOf.get(b);
    if (ia === undefined || ib === undefined) return;
    const pa = P[ia], pb = P[ib];
    const depth = ((pa.z + pb.z) / 2 + 1) / 2;               // 0(远) → 1(近)
    const scale = (pa.s + pb.s) / 2;
    const related = !!focusName && (pa.n.name === focusName || pb.n.name === focusName);
    const lit = !focusName || related;
    const st = KP_EDGE[kind] || KP_EDGE.co;
    const strong = kind === 'co' ? (wt || 1) >= 2 : true;
    let alpha = st.base(strong) + st.gain * depth;
    if (!lit) alpha *= 0.16;
    if (related) alpha = 0.96;                                // 聚焦：接近不透明
    const col = related ? st.deep : st.color;
    ctx.setLineDash(st.dash(strong));
    ctx.strokeStyle = kpAlpha(col, alpha);
    const baseLw = kind === 'co'
      ? st.lw(strong) + (strong ? Math.min(0.35, (wt - 1) * 0.06) : 0)
      : st.lw(strong);
    const lw = related
      ? Math.max(1.4, Math.min(3.4, st.hl * Math.min(1.25, scale)))
      : Math.max(0.4, Math.min(1.2, baseLw * scale));
    ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(pa.sx, pa.sy); ctx.lineTo(pb.sx, pb.sy); ctx.stroke();
    // 两端箭头只在聚焦时画（常态细线不画箭头，画面清爽）
    if (related) {
      const ang = Math.atan2(pb.sy - pa.sy, pb.sx - pa.sx);
      const size = Math.max(4, Math.min(9, 4 * scale + lw * 1.5));
      const ra = Math.max(6, 8 * pa.s) + 2, rb = Math.max(6, 8 * pb.s) + 2;
      const ac = kpAlpha(col, Math.min(0.95, alpha + 0.2));
      kpArrowHead(ctx, pa.sx + Math.cos(ang) * ra, pa.sy + Math.sin(ang) * ra, ang + Math.PI, size, ac);
      kpArrowHead(ctx, pb.sx - Math.cos(ang) * rb, pb.sy - Math.sin(ang) * rb, ang, size, ac);
    }
  });
  ctx.setLineDash([]);

  // v1.28.4：掌握度筛选把节点全筛掉时，画一句提示，避免以为是空图/卡死
  // v1.35.0：「只看有笔记」筛选同样可能一个都不剩，提示语要跟着换
  const shownCount = kpGraph.nodes.filter(kpNodeVisible).length;
  if (!shownCount) {
    ctx.setLineDash([]);
    ctx.fillStyle = kpColors.muted;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '600 14px system-ui,"Microsoft YaHei",sans-serif';
    const byNote = kpNoteOnlyOn();
    ctx.fillText(byNote ? '当前题库还没有任何知识点笔记'
      : `当前筛选「${KP_M_NAME[kpMasteryFilter] || '掌握度'}」下没有知识点`, cx, cy - 10);
    ctx.font = '12px system-ui,"Microsoft YaHei",sans-serif';
    ctx.fillText(byNote ? '去「知识库」写第一条，或关掉「📝 有笔记」' : '点画布左上角的 ✕ 恢复全部', cx, cy + 14);
    ctx.textBaseline = 'top';
    return;
  }

  // ② 节点由远及近绘制，形成遮挡关系
  const nameOf = new Map(kpGraph.nodes.map(n => [n.i, n.name]));
  const nbrNames = new Set();                 // 当前焦点节点的双链邻居（一次算好，避免每帧重复遍历边）
  if (focusName) EDGES.forEach(([a, b]) => {
    const na = nameOf.get(a), nb = nameOf.get(b);
    if (na === focusName) nbrNames.add(nb);
    else if (nb === focusName) nbrNames.add(na);
  });
  P.map((_, i) => i).sort((i, j) => P[i].z - P[j].z).forEach(i => {
    const p = P[i], nd = p.n;
    if (!kpNodeVisible(nd)) return;                          // v1.28.4 掌握度筛选 / v1.35.0 有笔记筛选
    const isSel = kpSelected === nd.name, isHover = kpHover === i;
    const isNbr = nbrNames.has(nd.name) && !isSel && !isHover;
    /* v1.23.0：节点大小固定（不再随题量变化），只保留近大远小的透视 */
    const r = Math.max(3, 8 * p.s);
    const fade = 0.34 + 0.66 * ((p.z + 1) / 2) * (focusName && !isSel && !isHover && !isNbr ? 0.35 : 1);
    if (isSel || isHover) {                                   // 选中/悬停光环
      ctx.beginPath(); ctx.arc(p.sx, p.sy, r + 7, 0, Math.PI * 2);
      ctx.fillStyle = kpAlpha(isSel ? kpColors.primary : kpColors.muted, 0.22); ctx.fill();
    } else if (isNbr) {                                       // 双链邻居：淡蓝光环
      ctx.beginPath(); ctx.arc(p.sx, p.sy, r + 5, 0, Math.PI * 2);
      ctx.fillStyle = kpAlpha(kpColors.primary, 0.14); ctx.fill();
    }
    ctx.globalAlpha = fade;
    ctx.beginPath(); ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);
    ctx.fillStyle = masteryColor(nd.rate); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.lineWidth = isSel ? 2.6 : 1.2;
    ctx.strokeStyle = (isSel || isNbr) ? kpColors.primary : 'rgba(255,255,255,.9)';
    ctx.stroke();
    /* v1.35.0：有笔记的知识点 —— 外圈加一道琥珀色细环 + 右上角小圆点，进图谱一眼看到哪里写过东西 */
    const nc = kpNoteCount(nd.name);
    if (nc) {
      ctx.beginPath(); ctx.arc(p.sx, p.sy, r + 3.2, 0, Math.PI * 2);
      ctx.strokeStyle = kpAlpha('#f59e0b', 0.35 + 0.45 * ((p.z + 1) / 2)); ctx.lineWidth = 1.3; ctx.stroke();
      const bx = p.sx + r * 0.78, by = p.sy - r * 0.78;
      ctx.beginPath(); ctx.arc(bx, by, Math.max(2.2, r * 0.30), 0, Math.PI * 2);
      ctx.fillStyle = '#f59e0b'; ctx.fill();
      ctx.lineWidth = 1; ctx.strokeStyle = kpAlpha('#ffffff', 0.9); ctx.stroke();
    }
    /* v1.23.0：节点内不再显示题量数字，信息改由悬停提示呈现 */
    // ③ 标签：正面、重要或高亮的才画，避免背面糊成一团
    const showLabel = p.z > -0.12 || isSel || isHover || nodes.length <= 20 || isNbr;
    if (showLabel) {
      const full = nd.name;
      const cut = 8;
      const label = full.length > cut ? full.slice(0, cut) + '…' : full;
      const fs = Math.max(10, Math.min(15, 11.5 * p.s));
      ctx.font = `${isSel || isHover ? 700 : 500} ${fs.toFixed(1)}px system-ui,"Microsoft YaHei",sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      const tw = ctx.measureText(label).width, tx = p.sx, ty = p.sy + r + 4;
      if (isSel || isHover) {                                 // 白底提升可读性
        ctx.fillStyle = kpAlpha('#ffffff', 0.88);
        ctx.fillRect(tx - tw / 2 - 4, ty - 1, tw + 8, fs + 5);
      }
      ctx.fillStyle = (isSel || isHover) ? kpColors.text : (p.z > 0.15 ? kpColors.text : kpColors.muted);
      ctx.globalAlpha = (isSel || isHover) ? 1 : 0.30 + 0.70 * ((p.z + 1) / 2);
      ctx.fillText(label, tx, ty);
      ctx.globalAlpha = 1;
    }
  });
}

/** 命中检测：找出鼠标位置下最靠前的节点 */
function kpPick(mx, my) {
  let best = -1, bestZ = -Infinity;
  kpProj.forEach((p, i) => {
    if (!kpNodeVisible(p.n)) return;                        // 被筛选掉的节点不可点
    const r = Math.max(6, 8 * p.s);
    if (Math.hypot(mx - p.sx, my - p.sy) <= r + 3 && p.z > bestZ) { best = i; bestZ = p.z; }
  });
  return best;
}

function kpTick() {
  if (!kpCanvas || !document.body.contains(kpCanvas)) { kpRaf = 0; return; }   // 离开页面自动停
  kpRaf = requestAnimationFrame(kpTick);
  if (++kpFrame % 60 === 0) kpReadColors();                                     // 主题切换后跟进
  kpResize();
  const cam = kpCam;
  if (cam.target) {                                                             // 聚焦动画
    cam.rotX += (cam.target.rx - cam.rotX) * 0.14;
    let d = cam.target.ry - cam.rotY;
    while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2;
    cam.rotY += d * 0.14;
    cam.zoom += (cam.target.zoom - cam.zoom) * 0.14;
    if (Math.abs(d) < 0.002 && Math.abs(cam.target.rx - cam.rotX) < 0.002) { cam.rotY = cam.target.ry; cam.target = null; }
  } else if (!cam.dragging) {
    // v1.24.0：鼠标停在知识点上时暂停转动，移开后自动继续
    const hoveringNode = kpHover >= 0;
    if (cam.autoSpin && !hoveringNode) cam.rotY += 0.0022;
    if (Math.abs(cam.vx) > 1e-5 || Math.abs(cam.vy) > 1e-5) {                   // 松手后的惯性
      cam.rotY += cam.vy; cam.rotX = clampRotX(cam.rotX + cam.vx);
      cam.vx *= 0.93; cam.vy *= 0.93;
    }
  }
  kpDraw();
}

/** 把某个知识点转到正对镜头的位置 */
function kpFocusNode(name) {
  const nd = (kpGraph && kpGraph.nodes || []).find(x => x.name === name);
  if (!nd) return;
  const rx = Math.atan2(nd.py, Math.hypot(nd.px, nd.pz));
  const ry = Math.atan2(nd.pz, nd.px) - Math.PI / 2;
  let d = ry - kpCam.rotY;
  while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2;
  kpCam.target = { rx: clampRotX(rx), ry: kpCam.rotY + d, zoom: Math.max(kpCam.zoom, 1.25) };
}
function kpZoom(f) { kpCam.zoom = Math.max(0.5, Math.min(3.2, kpCam.zoom * f)); kpCam.target = null; }
function kpResetView() {
  kpCam.target = null; kpCam.vx = kpCam.vy = 0;
  kpCam.rotX = -0.30; kpCam.rotY = 0.6; kpCam.zoom = 1;
}
function kpToggleSpin() { kpCam.autoSpin = !kpCam.autoSpin; viewKP(); toast(kpCam.autoSpin ? '已开启自动旋转' : '已暂停自动旋转'); }
function kpToggleFull() { kpFull = !kpFull; viewKP(); toast(kpFull ? '已切换到大图模式' : '已恢复标准视图'); }

function bindKPCanvas(canvas) {
  let dragging = false, moved = false, last = null, down = null;
  const hideTip = () => { const t = document.getElementById('kpTip'); if (t) t.style.display = 'none'; };
  canvas.onpointerdown = e => {
    dragging = true; moved = false;
    last = down = { x: e.clientX, y: e.clientY };
    kpCam.dragging = true; kpCam.target = null; kpCam.vx = kpCam.vy = 0;
    canvas.style.cursor = 'grabbing'; hideTip();
    try { canvas.setPointerCapture(e.pointerId); } catch (_) { }
    e.preventDefault();
  };
  canvas.onpointermove = e => {
    const r = canvas.getBoundingClientRect();
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    if (dragging) {
      hideTip();
      const dx = e.clientX - last.x, dy = e.clientY - last.y;
      if (Math.abs(e.clientX - down.x) + Math.abs(e.clientY - down.y) > 4) moved = true;
      kpCam.rotY += dx * 0.0065; kpCam.rotX = clampRotX(kpCam.rotX + dy * 0.0065);
      kpCam.vy = dx * 0.0065; kpCam.vx = dy * 0.0065;
      last = { x: e.clientX, y: e.clientY };
    } else {
      const hit = kpPick(mx, my);
      if (hit !== kpHover) {
        // 刚停到节点上：把拖动惯性也清零，真正做到「停住」
        if (hit >= 0 && kpHover < 0) kpCam.vx = kpCam.vy = 0;
        kpHover = hit; canvas.style.cursor = hit >= 0 ? 'pointer' : 'grab';
      }
      kpTipShow(hit, mx, my);
    }
  };
  const end = e => {
    if (!dragging) return;
    dragging = false; kpCam.dragging = false; canvas.style.cursor = 'grab';
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) { }
    if (!moved) {
      const hit = kpPick(e.clientX - canvas.getBoundingClientRect().left, e.clientY - canvas.getBoundingClientRect().top);
      if (hit >= 0) selectKP(kpProj[hit].n.name);
      else clearKPSelection();            // v1.24.0：点空白处取消选中
    }
  };
  canvas.onpointerup = end; canvas.onpointercancel = end;
  canvas.onpointerleave = () => { kpHover = -1; hideTip(); };
  canvas.onwheel = e => { e.preventDefault(); kpZoom(e.deltaY < 0 ? 1.12 : 1 / 1.12); };
  /* v1.23.0：双击不再只是聚焦，改为弹出「题目关联」面板（同时把节点转到正面） */
  canvas.ondblclick = e => {
    const r = canvas.getBoundingClientRect();
    const hit = kpPick(e.clientX - r.left, e.clientY - r.top);
    if (hit >= 0) { const name = kpProj[hit].n.name; kpFocusNode(name); kpRelModal(name); }
  };
}

/** 某知识点在当前（科目筛选后）图里的双链邻居：名字 + 关系类型 + 权重 + 共同章节 */
function kpNeighborInfo(name) {
  const g = kpGraph; if (!g) return [];
  const nd = g.nodes.find(n => n.name === name); if (!nd) return [];
  const byI = new Map(g.nodes.map(n => [n.i, n]));
  const res = [];
  g.edges.forEach(([a, b, wt, kind, secs, sec, sim]) => {
    let other = null;
    if (a === nd.i) other = byI.get(b); else if (b === nd.i) other = byI.get(a);
    if (!other) return;
    res.push({
      name: other.name, n: wt || 1, kind: kind || 'co', secs: secs || [], sec: sec || '', sim: sim || 0,
      size: other.size, rate: other.rate
    });
  });
  const rank = k => (k === 'co' ? 0 : k === 'sec' ? 1 : 2);
  return res.sort((x, y) => (rank(x.kind) - rank(y.kind)) || (y.n - x.n) || (y.sim - x.sim));
}
/** 关系类型的中文说明（提示浮层 / 双链面板共用） */
function kpKindPill(x) {
  if (x.kind === 'co') return `<span class="pill blue">同题 ${x.n} 道</span>`;
  if (x.kind === 'sec') return `<span class="pill gray" title="同一顶级标题下的知识点">同章节${x.sec ? ' · ' + esc(x.sec) : ''}</span>`;
  return `<span class="pill amber" title="题干材料关键词高度重叠">题干相似 ${Math.round((x.sim || 0) * 100)}%</span>`;
}
/** 「共现 3 · 同章节 5 · 相似 2」这样的分类计数，0 的不显示 */
function kpKindCount(list) {
  const c = { co: 0, sec: 0, qsim: 0 };
  list.forEach(x => { c[x.kind] = (c[x.kind] || 0) + 1; });
  return [c.co ? `同题共现 ${c.co}` : '', c.sec ? `同章节 ${c.sec}` : '', c.qsim ? `题干相似 ${c.qsim}` : '']
    .filter(Boolean).join(' · ') || '无';
}
/** 只取名字（给旧调用方 / 提示文案用） */
function kpNeighbors(name) { return kpNeighborInfo(name).map(x => x.name); }

/** 悬停提示浮层：知识点名、题量、正确率、所属章节、双链数量 */
function kpTipShow(i, mx, my) {
  const tip = document.getElementById('kpTip');
  if (!tip) return;
  if (i < 0 || !kpProj[i]) { tip.style.display = 'none'; return; }
  const nd = kpProj[i].n;
  const nb = kpNeighborInfo(nd.name);
  const secs = nd.sections || [];
  const secTxt = secs.length
    ? `<br><span style="color:var(--muted)">章节：${esc(secs.slice(0, 2).map(x => x.label).join('、'))}${secs.length > 2 ? ` 等 ${secs.length} 个` : ''}</span>`
    : '';
  const html = `<b>${esc(nd.name)}</b><br>` +
    `${nd.size} 题 · ${nd.rate === null ? '未练习' : '正确率 ' + nd.rate + '%'}` + secTxt +
    (kpNoteCount(nd.name) ? `<br><span style="color:var(--amber)">📝 ${kpNoteCount(nd.name)} 条笔记</span><span style="color:var(--muted)">（单击节点可看）</span>` : '') +
    (nb.length
      ? `<br><span style="color:var(--primary)">🔗 双链 ${nb.length} 个</span><span style="color:var(--muted)">（${kpKindCount(nb)}）</span>` +
        `<br><span style="color:var(--muted)">${esc(nb.slice(0, 3).map(x => x.name).join('、'))}${nb.length > 3 ? '…' : ''}</span>`
      : '<br><span style="color:var(--muted)">暂无自动识别的关联</span>') +
    `<br><span style="color:var(--primary)">双击沿双链展开题目</span>`;
  tip.innerHTML = html;
  tip.style.display = 'block';
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = mx + 14, y = my + 14;
  if (x + tw > kpSize.w - 8) x = mx - tw - 14;
  if (y + th > kpSize.h - 8) y = my - th - 14;
  tip.style.left = Math.max(4, x) + 'px'; tip.style.top = Math.max(4, y) + 'px';
}

/** 双击知识点：沿双链展开——互相链接的知识点、关联题目、题目之间还共享哪些知识点 */
function kpRelModal(name) {
  const g = kpGraph; if (!g) return;
  const node = g.nodes.find(n => n.name === name); if (!node) return;
  const qs = state.questions.filter(q => node.ids.has(q.id));
  const kpsOf = q => splitKP(q.knowledge_point);
  const nb = kpNeighborInfo(name);
  /* 题目之间的关联：两题除本知识点外还共享其他知识点 */
  const pairs = [];
  for (let a = 0; a < qs.length; a++)
    for (let b = a + 1; b < qs.length; b++) {
      const shared = [...new Set(kpsOf(qs[a]).filter(k => k !== name && kpsOf(qs[b]).includes(k)))];
      if (shared.length) pairs.push({ a: qs[a], b: qs[b], shared });
    }
  modal(`<div class="kp-rel">
    <h3>🔗 「${esc(name)}」双链
      <span class="pill gray">${qs.length} 题</span>
      <span class="pill ${node.rate === null ? 'gray' : node.rate >= 80 ? 'green' : node.rate >= 60 ? 'amber' : 'red'}">${node.rate === null ? '未练习' : '正确率 ' + node.rate + '%'}</span>
      ${nb.length ? `<span class="pill blue">${nb.length} 条双链</span>` : ''}
      <span style="flex:1"></span>
      <button class="sm ghost" onclick="closeModal()">关闭</button></h3>
    <div style="color:var(--muted);font-size:12px;margin:2px 0 4px">双链是<b>自动识别</b>出来的：${nb.length ? kpKindCount(nb) : '暂无'}　
      <span style="color:#3b82f6">■</span> 同题共现　<span style="color:#0ea5e9">■</span> 同章节　<span style="color:#8b5cf6">■</span> 题干相似</div>
    <div class="kp-rel-sec"><b>双向关联的知识点（${nb.length}）</b>
      ${nb.length ? nb.map(x => `<div class="bar-row">
        <span class="name" style="cursor:pointer" onclick="kpRelModal('${esc(x.name)}')">${esc(x.name)}</span>
        ${kpKindPill(x)}
        <span style="flex:1"></span>
        <span class="pill gray">${x.size} 题</span>
        ${x.rate === null ? '<span class="pill gray">未练习</span>' : `<span class="pill ${x.rate >= 80 ? 'green' : x.rate >= 60 ? 'amber' : 'red'}">${x.rate}%</span>`}
        <button class="sm ghost" onclick="selectKP('${esc(x.name)}');closeModal()">跳转 →</button></div>`).join('')
      : '<div class="empty" style="padding:10px 0">这个知识点还没有可自动识别的关联（既没有同题共现的知识点，也不在同章节、题干也不相似）</div>'}
    </div>
    <div class="kp-rel-sec"><b>关联题目（${qs.length}）</b>
      ${qs.map(q => `<div class="q-item">
        <div class="q-head"><span class="pill blue">${TYPES[q.type]}</span><span class="pill gray">${DIFFS[q.difficulty] || ''}</span>
          <span style="flex:1;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(kpsOf(q).join('、'))}</span>
          <button class="sm ghost" onclick="viewQuestion(${q.id})">详情</button></div>
        <div class="q-content">${esc(q.content)}</div>
      </div>`).join('')}
    </div>
    <div class="kp-rel-sec"><b>题目之间的双链（${pairs.length} 组）</b>
      ${pairs.length ? pairs.slice(0, 40).map(p => `<div class="kp-rel-pair">「${esc(p.a.content.slice(0, 18))}${p.a.content.length > 18 ? '…' : ''}」 ↔ 「${esc(p.b.content.slice(0, 18))}${p.b.content.length > 18 ? '…' : ''}」<br>同属知识点：<b>${p.shared.map(esc).join('、')}</b></div>`).join('')
      : '<div class="empty" style="padding:10px 0">这些题目仅通过本知识点相连，暂无其他共同知识点</div>'}
      ${pairs.length > 40 ? `<div style="color:var(--muted);font-size:12px;margin-top:4px">仅显示前 40 组，共 ${pairs.length} 组</div>` : ''}
    </div>
  </div>`);
}

/** 章节清单（章节不再是图谱节点，只在详情里点开看）：这一章有哪些知识点、多少题 */
function kpSectionModal(label) {
  const g = buildGraph();
  const kps = g.nodes.filter(n => (n.sections || []).some(x => x.label === label))
    .sort((a, b) => b.size - a.size);
  const qs = state.questions.filter(q => sectionOfQuestion(q) === label);
  const ratePill = r => `<span class="pill ${r === null ? 'gray' : r >= 80 ? 'green' : r >= 60 ? 'amber' : 'red'}">${r === null ? '未练习' : r + '%'}</span>`;
  const allRate = (() => {
    const recs = state.practice.filter(p => qs.some(q => q.id === p.question_id));
    return recs.length ? Math.round(recs.filter(p => p.is_correct).length / recs.length * 100) : null;
  })();
  modal(`<div class="kp-rel">
    <h3><span style="color:var(--primary)">●</span> 「${esc(label)}」

        <span style="flex:1"></span>
        <span class="pill gray">${k.size} 题</span>${ratePill(k.rate)}</div>`).join('')
      : '<div class="empty" style="padding:10px 0">该章节下的知识点未出现在当前视图（可先切换科目筛选）</div>'}
    </div>
    <div class="kp-rel-sec"><b>该章节下的题目（${qs.length}）</b>
      ${qs.slice(0, 30).map(q => `<div class="q-item">
        <div class="q-head"><span class="pill blue">${TYPES[q.type]}</span><span class="pill gray">${DIFFS[q.difficulty] || ''}</span>
          <span style="flex:1;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(splitKP(q.knowledge_point).join('、'))}</span>

      ${qs.length > 30 ? `<div style="color:var(--muted);font-size:12px;margin-top:4px">仅显示前 30 道，共 ${qs.length} 道</div>` : ''}
    </div>
  </div>`);
}

/* ============ 知识库（v1.35.0） ============
 * 把散落各处的笔记集中到一处，并双向挂回知识点图谱：
 *   ① 知识点笔记 —— 图谱详情卡里写的（kv.kpNotes，按知识点名索引）
 *   ② 错题笔记   —— 错题本里给某道错题写的（mistakes[].note）
 *   ③ 知识库手记 —— 本页新建（kv.kbNotes，随题库隔离，可选关联知识点）
 * 联动：图谱节点有笔记时亮琥珀色小点 + 外圈，可「只看有笔记的知识点」；每条笔记可一键回图谱定位。
 * 笔记只做汇总，不复制：在知识库里改知识点笔记，图谱详情同步变；改错题笔记，错题本同步变。 */
const KB_KIND = {
  kp:   { label: '知识点笔记', ico: '📝', cls: 'amber' },
  mist: { label: '错题笔记',   ico: '📕', cls: 'red' },
  free: { label: '知识库手记', ico: '🗒', cls: 'blue' },
};
let kbFilter = { kw: '', kind: '', kp: '' };
let kbEditing = null;                 // 正在编辑的笔记 key（null = 新建）
let kpNoteCounts = new Map();         // 知识点 -> 笔记条数（kpDraw 每帧读，必须缓存）
let kbGraphNameCache = null;

/** 知识库手记（随题库隔离的 kv） */
function kbFreeNotes() {
  if (!Array.isArray(state.kbNotes)) state.kbNotes = [];
  return state.kbNotes.filter(n => n && String(n.text || '').trim());
}
/** 汇总三类笔记，统一结构后按时间倒序（新笔记在前） */
function kbAllNotes() {
  const out = [];
  const kpNotes = state.kpNotes || {};
  for (const [name, rec] of Object.entries(kpNotes)) {
    if (!rec || !String(rec.text || '').trim()) continue;
    out.push({ key: 'kp:' + name, kind: 'kp', kp: name, kps: [name], text: rec.text, at: rec.at || 0 });
  }
  for (const m of (state.mistakes || [])) {
    if (!m || !String(m.note || '').trim()) continue;
    const q = (state.questions || []).find(x => x.id === m.question_id);
    const kps = splitKP(q && q.knowledge_point);
    if (!kps.length && m.kp) kps.push(m.kp);
    out.push({
      key: 'mist:' + m.id, kind: 'mist', id: m.id, qid: m.question_id,
      kp: kps[0] || '', kps, text: m.note, at: m.note_at || m.created_at || 0,
      content: m.question_content || (q && q.content) || '', qtype: m.type || (q && q.type) || '',
    });
  }
  for (const n of kbFreeNotes()) {
    out.push({
      key: 'free:' + n.id, kind: 'free', id: n.id, kp: n.kp || '',
      kps: n.kp ? [n.kp] : [], text: n.text, at: n.updatedAt || n.at || 0,
    });
  }
  return out.sort((a, b) => (b.at || 0) - (a.at || 0));
}
/** 按关键词 / 类型 / 知识点筛选（纯函数，方便测试） */
function kbFilterList(list, f) {
  const kw = String((f && f.kw) || '').trim().toLowerCase();
  const kind = (f && f.kind) || '';
  const kp = (f && f.kp) || '';
  return (list || []).filter(n => {
    if (kind && n.kind !== kind) return false;
    if (kp && !(n.kps || []).includes(kp)) return false;
    if (!kw) return true;
    return [n.text, (n.kps || []).join(' '), n.content].join('\n').toLowerCase().includes(kw);
  });
}
/** 当前题库图谱里的知识点名集合（不含「未分类」；refresh=true 时重算） */
function kbGraphNames(refresh) {
  if (refresh || !kbGraphNameCache) {
    const s = new Set();
    for (const q of state.questions) splitKP(q.knowledge_point).forEach(k => s.add(k));
    kbGraphNameCache = s;
  }
  return kbGraphNameCache;
}
/** 知识库统计：总数 / 分类数 / 覆盖到的图谱知识点 */
function kbStats(notes) {
  const list = notes || kbAllNotes();
  const graph = kbGraphNames();
  const kpSet = new Set();
  list.forEach(n => (n.kps || []).forEach(k => kpSet.add(k)));
  let covered = 0;
  kpSet.forEach(k => { if (graph.has(k)) covered++; });
  return {
    total: list.length,
    kp: list.filter(n => n.kind === 'kp').length,
    mist: list.filter(n => n.kind === 'mist').length,
    free: list.filter(n => n.kind === 'free').length,
    kpCount: kpSet.size, covered, graphTotal: graph.size,
    last: list.reduce((a, b) => Math.max(a, b.at || 0), 0),
  };
}
/** 重算「知识点 -> 笔记条数」缓存（图谱角标 / 只显示有笔记） */
function kbNoteCountsRefresh() {
  const m = new Map();
  for (const n of kbAllNotes()) for (const k of (n.kps || [])) m.set(k, (m.get(k) || 0) + 1);
  kpNoteCounts = m;
  return m;
}
function kpNoteCount(name) { return kpNoteCounts.get(name) || 0; }
function kpNoteOnlyOn() { return state.settings.kpNoteOnly === 1; }
/** 图谱节点是否可见：掌握度筛选 且（未开笔记筛选 或 该知识点有笔记） */
function kpNodeVisible(nd) {
  if (!kpMasteryMatch(nd)) return false;
  return !kpNoteOnlyOn() || kpNoteCount(nd && nd.name) > 0;
}
/** 图谱工具栏「📝 有笔记」开关 */
async function setKPNoteOnly(on) {
  state.settings.kpNoteOnly = on ? 1 : 0;
  await DB.kvSet('settings', state.settings);

}

function kbNoteCard(n) {
  const meta = KB_KIND[n.kind] || KB_KIND.free;

  return `<div class="kb-note">
    <div class="kb-note-hd"><span class="pill ${meta.cls}">${meta.ico} ${meta.label}</span>${pills || '<span class="pill gray">未关联知识点</span>'}<span style="flex:1"></span></div>
    <div class="kb-note-txt">${esc(n.text)}</div>

async function kbSaveNote() {
  const text = (document.getElementById('kbEText')?.value || '').trim();
  const kp = (document.getElementById('kbEKP')?.value || '').trim();
  if (!text) { toast('笔记内容是空的，写点什么再保存', 'err'); return; }
  const editing = kbEditing ? kbAllNotes().find(n => n.key === kbEditing) : null;
  if (editing) {
    if (editing.kind === 'kp') {
      const oldName = editing.kp;
      const name = kp || oldName;                       // 知识点笔记必须有归属，清空则保留原名
      if (name !== oldName) delete state.kpNotes[oldName];
      state.kpNotes[name] = { text, at: Date.now() };
      await DB.kvSet('kpNotes', state.kpNotes);
    } else if (editing.kind === 'mist') {
      const rec = await DB.get('mistakes', editing.id).catch(() => null);
      if (!rec) { toast('对应错题记录已被删除，无法保存', 'err'); return; }
      rec.note = text; rec.note_at = Date.now();
      await DB.put('mistakes', rec);
      const local = state.mistakes.find(x => x.id === editing.id);
      if (local) { local.note = text; local.note_at = rec.note_at; }
    } else {
      state.kbNotes = kbFreeNotes().map(x => x.id === editing.id
        ? { ...x, kp, text, updatedAt: Date.now() } : x);
      await DB.bkvSet('kbNotes', state.kbNotes);
    }
  } else {
    const rec = { id: 'kb' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), kp, text, at: Date.now() };
    state.kbNotes = [...kbFreeNotes(), rec];
    await DB.bkvSet('kbNotes', state.kbNotes);
  }
  kbEditing = null;
  closeModal();
  kbNoteCountsRefresh();
  toast('笔记已保存，已收入知识库 ✅');
  if (curView === 'kb') viewKB();
  else if (curView === 'kp') { if (kpSelected) { const d = $('#kpDetail'); if (d) d.innerHTML = renderKPDetail(kpSelected); } kpDraw(); }
}
async function kbDeleteNote(key) {
  const n = kbAllNotes().find(x => x.key === key);
  if (!n) return;
  const label = (KB_KIND[n.kind] || KB_KIND.free).label;
  if (!confirm(`确定删除这条${label}吗？（不可恢复）`)) return;
  if (n.kind === 'kp') {
    delete state.kpNotes[n.kp];
    await DB.kvSet('kpNotes', state.kpNotes);
  } else if (n.kind === 'mist') {
    const rec = await DB.get('mistakes', n.id).catch(() => null);
    if (rec) { rec.note = ''; rec.note_at = Date.now(); await DB.put('mistakes', rec); }
    const local = state.mistakes.find(x => x.id === n.id);
    if (local) { local.note = ''; local.note_at = Date.now(); }
  } else {
    state.kbNotes = kbFreeNotes().filter(x => x.id !== n.id);
    await DB.bkvSet('kbNotes', state.kbNotes);
  }
  kbNoteCountsRefresh();
  toast('已删除这条笔记', 'ok');
  if (curView === 'kb') viewKB();
  else if (curView === 'mist') viewMist();
}
/* ---------- 联网查询（v1.36.0） ----------
 * 桌面版由主进程抓取 Bing 结果页并解析，渲染层画成卡片；
 * 「AI 解答」把搜索结果摘要作为参考资料交给模型综合讲解，避免凭空编造。
 * 两种内容都能一键整理成笔记存进知识库（可选关联知识点）。 */
const WS_ENGINES = { bingcn: 'Bing 国内', bing: 'Bing 国际' };
const WS_HIST_MAX = 30;
let wsState = null;

function wsEngineName(id) { return WS_ENGINES[id] || WS_ENGINES.bingcn; }
function wsSearchUrl(q, engine) {
  const base = engine === 'bing' ? 'https://www.bing.com/search?q=' : 'https://cn.bing.com/search?q=';
  return base + encodeURIComponent(q) + '&setlang=zh-CN';
}
/* ================= 划词工具条（v1.37.0） =================
 * 在正文里选中字 / 词 / 句，浮出「🔍 查询」「📝 笔记」两个按钮：
 *  · 查询：把选中内容当关键词打开联网查询面板；看完直接关掉即可（不点保存就不留痕），
 *          想保留就点面板里的「💾 存进知识库」
 *  · 笔记：把选中内容填进「新建知识库笔记」，可补充要点后保存，保存即进知识库
 */
let selBar = null;       // 浮出的工具条 DOM
let selBarText = '';     // 缓存的选中文字（点按钮的一瞬间选区可能已被浏览器清掉）
let selBarKp = '';       // 推测出的关联知识点
let selBarTimer = 0;     // 延迟句柄

/** 选区是否落在输入框 / 可编辑区域里（那种情况用户在打字，不该弹条） */
function selInEditable(node) {
  let el = node && (node.nodeType === 1 ? node : node.parentElement);
  while (el && el !== document.body) {
    const tag = (el.tagName || '').toUpperCase();
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return true;
    if (el.isContentEditable) return true;
    el = el.parentElement;
  }
  return false;
}

/** 从选中文字推测关联知识点：优先完全相等，其次「包含」里取最长的那个 */
function selGuessKP(text) {
  const t = String(text || '').trim();
  if (!t) return '';
  let names = [];
  try { names = [...kbGraphNames(true)]; } catch (e) { names = []; }
  if (names.includes(t)) return t;
  let best = '';
  for (const n of names) {
    if (n && n.length >= 2 && t.includes(n) && n.length > best.length) best = n;
  }
  return best;
}

function selBarHide() {
  if (selBar && selBar.parentNode) selBar.parentNode.removeChild(selBar);
  selBar = null;
}

function selClear() {
  try { const s = window.getSelection(); if (s && s.removeAllRanges) s.removeAllRanges(); } catch (e) { }
}

/** 在选区上方浮出工具条；上方放不下就翻到下方 */
function selBarShow(text, rect) {
  selBarHide();
  selBarText = text;
  selBarKp = selGuessKP(text);
  const bar = document.createElement('div');
  bar.className = 'selbar';
  bar.id = 'selBar';
  bar.innerHTML =
    '<button class="selbar-btn" data-act="search" title="联网查询这段内容">🔍 查询</button>' +
    '<span class="selbar-sep"></span>' +
    '<button class="selbar-btn" data-act="note" title="存成知识库笔记">📝 笔记</button>';
  document.body.appendChild(bar);
  selBar = bar;
  /* 按下时阻止默认行为：否则浏览器会先清掉选区，后面就取不到选中内容了 */
  bar.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); });
  bar.addEventListener('click', e => {
    const btn = e.target && e.target.closest ? e.target.closest('.selbar-btn') : null;
    if (!btn) return;
    const act = btn.dataset.act;
    const t = selBarText, kp = selBarKp;
    selBarHide(); selClear();
    if (act === 'search') wsOpen(t, kp);
    else selMakeNote(t, kp);
  });
  const w = bar.offsetWidth || 150, h = bar.offsetHeight || 34, gap = 9;
  const vw = window.innerWidth || document.documentElement.clientWidth || 1200;
  /* v1.37.1：桌面版标题栏 36px，上翻时不得钻进标题栏底下 */
  const topMin = document.body.classList.contains('is-desktop') ? 44 : 8;
  let left = rect.left + rect.width / 2 - w / 2;
  left = Math.max(8, Math.min(left, vw - w - 8));
  let top = rect.top - h - gap, below = false;
  if (top < topMin) { top = rect.bottom + gap; below = true; }
  bar.style.left = Math.round(left) + 'px';
  bar.style.top = Math.round(top) + 'px';
  if (below) bar.classList.add('below');
}

/** mouseup / keyup 后统一走这里：读选区 → 过滤 → 显示或隐藏 */
function selBarSync() {
  clearTimeout(selBarTimer);
  selBarTimer = setTimeout(() => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) { selBarHide(); return; }
    const anchor = sel.anchorNode;
    const host = anchor && (anchor.nodeType === 1 ? anchor : anchor.parentElement);
    /* 输入框里是在编辑；标题栏 / 侧栏里选导航文字没意义 —— 都不弹 */
    if (selInEditable(anchor) || (host && host.closest && host.closest('#titlebar, .sidebar'))) { selBarHide(); return; }
    const text = String(sel.toString() || '').replace(/\s+/g, ' ').trim();
    if (!text || text.length > 300) { selBarHide(); return; }
    let rect = null;
    try { rect = sel.getRangeAt(0).getBoundingClientRect(); } catch (e) { rect = null; }
    if (!rect || (!rect.width && !rect.height)) { selBarHide(); return; }
    selBarShow(text, rect);
  }, 20);
}

/** 把选中文字填进「新建知识库笔记」（保存后即进知识库） */
function selMakeNote(text, kp) {
  kbEditing = null;
  kbOpenEditor({ kind: 'free', kp: kp || '', text: String(text || ''), isNew: true });
  setTimeout(() => {
    const ta = document.getElementById('kbEText');
    if (!ta) return;
    try { ta.focus(); const n = ta.value.length; ta.setSelectionRange(n, n); } catch (e) { }
  }, 80);
}

/** 绑定全局事件（启动时调一次即可） */
function initSelBar() {
  document.addEventListener('mouseup', e => {
    if (selBar && selBar.contains(e.target)) return;
    selBarSync();
  });
  document.addEventListener('keyup', e => {
    /* Shift + 方向键、Ctrl+A 这类键盘选择也要支持 */
    if (e.shiftKey || e.key === 'Shift' || (e.ctrlKey && (e.key === 'a' || e.key === 'A'))) selBarSync();
  });
  document.addEventListener('touchend', () => selBarSync(), { passive: true });
  document.addEventListener('mousedown', e => {
    if (selBar && !selBar.contains(e.target)) selBarHide();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') selBarHide(); });
  window.addEventListener('scroll', () => selBarHide(), true);   // 捕获任意滚动容器
  window.addEventListener('resize', () => selBarHide());
  window.addEventListener('blur', () => selBarHide());
}

/* ============ 间隔复习（SM-2 记忆曲线） ============ */
const DAY_MS = 86400000;
const REV_MARK = [
  { k: 1, name: '忘记', desc: '完全没印象', cls: 'r1' },
  { k: 2, name: '困难', desc: '很吃力才想起', cls: 'r2' },
  { k: 3, name: '良好', desc: '想起来了', cls: 'r3' },
  { k: 4, name: '简单', desc: '脱口而出', cls: 'r4' },

const REV_STATES = { fresh: '未学习', learning: '学习中', young: '记忆期', mature: '已掌握' };
function todayStart() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }
function ivlLabel(d) {
  d = +d || 0;
  if (d <= 0) return '一会儿';
  if (d < 1) return Math.max(1, Math.round(d * 24 * 60)) + ' 分钟';
  if (d < 30) return Math.round(d) + ' 天';
  if (d < 365) return (d / 30).toFixed(1) + ' 个月';
  return (d / 365).toFixed(1) + ' 年';
}
function dueLabel(ts) {
  const diff = (ts || 0) - Date.now();
  if (diff <= 0) return '待复习';
  const h = diff / 3600000;
  if (h < 1) return Math.max(1, Math.round(diff / 60000)) + ' 分钟后';
  if (h < 24) return Math.round(h) + ' 小时后';
  const d = Math.round(h / 24);
  return d === 1 ? '明天' : d + ' 天后';
}
function cardState(c) {
  if (!c.reps && !c.lapses) return 'fresh';
  const i = c.interval || 0;
  if (i < 1) return 'learning';
  return i >= 21 ? 'mature' : 'young';
}
const isFreshCard = c => cardState(c) === 'fresh';
/** SM-2 记忆调度：grade 1=忘记 2=困难 3=良好 4=简单；返回新的调度字段 */
function sm2(card, grade) {
  const now = Date.now();
  let ease = card.ease ?? 2.5, reps = card.reps || 0, lapses = card.lapses || 0, ivl;
  if (grade <= 1) {                       // 忘记 → 重置到短间隔，降低熟悉因子
    lapses++; reps = 0; ivl = 10 / 1440;  // 10 分钟后重现
    ease = Math.max(1.3, +(ease - 0.2).toFixed(2));
  } else {
    reps++;
    const q = grade === 2 ? 3 : grade === 3 ? 4 : 5;
    ease = +(ease + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02))).toFixed(2);
    ease = Math.max(1.3, Math.min(2.8, ease));
    if (reps === 1) ivl = grade === 4 ? 4 : 1;
    else if (reps === 2) ivl = grade === 2 ? 2 : grade === 4 ? 8 : 3;
    else ivl = Math.max(1, Math.round((card.interval || 1) * ease * (grade === 2 ? 0.6 : grade === 4 ? 1.3 : 1)));
    ivl = Math.min(ivl, 365 * 3);
  }
  return { ease, interval: ivl, reps, lapses, due: now + ivl * DAY_MS, state: cardState({ reps, interval: ivl }), hist: [...(card.hist || []), { at: now, g: grade, i: ivl }].slice(-60) };
}
/** 今日调度统计 */
function revTodayStat() {
  const t0 = todayStart();
  let done = 0, fresh = 0, again = 0, ok = 0;
  for (const c of state.reviews) {
    const h = c.hist || [];
    for (const x of h) if (x.at >= t0) { done++; x.g <= 1 ? again++ : ok++; }
    const first = h[0];
    if (first && first.at >= t0 && !h.some(x => x.at < t0)) fresh++;
  }
  return { done, fresh, again, ok, keep: done ? Math.round(ok / done * 100) : null };
}
function revForecast(n = 14) {
  const t0 = todayStart(), b = Array.from({ length: n }, (_, i) => ({ day: i, n: 0 }));
  for (const c of state.reviews) {
    if (isFreshCard(c)) continue;
    const d = Math.floor((c.due - t0) / DAY_MS);
    if (d < n) b[d < 0 ? 0 : d].n++;
  }
  return b;
}

function buildRevQueue() {

  const newLeft = Math.max(0, (+s.revNewLimit || 20) - t.fresh);

  const fresh = shuffle(state.reviews.filter(isFreshCard)).slice(0, newLeft);

async function submitRevSession() {

function readRevInput(q) {
  const area = $('#revAnswerArea');
  if (!area) return '';
  if (q.options && q.type !== 'true_false') return [...area.querySelectorAll('.opt-click.sel')].map(e => e.dataset.l).join('');
  if (q.type === 'true_false') return area.querySelector('.tag.on')?.dataset.v || '';
  const cid = rev && rev.items[rev.idx] ? rev.items[rev.idx].id : '';
  return ($('#rv-ta-' + cid)?.value || '').trim();
}
function hintPill(q, u) {
  const subjective = q.type === 'short_answer' || isTextType(q.type) || (q.type === 'fill_blank' && /[一-龥]{4,}/.test(q.answer));
  const ok = subjective ? null : gradeObjective(q, u);
  const map = { null: ['gray', '主观题，请对照参考答案自评'], true: ['green', '✔ 你的答案正确'], false: ['red', '✘ 你的答案不正确'] };
  const [c, t] = map[String(ok)];
  return `<span class="pill ${c}">${t}</span> <span style="color:var(--muted);font-size:12px">你的答案：${esc(u)}</span>`;
}
async function rateRev(g) {
  const card = rev.items[rev.idx];
  if (card.__rated) return;
  const up = sm2(card, g);
  card.__rated = g;
  Object.assign(card, up);
  const payload = { ...card }; delete payload.__rated;
  try { await DB.put('review', payload); } catch (e) { console.error(e); }
  rev.rated++;
  if (g <= 1) { rev.again++; rev.items.push(card); }  // 忘记 → 本轮稍后重现
  rev.idx++;
  renderRevCard();
}

async function autoEnqueueIds(ids) {

  const exist = new Set(state.reviews.map(r => r.question_id));

let revKeyHandler = null;
function bindRevKeys(q, reveal) {
  if (revKeyHandler) { document.removeEventListener('keydown', revKeyHandler); revKeyHandler = null; }
  let revealed = false;
  revKeyHandler = e => {
    if (e.isComposing || isTypingTarget()) return;
    if (e.key === 'Escape') { rev = null; viewReview(); return; }
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (!revealed) { revealed = true; reveal(readRevInput(q) || ''); }
      return;
    }
    if (!revealed) return;
    const map = { '1': 1, '2': 2, '3': 3, '4': 4 };
    if (map[e.key]) { e.preventDefault(); rateRev(map[e.key]); }
  };
  document.addEventListener('keydown', revKeyHandler);
}

function getAnswerLetters(it) {
  return (it.options || []).map(o => (o.trim()[0] || '').toUpperCase());
}
function renderQuiz() {
  const it = quiz.items[quiz.idx];
  const saved = quiz.answers[quiz.idx] || {};
  const total = quiz.items.length;
  const doneN = quiz.answers.filter(Boolean).length;
  $('#view').innerHTML = `
  <h1>答题练习</h1><div class="sub">第 ${quiz.idx + 1} / ${total} 题 · 已答对 ${quiz.correct} 题 · 已作答 ${doneN} 题
    <span style="float:right"><button class="sm ghost" onclick="if(confirm('退出本次练习？进度将丢失。')){quiz=null;go('practice')}">✕ 退出练习</button></span></div>
  <div class="progress" style="margin-bottom:12px"><i style="width:${doneN / total * 100}%"></i></div>
  <div class="nav-grid noprint">
    ${quiz.items.map((_, i) => {
      const a = quiz.answers[i];
      const cls = !a ? '' : (a.correct ? 'ok' : 'no');
      return `<div class="qi ${cls} ${i === quiz.idx ? 'cur' : ''}" onclick="goQuestion(${i})">${i + 1}</div>`;
    }).join('')}
  </div>
  <div class="q-item">
    <div class="q-head"><span class="pill blue">${TYPES[it.type]}</span><span class="pill gray">${DIFFS[it.difficulty] || it.difficulty}</span>
      ${it.knowledge_point ? `<span class="pill amber">${esc(it.knowledge_point)}</span>` : ''}</div>
    <div class="q-content" style="font-size:16px">${esc(it.content)}</div>
    <div style="margin-top:10px" id="answerArea">
      ${renderAnswerInput(it, saved)}
    </div>
    <div class="row" style="margin-top:16px">
      <button class="primary" id="submitBtn" ${saved.done ? 'disabled' : ''}>提交答案 <span class="kbd" style="background:rgba(255,255,255,.2);color:#fff">Enter</span></button>
      <button id="nextBtn" class="ghost" ${saved.done ? '' : 'disabled'}>${quiz.idx === total - 1 ? '查看结果' : '下一题 →'}</button>
      ${quiz.idx > 0 ? `<button class="ghost" onclick="goQuestion(${quiz.idx - 1})">← 上一题</button>` : ''}
    </div>
  </div>`;
  if (saved.done) showJudgeResult(it, saved);
  else {
    // 绑定答题交互
    const done = () => quiz.answers[quiz.idx]?.done;
    document.querySelectorAll('#answerArea .opt-click').forEach(el => el.onclick = () => {
      if (done()) return;
      if (it.type === 'multiple_choice') el.classList.toggle('sel');
      else {
        document.querySelectorAll('#answerArea .opt-click').forEach(x => x.classList.remove('sel'));
        el.classList.add('sel');
      }
    });
    document.querySelectorAll('#answerArea .tag').forEach(el => el.onclick = () => {
      if (done()) return;
      document.querySelectorAll('#answerArea .tag').forEach(x => x.classList.remove('on'));
      el.classList.add('on');
    });
    bindKeys();
  }
  const submit = $('#submitBtn'), next = $('#nextBtn');
  if (submit) submit.onclick = () => submitAnswer(it);
  next.onclick = () => nextQuestion();
}
function goQuestion(i) { quiz.idx = i; renderQuiz(); }
function nextQuestion() {
  const { items } = quiz;
  if (quiz.idx === items.length - 1) {
    const un = quiz.answers.map((a, i) => a ? -1 : i).filter(i => i >= 0);
    if (un.length) {
      const first = un[0];
      if (confirm(`还有 ${un.length} 道题未作答，要跳到第 ${first + 1} 题继续吗？\n\n点击「确定」继续作答，点击「取消」直接交卷。`)) {
        quiz.idx = first; renderQuiz(); return;
      }
    }
    quiz.finished = true; renderQuizResult();
  } else { quiz.idx++; renderQuiz(); }
}
/* 键盘快捷键：A-D / 1-4 选择，Enter 提交，→ 下一题 */
let keyHandler = null;
function bindKeys() {
  if (keyHandler) document.removeEventListener('keydown', keyHandler);
  keyHandler = e => {
    const it = quiz.items[quiz.idx];
    const saved = quiz.answers[quiz.idx] || {};
    if (e.isComposing) return;                    // 输入法组字中：所有按键一律放行，否则汉字打不进去
    if (isTypingTarget()) {
      const tag = e.target?.tagName;
      if ((tag === 'TEXTAREA' || tag === 'INPUT') && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitAnswer(it); }
      return;
    }
    const letters = getAnswerLetters(it);
    const k = e.key.toUpperCase();
    if (it.options && letters.includes(k)) {
      if (saved.done) return;
      const el = [...document.querySelectorAll('#answerArea .opt-click')].find(x => x.dataset.l === k);
      if (!el) return;
      if (it.type === 'multiple_choice') el.classList.toggle('sel');
      else {
        document.querySelectorAll('#answerArea .opt-click').forEach(x => x.classList.remove('sel'));
        el.classList.add('sel');
      }
      e.preventDefault(); return;
    }
    if (/^[1-9]$/.test(e.key)) {
      const idx = +e.key - 1;
      if (it.options && letters[idx]) {
        const L = letters[idx];
        const el = [...document.querySelectorAll('#answerArea .opt-click')].find(x => x.dataset.l === L);
        if (el && !saved.done) {
          if (it.type === 'multiple_choice') el.classList.toggle('sel');
          else { document.querySelectorAll('#answerArea .opt-click').forEach(x => x.classList.remove('sel')); el.classList.add('sel'); }
        }
      } else if (it.type === 'true_false') {
        const tags = document.querySelectorAll('#answerArea .tag');
        if (tags[idx] && !saved.done) { tags.forEach(x => x.classList.remove('on')); tags[idx].classList.add('on'); }
      }
      e.preventDefault(); return;
    }
    if (e.key === 'Enter') { e.preventDefault(); if (!saved.done) submitAnswer(it); else nextQuestion(); }
    if (e.key === 'ArrowRight') { e.preventDefault(); if (saved.done) nextQuestion(); }
    if (e.key === 'ArrowLeft' && quiz.idx > 0) { e.preventDefault(); goQuestion(quiz.idx - 1); }
  };
  document.addEventListener('keydown', keyHandler);
}
function renderAnswerInput(it, saved) {
  if (it.options && it.type !== 'true_false') {   // 选择式：内置单/多选与自定义选择式题型通用
    return it.options.map((o, i) => {
      const letter = o.trim()[0];
      const sel = (saved.user || '').includes(letter) ? 'sel' : '';
      return `<div class="q-opt opt-click ${sel}" data-l="${esc(letter)}">${esc(o)}</div>`;
    }).join('');
  }
  if (it.type === 'true_false') {
    return `<div class="row">
      ${['正确', '错误'].map(v => `<span class="tag ${(saved.user || '') === v ? 'on' : ''}" data-v="${v}">${v}</span>`).join('')}</div>`;
  }
  return `<textarea id="subAns" placeholder="在此输入你的答案…" ${saved.done ? 'disabled' : ''}>${esc(saved.user || '')}</textarea>`;
}
async function submitAnswer(it) {
  const saved = quiz.answers[quiz.idx] = quiz.answers[quiz.idx] || {};
  if (saved.done) return;
  let user = '';
  if (it.options && it.type !== 'true_false') {
    user = [...document.querySelectorAll('#answerArea .opt-click.sel')].map(e => e.dataset.l).join('');
    if (!user) { toast('请先选择答案', 'err'); return; }
  } else if (it.type === 'true_false') {
    user = document.querySelector('#answerArea .tag.on')?.dataset.v || '';
    if (!user) { toast('请先选择答案', 'err'); return; }
  } else {
    user = $('#subAns').value.trim();
    if (!user) { toast('请先输入答案', 'err'); return; }
  }
  saved.user = user;
  if (it.type === 'short_answer' || isTextType(it.type) || (it.type === 'fill_blank' && /[一-龥]{4,}/.test(it.answer))) {
    const r = await gradeSubjective(it, user);
    if (r.correct === null) { // 自评
      saved.done = true; saved.selfGrade = true;
      const ok = confirm(`AI 判分不可用，请自评。\n\n你的答案：${user}\n参考答案：${it.answer}\n\n点击「确定」= 答对，「取消」= 答错`);
      saved.correct = ok;
      finishSubmit(it, saved);
      return;
    }
    saved.correct = r.correct; saved.aiNote = r.aiNote;
  } else {
    saved.correct = gradeObjective(it, user);
  }
  saved.done = true;
  finishSubmit(it, saved);
}
async function finishSubmit(it, saved) {
  if (saved.correct) {
    quiz.correct++;
    // 重练答对 → 自动移出错题本
    if (state.settings.autoRemove) {
      const ms = state.mistakes.filter(m => m.question_id === it.id);
      for (const m of ms) await DB.del('mistakes', m.id);
      if (ms.length) saved.mastered = true;
    }
  }
  await DB.add('practice', { question_id: it.id, is_correct: saved.correct ? 1 : 0, answered_at: Date.now() });
  if (!saved.correct) {
    const exist = state.mistakes.find(m => m.question_id === it.id);
    if (!exist) {
      await DB.add('mistakes', {
        question_id: it.id, user_answer: saved.user, correct_answer: it.answer,
        mistake_reason: saved.aiNote || '', created_at: Date.now(),
        question_content: it.content, type: it.type, difficulty: it.difficulty,
      });
    }
    await autoEnqueueIds([it.id]);   // 答错自动进入间隔复习队列
  }
  await refreshData();

/* ============ 模拟考试 ============ */
let exam = null, examTimer = null;
const DEFAULT_SCORE = { single_choice: 3, multiple_choice: 5, true_false: 2, fill_blank: 4, short_answer: 8 };
let examCfgScore = { ...DEFAULT_SCORE };
/* 组卷条件（题型/难度选择）：考试与组卷导出共用，保证导出的就是这套题 */
let examPickedTypes = new Set(), examPickedDiffs = new Set();

/* ---------- v1.29.0：组卷去重（精确 + 近似）与知识点均衡 ----------
   原来的组卷就是「打乱后取前 N 道」，题库里同知识点的近似题会一起进卷，
   一场考试里出现好几道「换个说法问同一件事」的题。现在分四步：
   ① 精确重复（题干归一化后一字不差）只留一道
   ② 近似重复（题干关键词重叠 ≥72% 且共享 ≥3 个有效词）合并成一组，每组留一道
   ③ 按知识点轮转抽题，让同一知识点不扎堆
   ④ 去重后不够题数时，退回用近似题补足（宁可用近似题，也不塞一模一样的）
   v1.34.0 补第 ⑤ 步：跨场次避重——优先抽没考过 / 考得最少 / 最久没出现的题，
   题库小、连考多场时不再每场都是同一批题 */
const EXAM_DUP_SIM = 0.72;        // 题干相似度达到这个值 → 视为同一道题
const EXAM_DUP_MIN_SHARED = 3;    // 且至少共享 3 个「有效词」（全库模板词已剔除，见下）
const EXAM_PICK_TTL = 4000;       // 组卷结果缓存：预览与「开始考试」拿到同一套题
let examPickCache = { key: '', at: 0, res: null };

/** 题干归一化：去掉空白、标点、选项标记，用于识别「一字不差」的重复 */
function examNormStem(s) {
  return String(s || '')
    .replace(/<[^>]*>/g, '')
    .replace(/[A-D][.．、)）:：]\s*/g, ' ')
    .replace(/[\s\u3000]+/g, '')
    .replace(/[，。、；：？！“”‘’（）()《》【】\[\]—－…·,.;:?!"'`~!@#$%^&*_+=|\\/<>]/g, '')
    .toLowerCase();
}
/** 题干有效词集合（复用知识点图谱的切词）；题干太短则返回空集合——只做精确去重 */
function examStemTokens(q) {
  const set = kpTokenize(q && q.content);
  return set.size >= 6 ? set : new Set();
}
/** 题目「信息完整度」：一组重复题里留最全的那道（有解析 > 有答案 > 选项多） */
function examQuality(q) {
  const ex = String((q && q.explanation) || '').length;
  const ans = q && q.answer ? 1 : 0;
  const opt = Array.isArray(q && q.options) ? q.options.length : 0;
  return Math.min(40, ex) * 2 + ans * 30 + opt * 2;
}
/** 组卷前去重：精确重复 + 近似重复 */
function examDedupe(pool) {
  // ① 精确重复
  const byKey = new Map(), droppedExact = [];
  pool.forEach((q, i) => {
    let k = examNormStem(q.content);
    if (k.length < 8) k = '@' + i;                 // 题干过短/为空：不参与归一化分组
    const prev = byKey.get(k);
    if (!prev) { byKey.set(k, q); return; }
    if (examQuality(q) > examQuality(prev)) { droppedExact.push(prev); byKey.set(k, q); }
    else droppedExact.push(q);
  });
  const kept = [...byKey.values()];
  if (kept.length < 2) return { kept, droppedExact, droppedNear: [] };

  // ② 近似重复：只在「有效词」上算相似度——像「根据矿产资源法的规定」这种
  //    全库模板词（出现在一半以上题目里）会被剔除，否则模板词会把
  //    不同知识点的题也拉到一起（v1.28.0 图谱相似度踩过同一个坑）
  const N2 = kept.length;
  const sets = kept.map(examStemTokens);
  const df = new Map();
  sets.forEach(s => s.forEach(tk => df.set(tk, (df.get(tk) || 0) + 1)));
  const lim = Math.max(6, N2 * 0.55);
  const eff = sets.map(s => {
    const o = new Set();
    s.forEach(tk => { if (df.get(tk) <= lim) o.add(tk); });
    return o;
  });
  const inv = new Map();
  eff.forEach((s, i) => s.forEach(tk => {
    let a = inv.get(tk); if (!a) { a = []; inv.set(tk, a); }
    a.push(i);
  }));
  const cnt = new Map();
  inv.forEach(list => {
    if (list.length < 2 || list.length > 60) return;   // 只被一两道或几乎全库共用的词没区分度
    for (let a = 0; a < list.length; a++)
      for (let b = a + 1; b < list.length; b++) {
        const k = list[a] + ',' + list[b];
        cnt.set(k, (cnt.get(k) || 0) + 1);
      }
  });
  const pairs = [];
  cnt.forEach((shared, k) => {
    if (shared < EXAM_DUP_MIN_SHARED) return;
    const cut = k.indexOf(',');
    const i = +k.slice(0, cut), j = +k.slice(cut + 1);
    const small = Math.min(eff[i].size, eff[j].size);
    if (!small) return;
    const sim = shared / small;
    if (sim >= EXAM_DUP_SIM) pairs.push([i, j, sim]);
  });
  if (!pairs.length) return { kept, droppedExact, droppedNear: [] };

  // 并查集把「近似重复」连成簇，每簇只留信息最全的一道
  const uf = new Map(kept.map((_, i) => [i, i]));
  const find = x => { let r = x; while (uf.get(r) !== r) r = uf.get(r); while (uf.get(x) !== r) { const n = uf.get(x); uf.set(x, r); x = n; } return r; };
  const union = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) uf.set(rb, ra); };
  pairs.forEach(([i, j]) => union(i, j));
  const groups = new Map();
  kept.forEach((q, i) => {
    const r = find(i);
    let g = groups.get(r); if (!g) groups.set(r, g = []);
    g.push({ q, i });
  });
  const finalKept = [], droppedNear = [];
  groups.forEach(g => {
    if (g.length === 1) { finalKept.push(g[0].q); return; }
    g.sort((a, b) => examQuality(b.q) - examQuality(a.q) || a.i - b.i);
    finalKept.push(g[0].q);
    for (let x = 1; x < g.length; x++) droppedNear.push(g[x].q);
  });
  return { kept: finalKept, droppedExact, droppedNear };
}

/** v1.34.0：跨场次避重的依据——每题「被考次数」与「最近一次出现在考试/练习里的时间」。
 *  考试记录按场次计次（exams[].results[].qid）；练习只取时间戳（practice[].answered_at），
 *  刚刷过的题往后排，让考试优先检验「一段时间没见」的题。 */
function examSeenMap() {
  const m = new Map();
  const touch = (id, at, isExam) => {
    if (!id) return;
    let h = m.get(id); if (!h) m.set(id, h = { n: 0, last: 0 });
    if (isExam) h.n++;
    if (at > h.last) h.last = at;
  };
  for (const ex of (state.exams || [])) {
    const at = +ex.submitted_at || 0;
    for (const r of (ex.results || [])) touch(r.qid, at, true);
  }
  for (const p of (state.practice || [])) touch(p.question_id, +p.answered_at || 0, false);
  return m;
}

/** 组卷核心：去重 → 跨场次轮换 → 知识点轮转 → 不足时用近似题补足 */
function examPick(cfg) {
  const { docId, kp, types, diffs, subject } = cfg;
  const want = Math.max(0, Math.floor(+cfg.count || 0));
  let pool = state.questions;
  if (subject) pool = pool.filter(q => matchSubject(q, subject));
  if (docId) pool = pool.filter(q => String(q.document_id) === docId);
  if (kp) pool = pool.filter(q => splitKP(q.knowledge_point).includes(kp));
  if (types && types.size) pool = pool.filter(q => types.has(q.type));
  if (diffs && diffs.size) pool = pool.filter(q => diffs.has(q.difficulty));

  const ded = examDedupe(pool);
  // ⑤ 跨场次轮换：没考过 > 考得少 > 最久没出现 > 随机
  const seen = examSeenMap();
  const rot = ded.kept.slice().sort((a, b) => {
    const sa = seen.get(a.id), sb = seen.get(b.id);
    const na = sa ? sa.n : 0, nb = sb ? sb.n : 0;
    if (na !== nb) return na - nb;
    const la = sa ? sa.last : 0, lb = sb ? sb.last : 0;
    if (la !== lb) return la - lb;
    return Math.random() - 0.5;
  });
  // ③ 知识点轮转：每个知识点轮流出一道，同一知识点不扎堆
  const buckets = new Map();
  rot.forEach(q => {
    const key = splitKP(q.knowledge_point)[0] || '未标注';
    let arr = buckets.get(key); if (!arr) buckets.set(key, arr = []);
    arr.push(q);
  });
  const order = shuffle([...buckets.keys()]);
  const items = [];
  while (items.length < want) {
    let added = 0;
    for (const key of order) {
      if (items.length >= want) break;
      const arr = buckets.get(key);
      if (arr && arr.length) { items.push(arr.shift()); added++; }
    }
    if (!added) break;
  }
  // ④ 去重后不够：先补近似题（依然是「不同措辞问同一件事」，但至少不是一模一样的）
  let approx = 0;
  if (items.length < want && ded.droppedNear.length) {
    for (const q of shuffle(ded.droppedNear)) {
      if (items.length >= want) break;
      items.push(q); approx++;
    }
  }
  return {
    items: shuffle(items),
    stats: {
      pool: pool.length, want,
      droppedExact: ded.droppedExact.length,
      droppedNear: ded.droppedNear.length,
      approx, uniqueKp: buckets.size,
    },
  };
}
/** 同一次组卷（预览 → 开始考试 → 导出）拿到同一套题：按条件 + 题库签名缓存几秒 */
function examPickCached(cfg) {
  let sig = pool => {
    let h = pool.length * 7919;
    for (const q of pool) h = (h * 31 + (q.id || 0) + String(q.content || '').length) % 2147483647;
    return h;
  };
  const key = JSON.stringify([
    cfg.docId || '', cfg.kp || '', cfg.subject || '', cfg.count | 0,
    [...(cfg.types || [])].sort(), [...(cfg.diffs || [])].sort(),
    state.questions.length, sig(state.questions),
  ]);
  const now = Date.now();
  if (examPickCache.key === key && now - examPickCache.at < EXAM_PICK_TTL && examPickCache.res) return examPickCache.res;
  const res = examPick(cfg);
  examPickCache = { key, at: now, res };
  return res;
}
/** 按条件挑卷（对外接口不变，返回题目数组） */
function pickExamItems(cfg) { return examPickCached(cfg).items; }

function bindExamKeys(it) {
  if (examKeyHandler) document.removeEventListener('keydown', examKeyHandler);
  examKeyHandler = e => {
    if (e.isComposing || isTypingTarget()) return;
    const letters = getAnswerLetters(it), k = e.key.toUpperCase();
    if (it.options && letters.includes(k)) {
      const el = [...document.querySelectorAll('#examAnswerArea .opt-click')].find(x => x.dataset.l === k);
      if (el) el.click();
      e.preventDefault(); return;
    }
    if (/^[1-9]$/.test(e.key)) {
      const idx = +e.key - 1;
      if (it.options && letters[idx]) {
        const el = [...document.querySelectorAll('#examAnswerArea .opt-click')].find(x => x.dataset.l === letters[idx]);
        if (el) el.click();
      } else if (it.type === 'true_false') {
        const tags = document.querySelectorAll('#examAnswerArea .tag');
        if (tags[idx]) tags[idx].click();
      }
      e.preventDefault(); return;
    }
    if (e.key === 'ArrowRight' && exam.idx < exam.items.length - 1) { e.preventDefault(); goExamQ(exam.idx + 1); }

async function submitExam(auto) {
  if (!exam || exam.finished) return;
  if (examTimer) { clearInterval(examTimer); examTimer = null; }
  exam.finished = true;
  const items = exam.items;
  const results = [];
  const subjective = items.filter(q => (q.type === 'short_answer') || (q.type === 'fill_blank' && /[\u4e00-\u9fa5]{4,}/.test(q.answer)));
  const useAI = state.settings.grading === 'ai' && state.settings.apiKey;
  let warnAI = subjective.length && !useAI;
  if (warnAI) toast('未配置 AI 判分，主观题将由你手动自评', 'err');
  for (let i = 0; i < items.length; i++) {
    const q = items[i];
    const user = exam.answers[q.id] ?? '';
    const max = examCfgScore[q.type] ?? (isCustomType(q.type) ? 5 : 0);
    let correct = false, note = '';
    if (q.type === 'short_answer' || (q.type === 'fill_blank' && /[\u4e00-\u9fa5]{4,}/.test(q.answer))) {
      if (useAI) {
        try {
          const r = await gradeSubjective(q, user);
          correct = !!r.correct; note = r.aiNote || '';
        } catch (err) { correct = false; note = 'AI 判分失败：' + err.message; }
      } else {
        correct = confirm(`【第 ${i + 1} 题 · 简答题自评】\n题干：${q.content.slice(0, 60)}\n参考答案：${q.answer}\n你的答案：${user || '（未作答）'}\n\n点击「确定」= 得分，点击「取消」= 不得分`);
        note = '考生自评';
      }
    } else {
      correct = !!user && gradeObjective(q, user);
    }
    if (!user) { correct = false; note = note || '未作答'; }
    results.push({
      qid: q.id, type: q.type, difficulty: q.difficulty, content: q.content,
      options: q.options, answer: q.answer, explanation: q.explanation,
      knowledge_point: q.knowledge_point, user, correct, note,
      score: correct ? max : 0, max,
    });
  }
  const obtained = results.reduce((s, r) => s + r.score, 0);
  const total = results.reduce((s, r) => s + r.max, 0);
  const rec = {
    name: exam.name, started_at: exam.startedAt, submitted_at: Date.now(),
    duration_sec: Math.round((Date.now() - exam.startedAt) / 1000),
    config: {
      ...(exam.cfg || {}),
      types: [...(((exam.cfg || {}).types) || [])],
      diffs: [...(((exam.cfg || {}).diffs) || [])],
      score: { ...examCfgScore },
    },
    results, obtained, total, auto_submit: auto ? 1 : 0,
  };
  exam.record = rec;
  // 记录练习与错题
  for (const r of results) {
    await DB.add('practice', { question_id: r.qid, is_correct: r.correct ? 1 : 0, answered_at: Date.now() });
    if (!r.correct && !state.mistakes.find(m => m.question_id === r.qid)) {
      await DB.add('mistakes', {
        question_id: r.qid, user_answer: r.user, correct_answer: r.answer,
        mistake_reason: r.note || `来自考试《${exam.name}》`, created_at: Date.now(),
        question_content: r.content, type: r.type, difficulty: r.difficulty,
      });
    }
  }
  await autoEnqueueIds(results.filter(r => !r.correct).map(r => r.qid));  // 考试错题自动入复习队列
  const newId = await DB.add('exams', rec);
  await refreshData();
  renderExamReport(newId);
}
