<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="72" height="72" role="img">
  <title>知识点图谱图标 · 方案C 三角互联</title>
  <desc>三个知识点两两互连加中心核，表达知识点互链</desc>
  <g stroke="#4f6ef7" stroke-width="1.6" fill="none" stroke-linecap="round">
    <line x1="12" y1="7.4" x2="5.6" y2="17.2"/>
    <line x1="12" y1="7.4" x2="18.4" y2="17.2"/>
    <line x1="5.6" y1="17.2" x2="18.4" y2="17.2" stroke-dasharray="2 2.6" opacity=".5"/>
    <line x1="12" y1="13.9" x2="12" y2="7.4" opacity=".45" stroke-width="1.3"/>
    <line x1="12" y1="13.9" x2="5.6" y2="17.2" opacity=".45" stroke-width="1.3"/>
    <line x1="12" y1="13.9" x2="18.4" y2="17.2" opacity=".45" stroke-width="1.3"/>
  </g>
  <circle cx="12" cy="5.4" r="2" fill="none" stroke="#4f6ef7" stroke-width="1.6"/>
  <circle cx="5.6" cy="17.2" r="2" fill="none" stroke="#4f6ef7" stroke-width="1.6"/>
  <circle cx="18.4" cy="17.2" r="2" fill="none" stroke="#4f6ef7" stroke-width="1.6"/>
  <circle cx="12" cy="13.9" r="1.7" fill="#4f6ef7"/>
